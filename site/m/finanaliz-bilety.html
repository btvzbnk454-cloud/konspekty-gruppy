<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Билеты по финанализу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#141B2A; --ink-2:#4B566A; --ink-3:#7A8599;
  --line:#DCE1EA; --line-2:#C9D0DC;
  --accent:#2743A6; --accent-ink:#FFFFFF; --accent-soft:#E6EBFA; --accent-line:#B9C6F0;
  --ok:#16804A; --ok-soft:#E1F3E8; --ok-line:#9BD3B1;
  --bad:#BF3A2B; --bad-soft:#FBE7E3; --bad-line:#EDB1A8;
  --star:#9A6200; --star-soft:#FFF2D3; --star-line:#EBCB82;
  --shadow:0 1px 2px rgba(20,27,42,.06),0 4px 16px rgba(20,27,42,.05);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E131B; --surface:#161D28; --surface-2:#1B2330; --ink:#E7EBF2; --ink-2:#A3AEC0; --ink-3:#7C889B;
    --line:#2A3444; --line-2:#364256;
    --accent:#90A7FF; --accent-ink:#0E131B; --accent-soft:#1D2849; --accent-line:#3A4C86;
    --ok:#55C688; --ok-soft:#12301F; --ok-line:#2C6B47;
    --bad:#FF8070; --bad-soft:#3A1C18; --bad-line:#7A3A31;
    --star:#F2B84B; --star-soft:#32270F; --star-line:#6D5321;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131B; --surface:#161D28; --surface-2:#1B2330; --ink:#E7EBF2; --ink-2:#A3AEC0; --ink-3:#7C889B;
  --line:#2A3444; --line-2:#364256;
  --accent:#90A7FF; --accent-ink:#0E131B; --accent-soft:#1D2849; --accent-line:#3A4C86;
  --ok:#55C688; --ok-soft:#12301F; --ok-line:#2C6B47;
  --bad:#FF8070; --bad-soft:#3A1C18; --bad-line:#7A3A31;
  --star:#F2B84B; --star-soft:#32270F; --star-line:#6D5321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:20px 56px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.star{background:var(--star-soft);border-color:var(--star-line);color:var(--star)}
.chip.var{border-color:var(--star-line);color:var(--star)}
.chip.calc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:8px 22px;border-bottom:1px dashed var(--line-2)}
.hero h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1.08;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{margin:10px 0 0;color:var(--ink-2);max-width:60ch}
.hero .src{font-size:13px;color:var(--ink-3);margin-top:6px}
.hero-cta{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:210px}
@media (max-width:680px){.hero{grid-template-columns:1fr}.hero-cta{flex-direction:row;flex-wrap:wrap;min-width:0}}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-block:18px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat b small{font-size:13px;color:var(--ink-3);font-weight:400}
.stat span{font-size:12.5px;color:var(--ink-2)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}.stat:last-child{grid-column:1/-1}}
.storage-note{font-size:12.5px;color:var(--bad);margin:6px 0 0}
section.blk{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-family:var(--f-disp);font-weight:500;font-size:19px;letter-spacing:-.005em}
.sec-h .muted{font-size:13.5px}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.day.now{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.day-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.day-n{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.day-h h3{font-size:16.5px;font-weight:700;margin-top:2px}
.day-h p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.day .badge{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.day .badge.done{background:var(--ok-soft);color:var(--ok)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.tick{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.tick svg{width:12px;height:12px;opacity:0}
.step.done .tick{background:var(--ok);border-color:var(--ok)}
.step.done .tick svg{opacity:1;color:#fff}
.step.done .step-l{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.step-l{font-size:14px;font-weight:600;line-height:1.35}
.step-l small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px;text-decoration:none}
.step .go{padding:5px 9px;font-size:12.5px}
.how{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.how summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"＋";color:var(--ink-3)}
.how[open] summary::after{content:"－"}
.how-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line)}
@media (max-width:640px){.how-grid{grid-template-columns:1fr}}
.how-item{padding:12px 14px;border-bottom:1px solid var(--line)}
.how-item:nth-child(odd){border-right:1px solid var(--line)}
@media (max-width:640px){.how-item:nth-child(odd){border-right:0}}
.how-item b{display:block;font-size:14px;margin-bottom:3px}
.how-item p{margin:0;font-size:13.5px;color:var(--ink-2)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:860px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.mode .m-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mode .m-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .m-ic svg{width:17px;height:17px}
.mode .m-count{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.mode b{font-size:15px}
.mode span.d{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.mode.exam{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.exam .m-ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.mode.exam span.d,.mode.exam .m-count{color:var(--accent-ink);opacity:.85}
.mode.star .m-ic{background:var(--star-soft);color:var(--star)}
.mode.err .m-ic{background:var(--bad-soft);color:var(--bad)}
.tickets{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
@media (max-width:720px){.tickets{grid-template-columns:repeat(4,1fr)}}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 8px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tk:hover{border-color:var(--accent-line)}
.tk .n{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1}
.tk .l{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.tk .r{font-size:12px;font-weight:600;color:var(--ink-3);min-height:18px}
.tk.pass{border-color:var(--ok-line);background:var(--ok-soft)}
.tk.pass .r{color:var(--ok)}
.tk.fail{border-color:var(--bad-line);background:var(--bad-soft)}
.tk.fail .r{color:var(--bad)}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:760px){.topics{grid-template-columns:1fr}}
.tb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tb-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tb-h .eyebrow{display:block}
.tb-h b{font-size:15px}
.tr{display:grid;grid-template-columns:1fr 92px auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.tr:first-of-type{border-top:0}
.tr:hover{background:var(--accent-soft)}
.tr .nm{font-size:14px}
.tr .ct{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--line);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}
.bar .r{background:var(--bad)}
.foot{margin-top:40px;padding-top:16px;border-top:1px dashed var(--line-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- QUIZ ---------- */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.qbar .ttl{font-family:var(--f-disp);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .ttl small{font-family:var(--f-body);font-weight:400;color:var(--ink-3);font-size:13px;margin-left:8px}
.qbar .rt{display:flex;gap:10px;align-items:center}
@media (max-width:520px){.qbar .ttl small{display:none}.qbar{gap:8px}}
.timer{font-family:var(--f-mono);font-weight:600;font-size:15px;padding:4px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.counter{font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.strip-wrap{overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:thin}
.strip{display:flex;gap:4px;min-width:min-content}
.cell{width:30px;height:30px;flex:0 0 30px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0;color:var(--ink-2)}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.ans{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.gap{margin-left:10px}
.ticket{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ticket-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1.5px dashed var(--line-2);position:relative}
.ticket-h::before,.ticket-h::after{content:"";position:absolute;bottom:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket-h::before{left:-9px;clip-path:inset(0 0 0 50%)}
.ticket-h::after{right:-9px;clip-path:inset(0 50% 0 0)}
.ticket-h .chips{display:flex;gap:6px;flex-wrap:wrap}
.ticket-b{padding:18px 18px 16px}
@media (max-width:520px){.ticket-b{padding:16px 14px 14px}.ticket-h{padding:10px 14px}}
.qtext{font-size:clamp(17px,2.4vw,19.5px);font-weight:600;line-height:1.42;max-width:70ch}
.qhint{margin:8px 0 0;font-size:13px;color:var(--star);font-weight:600}
.opts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;text-align:left;padding:11px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:15px;line-height:1.42;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .num{width:26px;height:26px;border-radius:6px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.opt.multi .num{border-radius:5px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .num{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .num{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .mark{font-size:12px;font-weight:700;align-self:center;white-space:nowrap}
.opt.correct .mark{color:var(--ok)}
.opt.wrong .mark{color:var(--bad)}
.opt.missed .mark{color:var(--ok)}
.fb{margin-top:14px;border-radius:9px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2)}
.fb .vd{font-weight:700;display:flex;align-items:center;gap:8px}
.fb.ok .vd{color:var(--ok)}
.fb.bad .vd{color:var(--bad)}
.fb p{margin:6px 0 0;font-size:14.5px;max-width:75ch}
.fb .src{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.qnav .r{display:flex;gap:8px;margin-left:auto}
.kbd{font-size:12px;color:var(--ink-3);margin-top:12px}
.kbd kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
@media (hover:none){.kbd{display:none}}
.banner{margin-top:12px;border:1px solid var(--star-line);background:var(--star-soft);color:var(--ink);border-radius:9px;padding:10px 14px;font-size:14px}
.banner b{color:var(--star)}

/* ---------- RESULT ---------- */
.res-top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
@media (max-width:600px){.res-top{grid-template-columns:1fr}}
.res-top h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(22px,4vw,30px)}
.res-top p{margin:8px 0 0;color:var(--ink-2);max-width:60ch}
.score{font-family:var(--f-mono);font-size:15px;margin-top:10px}
.score b{font-size:28px}
.stamp{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;padding:10px 18px;border:3px solid currentColor;border-radius:10px;transform:rotate(-7deg);justify-self:center;text-align:center;line-height:1.1;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 4px currentColor}
.stamp small{display:block;font-size:10px;letter-spacing:.14em;margin-top:4px;font-family:var(--f-body);font-weight:700}
.stamp.pass{color:var(--ok)}
.stamp.fail{color:var(--bad)}
.stamp.neutral{color:var(--accent)}
.res-blocks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.res-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rev{margin-top:22px}
.rev h3{font-size:16px;margin-bottom:10px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.rev-item .q{font-weight:600}
.rev-item .a{margin-top:6px;font-size:14px}
.rev-item .a .y{color:var(--bad)}
.rev-item .a .c{color:var(--ok)}
.rev-item .e{margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.rev-item .s{margin-top:4px;font-size:12px;color:var(--ink-3)}

/* ---------- CARDS ---------- */
.card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px}
.card .cq{font-size:clamp(18px,2.6vw,21px);font-weight:700;line-height:1.35;max-width:60ch;margin-top:6px}
.card textarea{width:100%;min-height:120px;margin-top:14px;border:1px solid var(--line-2);border-radius:9px;padding:12px;font:inherit;font-size:15px;background:var(--surface-2);color:var(--ink);resize:vertical}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.key{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3)}
.key.hit{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.key.miss{border-style:dashed}
.cov{margin-top:10px;font-size:14px;font-weight:600}
.ref{margin-top:12px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px}
.ref .src{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.filters .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.boxes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-2)}

/* ---------- CHEAT ---------- */
.cheat-nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.cs{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.cs h2{font-family:var(--f-disp);font-weight:500;font-size:18px}
.cs .lead{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:70ch}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.t{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.f{font-family:var(--f-mono);font-weight:600;white-space:nowrap;color:var(--accent)}
.rule{margin-top:14px;padding:12px 14px;border-radius:9px;background:var(--star-soft);border:1px solid var(--star-line);font-size:14.5px}
.rule b{color:var(--star)}
.ladder{margin-top:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lr{display:grid;grid-template-columns:22px 1fr 54px 76px;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:14px}
.lr:first-child{border-top:0}
.lr .op{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);text-align:center}
.lr .cd{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.lr .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.lr.res{background:var(--surface-2);font-weight:700}
.lr.res .op{color:var(--accent)}
.lr.res .nm .bar2{height:4px;margin-top:4px;border-radius:99px;background:var(--accent);opacity:.8}
.lr .nm small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
@media (max-width:520px){.lr{grid-template-columns:18px 1fr 64px;}.lr .cd{display:none}}
.pairs{display:grid;gap:10px;margin-top:12px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pair > div{padding:10px 12px;border-left:1px solid var(--line);font-size:14px}
.pair > div:first-child{border-left:0}
.pair > div b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.lists{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (max-width:720px){.lists{grid-template-columns:1fr}}
.li{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.li b{display:block;font-size:14px}
.li .mn{font-family:var(--f-mono);font-weight:600;color:var(--star);font-size:13px;margin-top:2px}
.li p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.formulas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media (max-width:720px){.formulas{grid-template-columns:1fr}}
.fm{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.fm .fx{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--accent)}
.fm p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.hide-mode .ans{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.hide-mode .ans.shown{filter:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- KR ---------- */
.kr-box{display:grid;grid-template-columns:1fr auto;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-top:26px}
@media (max-width:760px){.kr-box{grid-template-columns:1fr}}
.kr-main{padding:18px 18px 16px;border-left:5px solid var(--star)}
.kr-main h2{font-family:var(--f-disp);font-weight:500;font-size:20px;margin-top:4px}
.kr-main p{margin:8px 0 0;color:var(--ink-2);font-size:14px;max-width:72ch}
.kr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kr-side{display:flex;flex-direction:column;justify-content:center;gap:0;border-left:1px solid var(--line);background:var(--surface-2);min-width:190px}
@media (max-width:760px){.kr-side{flex-direction:row;border-left:0;border-top:1px solid var(--line);min-width:0}}
.kr-stat{padding:10px 16px;border-top:1px solid var(--line);flex:1}
.kr-stat:first-child{border-top:0}
@media (max-width:760px){.kr-stat{border-top:0;border-left:1px solid var(--line)}.kr-stat:first-child{border-left:0}}
.kr-stat b{display:block;font-size:20px;font-weight:600}
.kr-stat b small{font-size:12px;color:var(--ink-3);font-weight:400}
.kr-stat span{font-size:12px;color:var(--ink-2)}
.krpart{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.krpart b{color:var(--star)}
.open-in{width:100%;min-height:150px;margin-top:14px;border:1px solid var(--line-2);border-radius:9px;padding:12px;font:inherit;font-size:15px;background:var(--surface-2);color:var(--ink);resize:vertical}
.rev-item.good{border-left-color:var(--ok)}
.rev-item.compact{padding:8px 14px}
.rev-item.compact .q{font-weight:500;font-size:14px;color:var(--ink-2)}
.rev-item .row{display:flex;gap:8px}
</style>

<div id="app"></div>
<script>
(function(){"use strict";
const Q=[];
// БЛОК 1 — Основы финансового анализа (40)
Q.push(
{b:1,t:"b1a",k:1,fix:1,q:"Внутренний и внешний анализ финансово-хозяйственной деятельности предприятия, осуществляемый на основании данных публичной отчётности и проводимый как внутри, так и за пределами предприятия заинтересованными лицами, — это…",o:["управленческий анализ","финансовый анализ","статистический анализ","анализ движения материальных ценностей на предприятии"],a:1,e:"Только финансовый анализ бывает и внешним, и внутренним и опирается на публичную (бухгалтерскую) отчётность. Управленческий анализ — только внутренний и работает с закрытыми данными.",s:"Конспект: «Выделяют два вида ФА: внешний и внутренний»; Крылов, с. 6"},
{b:1,t:"b1a",q:"Как в конспекте определяется финансовый анализ?",o:["Составление на основе бухгалтерской, финансовой, статистической и другой отчётности аналитического обоснования управленческих решений, направленных на достижение поставленных целей","Ведение бухгалтерского учёта и составление финансовой отчётности","Проверка достоверности бухгалтерской отчётности независимым лицом","Расчёт налоговых обязательств организации"],a:0,e:"Ключевые слова определения: отчётность → аналитическое обоснование → управленческие решения → цели. Ведение учёта — бухгалтерия, проверка достоверности — аудит.",s:"Конспект, первая строка"},
{b:1,t:"b1a",q:"Термин «анализ» означает…",o:["метод научного исследования: мысленное или фактическое разложение целого на составные части","объединение отдельных частей в единое целое","сопоставление изучаемого явления с уже известными","количественное измерение влияния факторов на результат"],a:0,e:"Анализ — разложение целого на части. Обратная операция — синтез; «единство анализа и синтеза» — один из принципов метода ФА. Сопоставление с известным — это сравнение.",s:"Конспект, определение анализа"},
{b:1,t:"b1a",q:"«Систематизированная совокупность аналитических процедур, имеющих целью получение заключений, выводов и рекомендаций экономического характера» — это определение…",o:["экономического анализа","финансового анализа","аудита","управленческого учёта"],a:0,e:"В конспекте это определение экономического анализа (оно дано в кавычках). Финансовый анализ — его разновидность.",s:"Конспект, определение экономического анализа"},
{b:1,t:"b1a",q:"Как соотносятся экономический и финансовый анализ?",o:["Финансовый анализ — вид экономического анализа, исследующий финансовые результаты и финансовое состояние","Экономический анализ — часть финансового","Это синонимы","Финансовый анализ относится к бухгалтерскому учёту, а не к экономическому анализу"],a:0,e:"ФА — часть (вид) экономического анализа. На схеме комплексного анализа ФА — ветвь «анализ объектов финансового управления».",s:"Крылов, с. 5; Конспект, рис. 1.2"},
{b:1,t:"b1a",q:"На схеме комплексного анализа деятельности организации (рис. 1.2) финансовый анализ — это…",o:["анализ объектов финансового управления","анализ функциональных областей деятельности","анализ эффективности производства","анализ эффективности управления персоналом"],a:0,e:"Схема делит экономический анализ на две ветви: 1) функциональные области — маркетинг, НИОКР, производство, логистика, персонал, финансовый менеджмент; 2) объекты финансового управления = финансовый анализ: источники финансирования, основной и оборотный капитал, доходы и расходы, финансовые результаты, движение денежных средств.",s:"Конспект, рис. 1.2"},
{b:1,t:"b1a",q:"По широте охвата сторон деятельности экономический анализ делится на…",o:["полный и тематический","ретроспективный, оперативный и перспективный","внешний и внутренний","предварительный и углублённый"],a:0,e:"Рис. 1.1: широта охвата → полный / тематический; временной аспект → ретроспективный / оперативный / перспективный. Внешний/внутренний — виды ФА, предварительный/углублённый — его этапы.",s:"Конспект, рис. 1.1"},
{b:1,t:"b1a",q:"По временному аспекту выделяют анализ…",o:["ретроспективный, оперативный и перспективный","полный и тематический","горизонтальный и вертикальный","внешний и внутренний"],a:0,e:"Прошлое — ретроспективный, текущее — оперативный, будущее — перспективный.",s:"Конспект, рис. 1.1"},
{b:1,t:"b1a",q:"Что НЕ является основной функцией финансового анализа?",o:["ведение бухгалтерского учёта хозяйственных операций","объективная оценка финансового состояния","выявление факторов и причин достигнутого финансового состояния","выявление и мобилизация резервов улучшения финансового состояния"],a:0,e:"Четыре функции: оценка → факторы и причины → подготовка и обоснование решений → резервы. Учёт ведёт бухгалтерия, ФА только использует его данные.",s:"Конспект, «Основными функциями ФА являются»"},
{b:1,t:"b1a",q:"Отметьте все основные функции финансового анализа.",o:["объективная оценка финансового состояния объекта анализа","выявление факторов и причин достигнутого финансового состояния","подготовка и обоснование принимаемых финансовых решений","выявление и мобилизация резервов улучшения финансового состояния","составление бухгалтерской (финансовой) отчётности","утверждение учётной политики организации"],a:[0,1,2,3],e:"Мнемоника: «Оценил → нашёл Причины → обосновал Решение → мобилизовал Резервы». Составление отчётности и учётная политика — функции бухгалтерии.",s:"Конспект, функции ФА"},
{b:1,t:"b1a",q:"В каком случае финансовый анализ, по конспекту, НЕ применяется?",o:["при начислении заработной платы работникам","при выявлении проблем в текущей и инвестиционной деятельности","как инструмент прогнозирования будущих финансовых условий и результатов","при оценке вариантов инвестирования капитала"],a:0,e:"ФА применяется в четырёх случаях: выявление проблем в текущей и инвестиционной деятельности; прогнозирование; управление хозяйствующим субъектом; оценка вариантов инвестирования.",s:"Конспект, «ФА в организациях применяется»"},
{b:1,t:"b1a",q:"Основные категории метода финансового анализа — это…",o:["показатели, факторы, резервы","активы, пассивы, капитал","доходы, расходы, прибыль","план, факт, норматив"],a:0,e:"Мнемоника «ПФР»: Показатели — Факторы — Резервы.",s:"Конспект, «Основными категориями метода ФА являются…»"},
{b:1,t:"b1a",q:"Какой подход назван одним из основных методов ФА как составной части комплексного экономического анализа?",o:["диалектический","экспертный","бухгалтерский","нормативный"],a:0,e:"Диалектический подход: финансовые потоки в постоянном движении (изучаем динамику через сравнения), исследуем систему показателей во взаимосвязи и причинно-следственных связях, количественно измеряем влияние факторов.",s:"Конспект, диалектический подход"},
{b:1,t:"b1a",q:"Что НЕ относится к принципам метода финансового анализа?",o:["принцип двойной записи","единство анализа и синтеза","изучение явлений во взаимосвязи, в развитии от простого к сложному","переход от количественных изменений к качественным"],a:0,e:"Двойная запись — принцип бухгалтерского учёта. Принципы метода ФА: единство анализа и синтеза, взаимосвязь, развитие от простого к сложному, переход от количества к качеству, сравнение.",s:"Конспект, принципы метода"},
{b:1,t:"b1b",k:1,q:"Что является предметом финансового анализа?",o:["финансовые результаты и финансовое состояние организации","финансовые аспекты хозяйственной деятельности организации","данные бухгалтерского учёта и финансовой отчётности","система финансовых коэффициентов"],a:0,e:"Не путай тройку: ПРЕДМЕТ — что изучаем (результаты + состояние); ОБЪЕКТ — финансовые аспекты хоз. деятельности; ИНФОБАЗА — данные учёта и отчётности. В контрольной это был открытый вопрос.",s:"Конспект; Крылов, с. 5"},
{b:1,t:"b1b",q:"Объект финансового анализа — это…",o:["финансовые аспекты хозяйственной деятельности организации","финансовые результаты и финансовое состояние организации","бухгалтерский баланс организации","собственники и кредиторы организации"],a:0,e:"Объект — финансовые АСПЕКТЫ хозяйственной деятельности. Результаты и состояние — это предмет.",s:"Конспект; Крылов, с. 6"},
{b:1,t:"b1b",q:"Информационная база финансового анализа — это…",o:["данные бухгалтерского учёта и финансовой отчётности организации","финансовые результаты и финансовое состояние","финансовые аспекты хозяйственной деятельности","только данные государственной статистики"],a:0,e:"Инфобаза = учёт + отчётность.",s:"Конспект; Крылов, с. 6"},
{b:1,t:"b1b",k:1,q:"В чём заключается цель ВНЕШНЕГО финансового анализа?",o:["в оценке (внешнего) рейтинга организации, её финансовой устойчивости, платёжеспособности и надёжности, т. е. в уменьшении риска взаимодействия с ней контрагентов","в рассмотрении состояния финансовых ресурсов, внутренней оценке рейтинга и выявлении резервов","в проверке правильности ведения бухгалтерского учёта","в расчёте налоговой базы организации"],a:0,e:"Внешний анализ отвечает контрагенту на вопрос «можно ли с ними работать?» → снижение риска. Внутренний — «где резервы и как управлять ликвидностью?». В контрольной это был открытый вопрос «Назовите цель ФА».",s:"Конспект; Крылов, с. 6"},
{b:1,t:"b1b",k:1,q:"В чём заключается цель ВНУТРЕННЕГО финансового анализа?",o:["рассмотреть состояние финансовых ресурсов, дать внутреннюю оценку рейтинга и выявить финансовые резервы — в итоге обеспечить эффективное управление ликвидностью","оценить внешний рейтинг организации и уменьшить риск взаимодействия с ней контрагентов","проверить достоверность отчётности для акционеров","определить рыночную стоимость акций организации"],a:0,e:"Цепочка внутреннего анализа: ресурсы → внутренний рейтинг → резервы → управление ЛИКВИДНОСТЬЮ.",s:"Конспект; Крылов, с. 6"},
{b:1,t:"b1b",q:"Под финансовым состоянием организации понимается…",o:["способность организации финансировать свою деятельность","сумма чистой прибыли за период","стоимость имущества по балансу","соотношение выручки и себестоимости"],a:0,e:"Финансовое состояние характеризуется обеспеченностью финансовыми ресурсами, целесообразностью их размещения, интенсивностью и эффективностью использования.",s:"Конспект; Крылов, с. 5"},
{b:1,t:"b1b",q:"Ключевая характеристика финансового состояния — это…",o:["платёжеспособность","рентабельность продаж","выручка","доля основных средств в имуществе"],a:0,e:"Финансовое состояние — конечный результат всей хозяйственной деятельности; его ключевая характеристика — платёжеспособность.",s:"Конспект; Крылов, с. 5"},
{b:1,t:"b1b",q:"Что НЕ относится к финансовым результатам организации в понимании учебника?",o:["рентабельность продаж","валовая прибыль","совокупный финансовый результат","нераспределённая прибыль"],a:0,e:"Финансовые результаты — это 7 показателей ПРИБЫЛИ из отчётности: валовая, от продаж, от прочей деятельности, до налогообложения, чистая, совокупный финрезультат, нераспределённая. Рентабельность — относительный показатель.",s:"Конспект; Крылов, с. 5"},
{b:1,t:"b1b",q:"Отметьте все показатели, которые относятся к финансовым результатам организации.",o:["валовая прибыль","прибыль от прочей деятельности","совокупный финансовый результат","нераспределённая прибыль","выручка","себестоимость продаж"],a:[0,1,2,3],e:"Выручка — доход, себестоимость — расход; финансовые результаты — это разные виды прибыли.",s:"Конспект; Крылов, с. 5"},
{b:1,t:"b1b",q:"Какая из задач финансового анализа названа в учебнике?",o:["оценить финансовую устойчивость организации","составить бухгалтерский баланс","начислить амортизацию основных средств","утвердить учётную политику"],a:0,e:"Задачи ФА: финрезультаты, имущественное положение, финансовая устойчивость, платёжеспособность и ликвидность, деловая активность, комплексная оценка, рекомендации, прогноз.",s:"Крылов, с. 6–7"},
{b:1,t:"b1c",q:"Пользователи с ПРЯМЫМ финансовым интересом — это…",o:["кредиторы и инвесторы","налоговые органы","работники и профсоюзы","статистические органы"],a:0,e:"Прямой интерес у тех, кто даёт (собирается дать) кредиты и займы или вкладывает капитал: их цель — максимальная прибыль на вложенные средства.",s:"Крылов, с. 6"},
{b:1,t:"b1c",q:"Кто НЕ относится к пользователям с НЕПРЯМЫМ финансовым интересом?",o:["кредиторы","налоговые органы","деловые партнёры","статистические органы"],a:0,e:"Непрямой интерес: налоговые и финансовые органы, деловые партнёры, работники и профсоюзы, местные власти, регуляторы, покупатели, общество, консультанты, статистика. Кредиторы — прямой интерес.",s:"Крылов, с. 6"},
{b:1,t:"b1c",q:"Кто относится к ВНУТРЕННИМ пользователям финансовой информации?",o:["собственники и топ-менеджеры","кредиторы и поставщики","государство и общество","клиенты"],a:0,e:"По таблице конспекта внутренние пользователи — собственники, топ-менеджеры, работники. У Крылова — администрация и собственники.",s:"Конспект, таблица групп пользователей; Крылов, с. 6"},
{b:1,t:"b1c",q:"Что интересует поставщиков ресурсов как пользователей финансовой информации?",o:["ликвидность, платёжеспособность и финансовая устойчивость организации","сохранение рабочих мест и рост заработной платы","своевременные и полные налоговые поступления","надёжность поставок и стоимость товаров"],a:0,e:"Поставщикам важно, заплатят ли им, поэтому объект их анализа — финансовое положение.",s:"Конспект, таблица групп пользователей"},
{b:1,t:"b1c",q:"Государство как пользователь финансовой информации интересуется прежде всего…",o:["своевременными и полными налоговыми поступлениями","доходностью капитала","надёжностью поставок","ликвидностью организации"],a:0,e:"Объект анализа для государства — финансовые результаты (с них платят налоги).",s:"Конспект, таблица групп пользователей"},
{b:1,t:"b1c",q:"Какая группа пользователей анализирует всю внутрихозяйственную информацию?",o:["топ-менеджеры","собственники","работники","государство"],a:0,e:"Интерес топ-менеджеров — стабильное финансовое положение и динамичное развитие организации; объект — вся внутрихозяйственная информация.",s:"Конспект, таблица групп пользователей"},
{b:1,t:"b1c",q:"Что интересует собственников организации?",o:["доходность капитала и финансовая устойчивость организации","сохранение рабочих мест","надёжность поставок и стоимость товаров","обеспечение занятости и охрана окружающей среды"],a:0,e:"Объекты анализа собственников — и финансовое положение, и финансовые результаты.",s:"Конспект, таблица групп пользователей"},
{b:1,t:"b1d",k:1,fix:1,q:"Закрытая для посторонних лиц, строго засекреченная отчётность, содержащая сведения о себестоимости отдельных видов продукции, выпускаемой предприятием, — это…",o:["финансовая отчётность","управленческая отчётность","бухгалтерская отчётность"],a:1,e:"Управленческая отчётность — внутренняя, для руководства; себестоимость по видам продукции — коммерческая тайна. Финансовая и бухгалтерская отчётность — публичные, для внешних пользователей.",s:"Банк тестов к контрольной; в учебнике прямо не описано"},
{b:1,t:"b1d",v:1,q:"Публичная отчётность, которую организация раскрывает внешним пользователям (акционерам, кредиторам), — это…",o:["финансовая (бухгалтерская) отчётность","управленческая отчётность","внутренний отчёт о себестоимости продукции","отчёт о выполнении бизнес-плана"],a:0,e:"Пара для запоминания: ПУБЛИЧНАЯ → финансовая/бухгалтерская; ЗАКРЫТАЯ → управленческая.",s:"Конспект, состав форм финансовой отчётности"},
{b:1,t:"b1d",q:"К какому уровню информационного обеспечения ФА относятся данные бухгалтерского учёта и отчётности?",o:["системный","несистемный","методический","организационный"],a:0,e:"Пять уровней: законодательно-нормативный → методический → организационный → системный (учёт и отчётность — наиболее полно соответствуют целям ФА) → несистемный.",s:"Конспект, таблица «Структура информационного обеспечения ФА»"},
{b:1,t:"b1d",q:"Данные аудиторских компаний, публикуемые в массовой печати, относятся к уровню информации…",o:["несистемный","системный","законодательно-нормативный","методический"],a:0,e:"Несистемный уровень — сведения различного характера и прочая информация, получаемая в ходе контактов с контрагентами.",s:"Конспект, таблица «Структура информационного обеспечения ФА»"},
{b:1,t:"b1d",q:"Приказы и распоряжения в рамках учётной политики организации — это уровень информации…",o:["организационный","методический","системный","несистемный"],a:0,e:"Организационный уровень = организационно-распорядительная информация.",s:"Конспект, таблица «Структура информационного обеспечения ФА»"},
{b:1,t:"b1d",q:"Федеральные законы, постановления, положения и стандарты по бухгалтерскому учёту относятся к уровню…",o:["законодательно-нормативный","методический","организационный","системный"],a:0,e:"Методический уровень — это нормативные акты и методические указания, а законы и стандарты — законодательно-нормативный.",s:"Конспект, таблица «Структура информационного обеспечения ФА»"},
{b:1,t:"b1d",q:"Какая форма по РСБУ соответствует «Отчёту о прибылях и убытках» по МСФО?",o:["Отчёт о финансовых результатах","Бухгалтерский баланс","Отчёт об изменениях капитала","Пояснения"],a:0,e:"Пары РСБУ ↔ МСФО: баланс ↔ баланс; ОФР ↔ отчёт о прибылях и убытках; изменения капитала ↔ движение капитала; движение ДС ↔ движение ДС; пояснения ↔ учётная политика и пояснительная записка.",s:"Конспект, таблица «Состав форм финансовой отчётности»"},
{b:1,t:"b1d",q:"Какой формы НЕТ в составе финансовой отчётности по РСБУ?",o:["Бизнес-план","Бухгалтерский баланс","Отчёт о движении денежных средств","Пояснения"],a:0,e:"5 форм РСБУ: баланс, отчёт о финансовых результатах, отчёт об изменениях капитала, отчёт о движении денежных средств, пояснения.",s:"Конспект, таблица «Состав форм финансовой отчётности»"},
{b:1,t:"b1d",q:"Разделу «Учётная политика и пояснительная записка» по МСФО в РСБУ соответствуют…",o:["Пояснения","Отчёт об изменениях капитала","Отчёт о финансовых результатах","Бухгалтерский баланс"],a:0,e:"Последняя строка таблицы: Пояснения ↔ Учётная политика и пояснительная записка.",s:"Конспект, таблица «Состав форм финансовой отчётности»"}
);

// БЛОК 2 — Этапы и методические приёмы (40)
Q.push(
{b:2,t:"b2a",q:"Сколько этапов выделяют в финансовом анализе?",o:["четыре","три","два","пять"],a:0,e:"I — предварительный; II — углублённый; III — обобщение результатов → рекомендации; IV — прогнозирование. Мнемоника «ПУОП»: Посмотрел — Углубился — Обобщил — Предсказал.",s:"Конспект; Крылов, с. 7"},
{b:2,t:"b2a",q:"Какова правильная последовательность этапов финансового анализа?",o:["предварительный → углублённый → обобщение и рекомендации → прогнозирование","углублённый → предварительный → прогнозирование → обобщение","прогнозирование → предварительный → углублённый → обобщение","предварительный → прогнозирование → углублённый → обобщение"],a:0,e:"Сначала быстро и просто, потом подробно, потом выводы и рекомендации, в конце — прогноз.",s:"Конспект; Крылов, с. 7"},
{b:2,t:"b2a",q:"На каком этапе результаты финансового анализа переходят в разработку рекомендаций?",o:["III — обобщение результатов","I — предварительный анализ","II — углублённый анализ","IV — прогнозирование"],a:0,e:"III этап: обобщение результатов, переходящее в разработку рекомендаций по повышению финрезультатов и улучшению финсостояния.",s:"Конспект; Крылов, с. 7"},
{b:2,t:"b2a",q:"Цель предварительного финансового анализа — это…",o:["наглядная и несложная (по времени и трудоёмкости) оценка финансового состояния","подробная характеристика финансовых результатов и состояния и возможностей их изменения","прогноз финансовых результатов на следующий год","разработка рекомендаций по улучшению финансового состояния"],a:0,e:"Предварительный = быстро и наглядно; углублённый = подробно.",s:"Крылов, с. 7"},
{b:2,t:"b2a",q:"Цель углублённого финансового анализа — это…",o:["достаточно подробная характеристика финрезультатов и финсостояния за истекший период и возможностей их изменения на ближайшую и долгосрочную перспективу","наглядная и несложная оценка финансового состояния","проверка комплектности финансовой отчётности","построение реклассифицированного баланса"],a:0,e:"Углублённый анализ опирается на все формы отчётности и данные бухучёта и конкретизирует, расширяет, дополняет предварительный.",s:"Крылов, с. 9"},
{b:2,t:"b2a",q:"Что НЕ входит в предварительный финансовый анализ?",o:["анализ консолидированной финансовой отчётности","подготовительный этап","предварительный обзор финансовой отчётности","расчёт и анализ важнейших аналитических показателей"],a:0,e:"Три подэтапа предварительного анализа: подготовительный → обзор отчётности → расчёт важнейших показателей. Консолидированная отчётность — специальный раздел ФА.",s:"Крылов, с. 7"},
{b:2,t:"b2a",q:"Подготовительный этап предварительного анализа сводится к…",o:["визуальной и простейшей счётной проверке отчётности и построению аналитического (реклассифицированного) баланса","ознакомлению с аудиторским заключением и пояснительной запиской","расчёту коэффициентов ликвидности","прогнозированию финансовых результатов"],a:0,e:"Проверяют комплектность, правильность и ясность заполнения, реквизиты, арифметику и контрольные соотношения; перегруппировывают статьи баланса. Аудиторское заключение смотрят на следующем подэтапе — обзоре отчётности.",s:"Крылов, с. 7–8"},
{b:2,t:"b2a",q:"Какие формы отчётности — главный источник для расчёта показателей в предварительном ФА?",o:["бухгалтерский баланс и отчёт о финансовых результатах","все формы отчётности и данные бухучёта","управленческая отчётность","данные государственной статистики"],a:0,e:"Предварительный анализ — по двум важнейшим формам. Все формы и данные учёта нужны углублённому анализу.",s:"Крылов, с. 8"},
{b:2,t:"b2a",q:"В таблице показателей предварительного ФА коэффициент финансовой независимости относится к направлению…",o:["анализ финансовой устойчивости","анализ имущественного положения","анализ платёжеспособности и ликвидности","анализ деловой активности"],a:0,e:"Финустойчивость: коэффициенты финансовой независимости, обеспеченности собственными средствами, мобильности собственного капитала.",s:"Конспект, «Совокупность показателей для предварительного ФА»; Крылов, табл. 1.1"},
{b:2,t:"b2a",q:"Рентабельность продаж, активов и собственного капитала в предварительном ФА относятся к направлению…",o:["анализ деловой активности","анализ финансовой устойчивости","анализ имущественного положения","анализ платёжеспособности и ликвидности"],a:0,e:"Деловая активность: оборачиваемость оборотных активов, оборачиваемость активов, рентабельность продаж, активов, собственного капитала.",s:"Конспект; Крылов, табл. 1.1"},
{b:2,t:"b2a",q:"Что из перечисленного — специальный раздел ФА, а не часть анализа финансового состояния?",o:["анализ сегментной отчётности","рейтинговая оценка финансового состояния","оценка финансовой несостоятельности","анализ деловой активности"],a:0,e:"Специальные разделы: инфляция, консолидированная отчётность, сегментная отчётность, переход к МСФО, прогнозный анализ.",s:"Конспект, составляющие углублённого ФА; Крылов, с. 9"},
{b:2,t:"b2a",q:"Отметьте все специальные разделы финансового анализа.",o:["ФА в условиях инфляции","анализ консолидированной финансовой отчётности","анализ сегментной отчётности","ФА в условиях перехода к МСФО","прогнозный финансовый анализ","оценка финансовой несостоятельности"],a:[0,1,2,3,4],e:"Оценка несостоятельности входит в анализ финансового состояния (п. 2.6), а не в специальные разделы.",s:"Конспект; Крылов, с. 9"},
{b:2,t:"b2b",q:"Какой приём НЕ входит в перечень основных методических приёмов ФА?",o:["метод экспертных оценок","способ цепных подстановок","балансовый способ","группировка"],a:0,e:"10 приёмов: абсолютные, относительные, средние величины; сравнение; группировка; графический; табличный; балансовый; цепные подстановки; абсолютные разницы.",s:"Крылов, с. 10; Конспект"},
{b:2,t:"b2b",q:"Как используются абсолютные величины в финансовом анализе?",o:["как информационная база для расчёта относительных и средних величин и как расчётные показатели (абсолютные показатели финустойчивости, ликвидности баланса)","только как база сравнения для темпов роста","только для прогнозирования","только в вертикальном анализе"],a:0,e:"Два направления: 1) показатели отчётности как база для расчётов; 2) самостоятельные расчётные абсолютные показатели.",s:"Конспект; Крылов, с. 10"},
{b:2,t:"b2b",q:"Какие три вида относительных величин получили наибольшее применение в ФА?",o:["структуры, динамики и финансовые коэффициенты","абсолютные, средние и предельные","плановые, фактические и нормативные","базисные, цепные и средние"],a:0,e:"Структура → вертикальный анализ; динамика → горизонтальный и трендовый; финансовые коэффициенты — отдельный вид анализа.",s:"Конспект; Крылов, с. 10"},
{b:2,t:"b2b",q:"Относительная величина структуры — это…",o:["доля (удельный вес) части в общем","отношение текущего уровня показателя к предыдущему","отношение показателей из разных форм отчётности","средняя величина за период"],a:0,e:"Примеры: доля оборотных активов в имуществе, доля краткосрочных обязательств в заёмных средствах. Основа вертикального анализа.",s:"Конспект; Крылов, с. 10–11"},
{b:2,t:"b2b",k:1,fix:1,q:"Вертикальный анализ бухгалтерского баланса проводится на основе…",o:["изменения абсолютной величины показателей","структуры активов и пассивов баланса","темпов роста (снижения) показателей"],a:1,e:"Вертикальный = структурный: определение структуры итоговых показателей (удельные веса). Темпы роста — это горизонтальный анализ.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",v:1,q:"«Определение структуры итоговых финансовых показателей с выявлением влияния каждой позиции отчётности на результат в целом» — это…",o:["вертикальный (структурный) анализ","горизонтальный анализ","трендовый анализ","факторный анализ"],a:0,e:"Слово-маркер «структура» → вертикальный анализ.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",k:1,fix:1,q:"Сравнение каждой позиции отчётности с предыдущим периодом — это…",o:["анализ финансовых коэффициентов","трендовый анализ","вертикальный анализ","горизонтальный анализ","сравнительный анализ"],a:3,e:"С ОДНИМ предыдущим периодом — горизонтальный; с РЯДОМ предшествующих периодов + тренд — трендовый.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",q:"Сравнение каждой позиции отчётности с рядом предшествующих периодов и определение основной тенденции динамики — это…",o:["трендовый анализ","горизонтальный анализ","вертикальный анализ","сравнительный анализ"],a:0,e:"Тренд — основная тенденция динамики, очищенная от случайных влияний и особенностей отдельных периодов.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",q:"С помощью какого анализа ведётся перспективный, прогнозный анализ?",o:["трендового","вертикального","горизонтального","группировки"],a:0,e:"С помощью тренда формируются возможные значения показателей в будущем.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",q:"Относительные величины динамики (темпы роста) составляют основу…",o:["горизонтального и трендового анализа","вертикального анализа","анализа финансовых коэффициентов","балансового способа"],a:0,e:"Динамика → горизонтальный и трендовый; структура → вертикальный.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",q:"Базисный темп роста — это когда…",o:["каждый уровень ряда сравнивается с одним и тем же базисным периодом","каждый следующий период сравнивается с предыдущим","берётся среднее отношение за все периоды","часть делится на целое"],a:0,e:"Базисные — всё к одной базе; цепные — каждый к предыдущему («звено к звену»).",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",k:1,fix:1,q:"Выявление относительных величин, при исчислении которых одну из величин принимают за единицу, а другую выражают как отношение к единице, происходит при помощи…",o:["сравнительного анализа","вертикального анализа","анализа финансовых коэффициентов","трендового анализа","факторного анализа"],a:2,e:"Относительные величины выражаются в коэффициентах (база = 1) или процентах (база = 100). «Одна величина за единицу» → коэффициент → анализ финансовых коэффициентов.",s:"Конспект, способ относительных величин; Крылов, с. 10–11"},
{b:2,t:"b2b",q:"Сколько финансовых коэффициентов разработано, по конспекту?",o:["более 100","около 10","около 25","ровно 50"],a:0,e:"Многие из них дублируют друг друга. Для группы ключевых коэффициентов выработаны нормативные (рекомендуемые) значения.",s:"Конспект; Крылов, с. 11"},
{b:2,t:"b2b",q:"Какие две формы средних величин наиболее применяются в ФА?",o:["средняя арифметическая и средняя хронологическая","средняя геометрическая и гармоническая","средняя квадратическая и арифметическая","медиана и мода"],a:0,e:"Средние позволяют переходить от единичного к общему, от случайного к закономерному.",s:"Конспект; Крылов, с. 12"},
{b:2,t:"b2c",k:1,fix:1,q:"Какой вид сравнительного анализа аудитор применяет при определении эффективности использования производственной мощности предприятия, ресурсов, финансовой устойчивости и платёжеспособности?",o:["сравнение текущих данных предприятия со среднеотраслевыми данными","сравнение фактических данных клиента с расчётами самого аудитора","сравнение текущих данных с нормативными значениями","сравнение текущих данных с данными бизнес-плана","сравнение текущих данных с данными предыдущих периодов"],a:2,e:"Эффективность, устойчивость и платёжеспособность оценивают относительно норм — рекомендуемых значений коэффициентов. В конспекте этот вид назван «сопоставление фактических показателей с нормативными (рекомендуемыми)».",s:"Банк тестов к контрольной; Конспект, виды сравнений"},
{b:2,t:"b2c",q:"Сопоставление плановых и фактических показателей применяется, если выполняется…",o:["внутренний финансовый анализ","внешний финансовый анализ","налоговая проверка","трендовый анализ"],a:0,e:"У внешнего аналитика нет доступа к планам организации.",s:"Конспект; Крылов, с. 12"},
{b:2,t:"b2c",q:"Что НЕ входит в основные виды сравнений в финансовом анализе?",o:["сравнение данных бухгалтерского и налогового учёта","сопоставление плановых и фактических показателей","сравнение с показателями прошлых периодов","межхозяйственные сравнения"],a:0,e:"6 видов сравнений: план–факт; факт–норматив; факт–прошлые периоды; межхозяйственные; со средними (по региону, отрасли); до и после изменения фактора.",s:"Конспект; Крылов, с. 12"},
{b:2,t:"b2c",q:"Группировка информации — это…",o:["деление массы изучаемой совокупности на качественно однородные группы по соответствующим признакам","сопоставление изучаемого явления с уже известными","отражение соотношений двух уравновешенных групп показателей","изображение показателей с помощью геометрических знаков"],a:0,e:"Группировка помогает разъяснить смысл средних, показать роль отдельных единиц и выявить взаимосвязи.",s:"Конспект; Крылов, с. 12"},
{b:2,t:"b2c",q:"По сложности построения группировки бывают…",o:["простые и комбинированные","типологические, структурные и аналитические","базисные и цепные","полные и тематические"],a:0,e:"Простая — один признак, комбинированная — два и более. По задачам: типологические, структурные, аналитические.",s:"Конспект; Крылов, с. 12–13"},
{b:2,t:"b2c",q:"Группировки, которые используются для определения наличия, направления и формы связи между показателями, — это…",o:["аналитические","типологические","структурные","комбинированные"],a:0,e:"Типологические — обобщение и типизация; структурные — внутреннее строение; аналитические — связи. Чаще всего в ФА: простые структурные и аналитические.",s:"Конспект; Крылов, с. 13"},
{b:2,t:"b2c",q:"Какое значение графика в ФА связано с построением схем внутреннего строения показателя и взаимосвязей результативного и факторных показателей?",o:["методологическое","иллюстративное","аналитическое","прогнозное"],a:0,e:"Три значения графиков: иллюстративное (доходчивость), аналитическое (видны закономерности и тенденции), методологическое (схемы строения и взаимосвязей).",s:"Конспект; Крылов, с. 13"},
{b:2,t:"b2c",q:"Аналитическую таблицу можно определить как…",o:["систему мыслей, суждений, выраженных языком цифр","масштабное изображение показателей геометрическими знаками","деление совокупности на однородные группы","соотношение двух уравновешенных групп показателей"],a:0,e:"Таблица выразительнее словесного текста, компактнее и облегчает выявление связей.",s:"Конспект; Крылов, с. 13"},
{b:2,t:"b2d",q:"Балансовый способ служит главным образом для…",o:["отражения соотношений двух групп взаимосвязанных и уравновешенных показателей, итоги которых должны быть тождественны","деления совокупности на однородные группы","определения тренда показателей","расчёта средних величин"],a:0,e:"Также применяется при построении аддитивных факторных моделей и для проверки правильности факторного анализа.",s:"Конспект; Крылов, с. 14"},
{b:2,t:"b2d",q:"Способ цепных подстановок используется, если между результативным показателем и факторами существует…",o:["строгая функциональная зависимость (аддитивная, мультипликативная, кратная, смешанная)","стохастическая (вероятностная) связь","связь отсутствует","только корреляционная зависимость"],a:0,e:"Цепные подстановки работают только для детерминированных (функциональных) моделей.",s:"Конспект; Крылов, с. 14"},
{b:2,t:"b2d",c:1,q:"Сколько расчётов (подстановок) нужно для модели y = a × b × c способом цепных подстановок?",o:["4","3","6","8"],a:0,e:"Число расчётов на единицу больше числа факторов: базисный y₀, два условных показателя и фактический y₁ → 3 + 1 = 4.",s:"Конспект; Крылов, с. 14–15"},
{b:2,t:"b2d",q:"Как определяется влияние фактора в способе цепных подстановок?",o:["вычитанием из каждой последующей подстановки предыдущей","делением фактического значения на базисное","суммой всех подстановок","умножением прироста фактора на базисные значения всех факторов"],a:0,e:"Базисная величина одного фактора последовательно заменяется фактической, остальные неизменны; влияние = следующая подстановка − предыдущая.",s:"Конспект; Крылов, с. 14"},
{b:2,t:"b2d",c:1,q:"y = a × b. База: a₀ = 10, b₀ = 5; факт: a₁ = 12, b₁ = 6. Каково влияние фактора a (цепные подстановки)?",o:["+10","+12","+22","+20"],a:0,e:"y₀ = 10×5 = 50; условный y = a₁×b₀ = 12×5 = 60 → Δyₐ = 60 − 50 = +10; y₁ = 12×6 = 72 → Δy_b = 72 − 60 = +12. Проверка: 10 + 12 = 22 = 72 − 50.",s:"Метод — Крылов, с. 14–15"},
{b:2,t:"b2d",q:"Способ абсолютных разниц: влияние фактора b в модели y = a × b × c рассчитывается как…",o:["a₁ × (b₁ − b₀) × c₀","a₀ × (b₁ − b₀) × c₀","a₀ × (b₁ − b₀) × c₁","a₁ × (b₁ − b₀) × c₁"],a:0,e:"Прирост фактора × ФАКТИЧЕСКИЕ значения факторов слева × БАЗИСНЫЕ значения факторов справа. Способ проще цепных подстановок, но применяется в основном для мультипликативных моделей.",s:"Крылов, с. 15"}
);

// БЛОК 3 — Финансовые результаты (40)
Q.push(
{b:3,t:"b3a",k:1,fix:1,q:"Конечный финансовый результат деятельности предприятия отражает…",o:["валовой доход","прибыль (убыток) от продаж","прибыль до налогообложения","чистая нераспределённая прибыль"],a:3,e:"«Конечный» — после всех доходов, расходов и налога на прибыль: это чистая (нераспределённая) прибыль. Всё остальное — промежуточные ступени «лестницы прибыли».",s:"Банк тестов к контрольной; перечень финрезультатов — Крылов, с. 5"},
{b:3,t:"b3a",k:1,fix:1,q:"К абсолютным показателям финансовых результатов, отражаемым в финансовой отчётности, относятся (выберите все верные):",o:["валовая прибыль","прибыль (убыток) от продаж","прибыль до налогообложения","рентабельность собственного капитала"],a:[0,1,2],e:"Абсолютные показатели — суммы в рублях (виды прибыли из ОФР). Рентабельность — относительный показатель (отношение прибыли к капиталу).",s:"Банк тестов к контрольной; Конспект — состав финансовых результатов"},
{b:3,t:"b3a",q:"С чего начинается анализ финансовых результатов организации?",o:["с изучения объёма, состава, структуры и динамики прибыли до налогообложения в разрезе её источников — прибыли от продаж и прибыли от прочей деятельности","с расчёта рентабельности собственного капитала","с анализа чистой прибыли","с анализа совокупного финансового результата"],a:0,e:"Порядок: ПДН (табл. 2.1) → прибыль от продаж (2.2) → прочая деятельность (2.3) → чистая прибыль (2.4) → СФР (2.5) → резервы.",s:"Конспект; Крылов, с. 17"},
{b:3,t:"b3a",q:"Прибыль (убыток) от прочей деятельности — это…",o:["сальдо всех остальных (прочих) доходов и расходов","прибыль от продаж за вычетом налога","выручка минус себестоимость продаж","чистая прибыль минус дивиденды"],a:0,e:"Всё, что не продажи: доходы от участия, проценты к получению и к уплате, прочие доходы и расходы.",s:"Конспект; Крылов, с. 17"},
{b:3,t:"b3a",q:"Как рассчитывается прибыль до налогообложения в таблице анализа (табл. 2.1)?",o:["прибыль от продаж + прибыль (убыток) от прочей деятельности","прибыль от продаж − коммерческие расходы","чистая прибыль + дивиденды","валовая прибыль + прочие доходы"],a:0,e:"Стр. 3 = стр. 1 + стр. 2. Именно эти два источника и рассматриваются как факторы ПДН.",s:"Конспект, табл. 2.1; Крылов, с. 18"},
{b:3,t:"b3a",q:"Чем определяется качество прибыли до налогообложения?",o:["её структурой — удельным весом прибыли от продаж","ставкой налога на прибыль","абсолютной суммой прибыли","долей прочих доходов"],a:0,e:"Прибыль от продаж — результат основной деятельности и главный источник средств. Чем больше её доля в ПДН, тем выше качество прибыли.",s:"Конспект; Крылов, с. 18"},
{b:3,t:"b3a",q:"Какое влияние на качество прибыли до налогообложения оказывает снижение в ней удельного веса прибыли от продаж?",o:["приводит к повышению","приводит к снижению","не оказывает никакого влияния"],a:1,fix:1,e:"Снижение доли прибыли от продаж — негативное явление: ухудшается качество ПДН.",s:"Крылов, тест для самопроверки № 1; с. 18"},
{b:3,t:"b3a",q:"Какое соотношение темпов роста прибыли от продаж (ТРпр) и прибыли до налогообложения (ТРпдн) желательно?",o:["ТРпр ≥ ТРпдн","ТРпр < ТРпдн","ТРпдн ≥ 2 × ТРпр","ТРпр = ТРвр"],a:0,e:"Тогда доля прибыли от продаж в ПДН как минимум не уменьшается — качество прибыли не ухудшается. Правило: «хорошая часть растёт не медленнее целого».",s:"Конспект (Лекция 1, табл. 1); Крылов, формула 2.1"},
{b:3,t:"b3a",c:1,q:"Прибыль от продаж: 365 → 425 тыс. р. (темп роста 116,4 %); ПДН: 385 → 460 тыс. р. (119,5 %). Как изменилось качество прибыли до налогообложения?",o:["ухудшилось: ТРпр < ТРпдн, доля прибыли от продаж упала с 94,8 % до 92,4 %","улучшилось: прибыль от продаж выросла на 60 тыс. р.","не изменилось","улучшилось: ПДН выросла на 19,5 %"],a:0,e:"365/385 = 94,8 %; 425/460 = 92,4 % → −2,4 п. п. Причина — отставание темпа роста прибыли от продаж от темпа роста ПДН.",s:"Крылов, пример — табл. 5.1, с. 108"},
{b:3,t:"b3b",k:1,fix:1,q:"Верно ли утверждение? Прибыль от продаж определяется вычитанием из валовой прибыли коммерческих и управленческих расходов.",o:["да","нет"],a:0,e:"ОФР: валовая прибыль (2100) − коммерческие (2210) − управленческие (2220) = прибыль от продаж (2200). Пример Крылова: 900 − 157 − 318 = 425.",s:"Крылов, Приложение, табл. П.2; Конспект, табл. 2.2"},
{b:3,t:"b3b",k:1,fix:1,q:"Верно ли данное утверждение? Любое изменение выручки от реализации продукции порождает ещё более сильное изменение прибыли от продаж.",o:["да","нет"],a:0,e:"Это эффект операционного (производственного) рычага: из-за условно-постоянных расходов прибыль меняется в большей степени, чем выручка. В учебнике Крылова тема не раскрыта — ответ по банку тестов.",s:"Банк тестов к контрольной"},
{b:3,t:"b3b",k:1,fix:1,q:"Если темпы роста прибыли выше темпов роста выручки, это свидетельствует о…",o:["повышении рентабельности активов","повышении рентабельности продаж","снижении рентабельности продаж","снижении фондоотдачи"],a:1,e:"Рентабельность продаж = прибыль / выручка. Числитель растёт быстрее знаменателя → доля прибыли в выручке растёт. Про активы по условию ничего не известно.",s:"Банк тестов к контрольной; формула — Конспект (рентабельность продаж)"},
{b:3,t:"b3b",v:1,c:1,q:"Выручка выросла на 28,6 %, а прибыль от продаж — на 16,4 %. Что произошло с рентабельностью продаж?",o:["снизилась","выросла","не изменилась","по этим данным сказать нельзя"],a:0,e:"Прибыль растёт медленнее выручки → её доля в выручке падает. У Крылова: 10,4 % → 9,4 %.",s:"Крылов, табл. 5.2, с. 108"},
{b:3,t:"b3b",q:"Какие элементы (факторы) определяют прибыль от продаж?",o:["выручка, себестоимость продаж, управленческие и коммерческие расходы","прибыль до налогообложения, налог на прибыль, отложенные налоги","доходы от участия, проценты к получению, прочие доходы","чистая прибыль, амортизация, инвестиции"],a:0,e:"Табл. 2.2: выручка − себестоимость − управленческие − коммерческие = прибыль от продаж.",s:"Конспект, табл. 2.2; Крылов, с. 18–19"},
{b:3,t:"b3b",q:"Что принимается за 100 % при анализе структуры прибыли от продаж (табл. 2.2)?",o:["выручка — как наибольший положительный показатель","прибыль от продаж","себестоимость продаж","валовая прибыль"],a:0,e:"Все статьи выражаются в % от выручки: так видно, какая доля выручки «съедается» затратами.",s:"Конспект; Крылов, с. 19"},
{b:3,t:"b3b",q:"В чём состоит условие оптимизации прибыли от продаж?",o:["ТРвр > ТРсп — темп роста выручки больше темпа роста полной себестоимости","ТРсп > ТРвр","выручка минус полная себестоимость больше нуля","ТРпр ≥ ТРпдн"],a:0,e:"Выручка должна расти быстрее затрат. Вариант «разность больше нуля» — просто наличие прибыли, а не условие оптимизации.",s:"Конспект (Лекция 1, табл. 2); Крылов, формула 2.2; тест № 48"},
{b:3,t:"b3b",q:"Что входит в полную себестоимость реализованной продукции в условии оптимизации прибыли от продаж?",o:["себестоимость продаж + управленческие + коммерческие расходы","только себестоимость продаж","себестоимость продаж + прочие расходы","себестоимость продаж + проценты к уплате"],a:0,e:"ТРсп считается по сумме трёх статей расходов по обычной деятельности.",s:"Конспект; Крылов, с. 19"},
{b:3,t:"b3b",q:"К чему ведёт выполнение условия ТРвр > ТРсп?",o:["к снижению удельного веса полной себестоимости в выручке и повышению эффективности текущей деятельности","к росту доли прочих доходов","к снижению выручки","к росту налога на прибыль"],a:0,e:"Если условие не выполняется, выявляют его причины.",s:"Конспект; Крылов, с. 19"},
{b:3,t:"b3b",c:1,q:"Выручка: 3500 → 4500 тыс. р. (128,6 %). Полная себестоимость: 3135 → 4075 тыс. р. (130,0 %). Выполняется ли условие оптимизации прибыли от продаж?",o:["нет: темп роста полной себестоимости (130,0 %) выше темпа роста выручки (128,6 %)","да: выручка выросла на 1000 тыс. р.","да: прибыль от продаж выросла","по этим данным определить нельзя"],a:0,e:"Условие ТРвр > ТРсп нарушено → удельный вес прибыли от продаж в выручке снизился (10,4 % → 9,4 %), эффективность текущей деятельности упала.",s:"Крылов, пример — с. 109"},
{b:3,t:"b3b",c:1,q:"Выручка — 4500, себестоимость продаж — 3600, коммерческие расходы — 157, управленческие — 318 (тыс. р.). Чему равна прибыль от продаж?",o:["425","900","582","743"],a:0,e:"4500 − 3600 = 900 (валовая прибыль); 900 − 157 − 318 = 425.",s:"Крылов, Приложение, табл. П.2"},
{b:3,t:"b3b",c:1,q:"Прибыль от продаж — 425, выручка — 4500 тыс. р. Удельный вес прибыли от продаж в выручке (рентабельность продаж) равен…",o:["9,4 %","10,4 %","11,8 %","90,6 %"],a:0,e:"425 / 4500 × 100 = 9,4 %.",s:"Крылов, табл. 5.2"},
{b:3,t:"b3c",q:"Как ведётся анализ прибыли от прочей деятельности?",o:["в разрезе доходов от прочей деятельности и связанных с ней расходов; их структура анализируется в отдельности","в разрезе выручки и себестоимости","только по сумме чистой прибыли","в разрезе текущего налога и отложенных налогов"],a:0,e:"В табл. 2.3 и доходы, и расходы принимаются за 100 % каждые по отдельности.",s:"Конспект, табл. 2.3; Крылов, с. 19–20"},
{b:3,t:"b3c",q:"Что НЕ входит в доходы от прочей деятельности?",o:["проценты к уплате","доходы от участия в других организациях","проценты к получению","прочие доходы"],a:0,e:"Проценты к уплате — это расход (вместе с прочими расходами).",s:"Конспект, табл. 2.3"},
{b:3,t:"b3c",q:"Какое влияние на прибыль от прочей деятельности оказывает снижение коммерческих расходов?",o:["приводит к увеличению","приводит к уменьшению","не оказывает никакого влияния"],a:2,fix:1,e:"Коммерческие расходы — элемент прибыли от ПРОДАЖ, а не прочей деятельности.",s:"Крылов, тест для самопроверки № 31"},
{b:3,t:"b3c",c:1,q:"Доходы от прочей деятельности: участие — 18, проценты к получению — 22, прочие — 32. Расходы: проценты к уплате — 6, прочие — 31 (тыс. р.). Прибыль от прочей деятельности равна…",o:["35","109","72","41"],a:0,e:"Доходы: 18 + 22 + 32 = 72; расходы: 6 + 31 = 37; 72 − 37 = 35.",s:"Крылов, табл. 5.3"},
{b:3,t:"b3c",q:"Как рассчитывается чистая прибыль в таблице анализа (табл. 2.4)?",o:["ПДН − текущий налог − изменение ОНО + изменение ОНА − прочее","ПДН + текущий налог + изменение ОНО − изменение ОНА","прибыль от продаж − налог на прибыль","выручка − все расходы − дивиденды"],a:0,e:"Отложенные налоговые обязательства (ОНО) уменьшают ЧП, отложенные налоговые активы (ОНА) — увеличивают.",s:"Конспект, табл. 2.4; Крылов, с. 21"},
{b:3,t:"b3c",q:"Какое влияние на чистую прибыль оказывает снижение текущего налога на прибыль?",o:["приводит к увеличению","приводит к уменьшению","не оказывает никакого влияния"],a:0,fix:1,e:"Налог вычитается из ПДН → чем он меньше, тем больше ЧП. У Крылова налог снизился на 45 тыс. р. — ЧП выросла на 65 %.",s:"Крылов, тест № 38; с. 110"},
{b:3,t:"b3c",c:1,q:"ПДН — 460, текущий налог на прибыль — 140, изменение отложенных налоговых активов — +10 тыс. р. Чистая прибыль равна…",o:["330","310","320","600"],a:0,e:"460 − 140 + 10 = 330.",s:"Крылов, Приложение, табл. П.2; табл. 5.4"},
{b:3,t:"b3c",q:"Почему в анализе чистой прибыли удельный вес ПДН может превышать 100 % (например, 139,4 %)?",o:["за 100 % принята чистая прибыль, а ПДН больше неё на сумму налога","это ошибка в расчётах","ПДН включает выручку","за 100 % принята выручка"],a:0,e:"В табл. 2.4 база — чистая прибыль (стр. 6 = 100 %). 460 / 330 = 139,4 %.",s:"Крылов, табл. 5.4"},
{b:3,t:"b3c",q:"Какие элементы определяют совокупный финансовый результат?",o:["чистая прибыль + результат от переоценки внеоборотных активов, не включаемый в ЧП + результат от прочих операций, не включаемый в ЧП","ПДН + налог на прибыль","чистая прибыль + амортизация","прибыль от продаж + прочие доходы"],a:0,e:"Табл. 2.5: стр. 4 = стр. 1 + стр. 2 + стр. 3. Если переоценки и прочих операций нет, СФР = ЧП и отдельно его не анализируют.",s:"Конспект, табл. 2.5; Крылов, с. 21–22"},
{b:3,t:"b3d",q:"Чем завершается анализ финансовых результатов?",o:["выявлением резервов их повышения","расчётом прибыли до налогообложения","анализом имущественного положения","составлением прогнозного баланса"],a:0,e:"Последний пункт анализа финрезультатов — резервы + оценка способности к самофинансированию.",s:"Конспект; Крылов, с. 22"},
{b:3,t:"b3d",q:"Что НЕ является направлением поиска резервов повышения финансовых результатов?",o:["увеличение доли долгосрочных финансовых вложений во внеоборотных активах","увеличение выручки","снижение затрат на производство и продажу","оптимизация налогообложения"],a:0,e:"Пять направлений: ↑ выручка; ↓ затраты; ↑ прочие доходы; ↓ прочие расходы; оптимизация налогообложения. Рост доли ДФВ, наоборот, оценивается негативно.",s:"Конспект; Крылов, с. 22–23"},
{b:3,t:"b3d",q:"Отметьте все основные направления поиска резервов повышения финансовых результатов.",o:["увеличение выручки","снижение затрат на производство и продажу продукции","увеличение доходов от прочей деятельности","снижение расходов, связанных с прочей деятельностью","оптимизация налогообложения","увеличение дебиторской задолженности"],a:[0,1,2,3,4],e:"Логика «лестницы прибыли»: каждую ступень ОФР можно улучшить — выручку, затраты, прочие доходы и расходы, налог.",s:"Конспект; Крылов, с. 22–23"},
{b:3,t:"b3d",q:"По какой формуле рассчитывается коэффициент самофинансирования?",o:["Ксф = (ЧП + Ам) / И","Ксф = ЧП / Выручка","Ксф = И / (ЧП + Ам)","Ксф = (ПДН − налог) / Активы"],a:0,e:"ЧП — чистая прибыль, Ам — амортизационные отчисления, И — потребность в инвестициях.",s:"Конспект; Крылов, формула 2.3"},
{b:3,t:"b3d",q:"Что показывает коэффициент самофинансирования?",o:["в какой степени инвестиционные потребности могут быть удовлетворены за счёт собственных внутренних источников — чистой прибыли и амортизации","долю заёмного капитала в пассиве","сколько выручки приходится на рубль активов","долю прибыли от продаж в ПДН"],a:0,e:"Самофинансирование = финансирование из собственных внутренних источников: ЧП + амортизация.",s:"Конспект; Крылов, с. 23"},
{b:3,t:"b3d",c:1,q:"Чистая прибыль — 330, амортизация — 70, потребность в инвестициях — 500 тыс. р. Ксф равен…",o:["0,8","0,66","1,25","0,14"],a:0,e:"(330 + 70) / 500 = 0,8 → внутренние источники покрывают 80 % инвестиционных потребностей.",s:"Формула — Крылов, 2.3"},
{b:3,t:"b3d",q:"Рентабельность издержек (по конспекту) рассчитывается как…",o:["валовая прибыль / себестоимость проданной продукции × 100","прибыль от продаж / выручка × 100","прибыль до налогообложения / валюта баланса × 100","прибыль от продаж / (Сп + КР + УР) × 100"],a:0,e:"Показывает, сколько валовой прибыли приходится на 1 руб. себестоимости. Последний вариант — рентабельность производственной деятельности.",s:"Конспект, формулы рентабельности (1)–(4)"},
{b:3,t:"b3d",q:"Что показывает рентабельность продаж?",o:["сколько прибыли от продаж получено с 1 руб. выручки","сколько валовой прибыли приходится на 1 руб. себестоимости","сколько прибыли приходится на 1 руб. капитала","сколько выручки даёт 1 руб. активов"],a:0,e:"Rпрод = Ппрод / Выручка × 100; характеризует эффективность предпринимательской деятельности.",s:"Конспект, формула (3)"},
{b:3,t:"b3d",q:"Рентабельность капитала (по конспекту) определяется отношением…",o:["прибыли до налогообложения к валюте баланса","чистой прибыли к выручке","прибыли от продаж к себестоимости","валовой прибыли к собственному капиталу"],a:0,e:"Rк = Пд.нал / ВБ × 100 — сумма прибыли на 1 руб. капитала.",s:"Конспект, формула (4)"},
{b:3,t:"b3d",c:1,q:"Валовая прибыль — 900, себестоимость проданной продукции — 3600 тыс. р. Рентабельность издержек равна…",o:["25 %","20 %","11,8 %","400 %"],a:0,e:"900 / 3600 × 100 = 25 %: на каждый рубль себестоимости — 25 копеек валовой прибыли.",s:"Формула — Конспект (1); данные — Крылов, табл. П.2"}
);

// БЛОК 4 — Имущество и капитал (40)
Q.push(
{b:4,t:"b4a",q:"Анализ имущественного положения организации предполагает изучение…",o:["изменений в составе и структуре, а также динамики имущества в учётной оценке","только стоимости основных средств","соотношения собственного и заёмного капитала","оборачиваемости дебиторской задолженности"],a:0,e:"Имущественное положение = состав + структура + динамика имущества (актива баланса).",s:"Конспект; Крылов, с. 24"},
{b:4,t:"b4a",q:"Общей стоимости имущества предприятия в учётной оценке соответствует…",o:["итог актива бухгалтерского баланса (валюта баланса)","уставный капитал","сумма основных средств и НМА","чистые активы"],a:0,e:"Всё имущество = все активы = итог актива баланса.",s:"Конспект; Крылов, с. 24"},
{b:4,t:"b4a",q:"С изучения чего начинается анализ имущества организации?",o:["объёма, состава, структуры и динамики имущества в разрезе внеоборотных и оборотных активов","соотношения собственного и заёмного капитала","долгосрочных и краткосрочных обязательств","реальных и финансовых вложений"],a:0,e:"Табл. 3.1 (Лекция 2, табл. 1): внеоборотные + оборотные = стоимость имущества (итог актива).",s:"Конспект; Крылов, табл. 3.1"},
{b:4,t:"b4a",q:"Что из перечисленного — нематериальный элемент имущества предприятия?",o:["ноу-хау","сырьё","денежные средства","здание"],a:0,e:"Нематериальные элементы: репутация и круг клиентов, название и товарные знаки, навыки руководства, квалификация персонала, патенты, ноу-хау, авторские права, контракты. Материально-вещественные: земля, здания, машины, сырьё, полуфабрикаты, готовые изделия, денежные средства.",s:"Конспект, Лекция 2"},
{b:4,t:"b4a",q:"К длительно мобилизованным внеоборотным активам (по схеме конспекта) относятся…",o:["основные фонды и нематериальные активы","капитальные вложения и долгосрочные финансовые вложения","сырьё и материалы","готовая продукция и дебиторская задолженность"],a:0,e:"Схема «Имущество организации»: ВнА → длительно мобилизованные (основные фонды, НМА) и временно мобилизованные (капитальные вложения, долгосрочные финансовые вложения).",s:"Конспект, схема имущества организации"},
{b:4,t:"b4a",q:"Капитальные вложения и долгосрочные финансовые вложения на схеме имущества относятся к…",o:["временно мобилизованным внеоборотным активам","длительно мобилизованным внеоборотным активам","оборотным активам","нематериальным активам"],a:0,e:"Капвложения (строительство, монтаж оборудования) и ДФВ (акции, облигации, займы, депозиты) — временно мобилизованные.",s:"Конспект, схема имущества организации"},
{b:4,t:"b4a",q:"Показатель динамики имущества рассчитывается как…",o:["валюта баланса на конец периода / валюта баланса на начало периода","оборотные активы / внеоборотные активы","выручка / активы","собственный капитал / валюта баланса"],a:0,e:"Значение больше 1 говорит о расширении масштабов хозяйственной деятельности и, как правило, оценивается позитивно.",s:"Крылов, табл. 3.3, с. 26–27"},
{b:4,t:"b4a",c:1,q:"Валюта баланса: 2670 → 2950 тыс. р. Показатель динамики имущества равен…",o:["1,105","0,905","280","1,280"],a:0,e:"2950 / 2670 = 1,105 → имущество выросло на 10,5 %: масштабы деятельности расширяются.",s:"Крылов, табл. 5.5–5.6"},
{b:4,t:"b4a",q:"Почему у финансовых коэффициентов имущественного положения нет универсальных рекомендуемых значений?",o:["они имеют отраслевую специфику","их слишком много","они не рассчитываются по отчётности","они всегда равны единице"],a:0,e:"Поэтому их анализируют в динамике, в сравнении с аналогичными предприятиями отрасли и со среднеотраслевыми показателями.",s:"Конспект; Крылов, с. 28–29"},
{b:4,t:"b4a",q:"Какой из показателей рассчитывается делением на валюту баланса?",o:["доля реальных активов в имуществе","доля запасов в оборотных активах","доля основных средств во внеоборотных активах","доля дебиторской задолженности в оборотных активах"],a:0,e:"«…в имуществе» → знаменатель — валюта баланса; «…в оборотных активах» → оборотные активы; «…во внеоборотных» → внеоборотные.",s:"Крылов, табл. 3.3"},
{b:4,t:"b4b",q:"Укажите рекомендуемое соотношение темпа роста оборотных активов (ТРоба) и темпа роста внеоборотных активов (ТРва).",o:["ТРоба > ТРва","ТРоба ≤ ТРва","ТРоба < ТРва"],a:0,fix:1,e:"Мобильная часть имущества должна расти быстрее.",s:"Конспект (Лекция 2, табл. 1); Крылов, формула 3.1; тест № 44"},
