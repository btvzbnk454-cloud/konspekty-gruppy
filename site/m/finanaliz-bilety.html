{b:4,t:"b4b",q:"Что характеризует соотношение ТРоба > ТРва?",o:["тенденцию к ускорению оборачиваемости оборотных активов и условное высвобождение средств в наиболее мобильных формах","рост производственного потенциала","снижение ликвидности имущества","рост финансового риска"],a:0,e:"Высвобождаются денежные средства и краткосрочные финансовые вложения — самые мобильные формы.",s:"Конспект; Крылов, с. 25"},
{b:4,t:"b4b",q:"Как оценивается рост доли оборотных активов и снижение доли внеоборотных активов в имуществе?",o:["положительно — повышается мобильность имущества","отрицательно — снижается производственный потенциал","отрицательно — растёт риск","нейтрально"],a:0,e:"Рост мобильности имущества в целом оценивается положительно. Но для промышленного предприятия преобладание ВнА нормально.",s:"Конспект; Крылов, с. 26"},
{b:4,t:"b4b",c:1,q:"Внеоборотные активы: 1385 → 1510; оборотные: 1285 → 1440 тыс. р. Чему равен темп роста оборотных активов?",o:["112,1 %","109,0 %","110,5 %","12,1 %"],a:0,e:"1440 / 1285 × 100 = 112,1 %. ТРва = 1510 / 1385 = 109,0 % → ТРоба > ТРва выполняется, мобильность имущества повысилась. 12,1 % — это темп прироста.",s:"Крылов, табл. 5.5"},
{b:4,t:"b4b",c:1,q:"Оборотные активы на конец года — 1440, валюта баланса — 2950 тыс. р. Доля оборотных активов в имуществе равна…",o:["0,488","0,512","0,481","0,953"],a:0,e:"1440 / 2950 = 0,488. На начало было 0,481 → доля выросла на 0,007.",s:"Крылов, табл. 5.6"},
{b:4,t:"b4b",q:"Доля денежных средств и краткосрочных финансовых вложений в оборотных активах: чем выше значение, тем…",o:["выше степень ликвидности оборотных активов","ниже ликвидность оборотных активов","выше финансовый риск","выше доля запасов"],a:0,e:"Это наиболее мобильные активы.",s:"Конспект; Крылов, с. 28"},
{b:4,t:"b4b",q:"Как обычно оценивается увеличение доли дебиторской задолженности в оборотных активах?",o:["негативно: всё большая доля оборотных активов временно отвлекается из оборота","позитивно: растут продажи","нейтрально","позитивно: растёт ликвидность"],a:0,e:"Средства «застревают» у покупателей и не участвуют в текущей деятельности.",s:"Конспект; Крылов, с. 28"},
{b:4,t:"b4b",q:"О чём может говорить крайне низкая доля дебиторской задолженности в оборотных активах?",o:["о достаточно жёсткой кредитной политике, ведущей к снижению объёмов продаж","о высокой ликвидности без каких-либо минусов","о банкротстве организации","о росте производственного потенциала"],a:0,e:"Крайность в обе стороны плоха: слишком жёсткие условия оплаты отпугивают покупателей.",s:"Конспект; Крылов, с. 28"},
{b:4,t:"b4b",q:"Что характеризуют реальные активы?",o:["экономический потенциал торгового предприятия","производственный потенциал промышленного предприятия","экономический потенциал организации сферы услуг"],a:1,fix:1,e:"Реальные активы = НМА (по остаточной) + ОС (по остаточной) + производственные запасы + незавершённое производство.",s:"Крылов, тест № 3; с. 25"},
{b:4,t:"b4b",q:"Что НЕ входит в состав реальных активов?",o:["дебиторская задолженность","нематериальные активы (по остаточной стоимости)","основные средства (по остаточной стоимости)","затраты в незавершённом производстве"],a:0,e:"Реальные активы — то, что «работает» в производстве: НМА, ОС, производственные запасы, НЗП.",s:"Конспект; Крылов, с. 25"},
{b:4,t:"b4b",q:"Как оцениваются опережающие темпы роста незавершённого производства?",o:["однозначно негативно — признак неритмичности производственного процесса","позитивно — рост объёмов производства","нейтрально","позитивно — рост производственного потенциала"],a:0,e:"Незавершёнка растёт быстрее остального → производство идёт рывками, средства замораживаются.",s:"Конспект; Крылов, с. 26"},
{b:4,t:"b4b",q:"Как, как правило, оценивается уменьшение общей стоимости реальных активов?",o:["негативно — снижается производственный потенциал промышленного предприятия","позитивно — растёт мобильность имущества","нейтрально","позитивно — снижаются затраты"],a:0,e:"Снижение доли реальных активов в имуществе также обычно негативно — ухудшение структуры промышленного предприятия.",s:"Конспект; Крылов, с. 26"},
{b:4,t:"b4c",q:"Как обычно оценивается рост доли результатов исследований и разработок во внеоборотных активах?",o:["позитивно — активизация инновационной деятельности","негативно — отвлечение средств","нейтрально","негативно — нулевая доходность"],a:0,e:"НИОКР → инновации → позитив.",s:"Конспект; Крылов, с. 28"},
{b:4,t:"b4c",q:"Если наибольший удельный вес во внеоборотных активах составляют НМА и результаты исследований и разработок, стратегия развития организации…",o:["инновационная","производственная","финансово-инвестиционная","сбытовая"],a:0,e:"НМА + НИОКР → инновационная; ОС → производственная; ДФВ → финансово-инвестиционная.",s:"Конспект; Крылов, с. 29"},
{b:4,t:"b4c",q:"Наибольший удельный вес основных средств во внеоборотных активах говорит о…",o:["производственной направленности стратегии","инновационной стратегии","финансово-инвестиционной стратегии","торговой стратегии"],a:0,e:"Основные средства = производство.",s:"Конспект; Крылов, с. 29"},
{b:4,t:"b4c",q:"Если наибольший удельный вес во внеоборотных активах занимают долгосрочные финансовые вложения, стратегия, скорее всего…",o:["финансово-инвестиционная","производственная","инновационная","сбытовая"],a:0,e:"Вложения в чужие бизнесы и ценные бумаги → финансово-инвестиционный характер.",s:"Конспект; Крылов, с. 29"},
{b:4,t:"b4c",q:"Как оценивается увеличение удельного веса долгосрочных финансовых вложений во внеоборотных активах?",o:["негативно: средства надолго отвлекаются из оборота, есть значительный риск → качество ВнА ухудшается","позитивно: растёт доход","нейтрально","позитивно: растёт мобильность имущества"],a:0,e:"Поэтому желательно ТРва ≥ ТРдфв.",s:"Конспект; Крылов, с. 30"},
{b:4,t:"b4c",q:"Какое соотношение темпов роста всех внеоборотных активов (ТРва) и долгосрочных финансовых вложений (ТРдфв) желательно?",o:["ТРва ≥ ТРдфв","ТРва < ТРдфв","ТРдфв > 2 × ТРва","эти темпы не сравнивают"],a:0,e:"Тогда доля ДФВ во ВнА не растёт и качество ВнА не ухудшается. Правило: «рискованная часть растёт не быстрее целого».",s:"Конспект; Крылов, формула 3.2"},
{b:4,t:"b4c",q:"Почему рост доли отложенных налоговых активов во внеоборотных активах оценивается негативно?",o:["ОНА — специфическая долгосрочная дебиторская задолженность с нулевой доходностью, чистая иммобилизация средств","ОНА увеличивают налог на прибыль","ОНА — это краткосрочные обязательства","ОНА снижают выручку"],a:0,e:"Желательно ТРва ≥ ТРона.",s:"Конспект; Крылов, с. 30"},
{b:4,t:"b4c",q:"Какое соотношение темпов роста внеоборотных активов (ТРва) и отложенных налоговых активов (ТРона) желательно?",o:["ТРва ≥ ТРона","ТРона > ТРва","ТРва < ТРона","ТРона ≥ 2 × ТРва"],a:0,e:"Тогда доля ОНА во ВнА не увеличивается и качество внеоборотных активов не ухудшается.",s:"Конспект; Крылов, формула 3.3"},
{b:4,t:"b4c",q:"Какое из соотношений темпов роста НЕ является желательным?",o:["ТРдфв > ТРва","ТРоба > ТРва","ТРвр > ТРсп","ТРпр ≥ ТРпдн"],a:0,e:"Все желательные соотношения — одно правило: хорошее (мобильное, основное) растёт быстрее целого, плохое (рискованное, иммобилизованное) — не быстрее. ДФВ быстрее ВнА — плохо.",s:"Сводка формул 2.1, 2.2, 3.1–3.3 (Крылов)"},
{b:4,t:"b4c",c:1,q:"Долгосрочные финансовые вложения: 95 → 110 (115,8 %); внеоборотные активы: 1385 → 1510 (109,0 %). Как это оценить?",o:["негативно: ТРдфв > ТРва, доля ДФВ растёт, качество ВнА снижается","позитивно: вложения растут","нейтрально","позитивно: ВнА растут"],a:0,e:"Доля ДФВ во ВнА: 6,9 % → 7,3 %. У Крылова это прямо названо негативным явлением.",s:"Крылов, табл. 5.7, с. 115–116"},
{b:4,t:"b4c",q:"Чем завершается анализ имущественного положения организации?",o:["обобщающим выводом о рациональности структуры имущества (наиболее / в целом / наименее рациональная), причинах её изменений и связи с инвестиционной политикой","расчётом чистой прибыли","составлением прогнозного баланса","расчётом коэффициента самофинансирования"],a:0,e:"Три градации рациональности — хороший материал для открытого вопроса.",s:"Конспект; Крылов, с. 30"},
{b:4,t:"b4d",k:1,fix:1,q:"Какой коэффициент представляет собой отношение собственного капитала к привлечённому?",o:["финансирования","независимости","инвестирования","финансовой устойчивости"],a:0,e:"Кфин = СК / ЗК. Не путай: независимости = СК / валюта баланса; инвестирования = СК / внеоборотные активы; финансовой устойчивости = (СК + долгосрочные обязательства) / валюта баланса.",s:"Банк тестов к контрольной; близкие коэффициенты — Крылов, табл. 3.10–3.11"},
{b:4,t:"b4d",v:1,q:"Как называется отношение заёмного капитала к собственному?",o:["коэффициент задолженности (соотношения заёмных и собственных средств)","коэффициент финансирования","коэффициент финансовой независимости","коэффициент инвестирования"],a:0,e:"ЗК / СК ≤ 1 (Крылов). Это «перевёрнутый» коэффициент финансирования.",s:"Крылов, табл. 3.10, с. 38"},
{b:4,t:"b4d",v:1,q:"Отношение собственного капитала к валюте баланса — это…",o:["коэффициент финансовой независимости (автономии); рекомендуемое значение ≥ 0,5","коэффициент финансирования","коэффициент инвестирования","коэффициент задолженности"],a:0,e:"Показывает долю собственных источников в капитале.",s:"Крылов, табл. 3.10, с. 38"},
{b:4,t:"b4d",v:1,q:"Отношение собственного капитала к внеоборотным активам — это…",o:["коэффициент инвестирования (≥ 1)","коэффициент финансовой независимости","коэффициент финансирования","коэффициент мобильности"],a:0,e:"Показывает, в какой степени внеоборотные активы профинансированы собственным капиталом.",s:"Крылов, табл. 3.11, с. 42"},
{b:4,t:"b4d",v:1,c:1,q:"Собственный капитал — 2300, заёмный — 650 тыс. р. Коэффициент финансирования равен…",o:["3,54","0,28","0,78","1,28"],a:0,e:"2300 / 650 = 3,54 → на рубль заёмных средств приходится 3,54 руб. собственных. 0,28 — это коэффициент задолженности (650 / 2300), 0,78 — финансовой независимости (2300 / 2950).",s:"Данные — Крылов, табл. 5.9"},
{b:4,t:"b4d",k:1,fix:1,q:"Если темпы роста выручки меньше темпов роста активов, это свидетельствует о…",o:["повышении отдачи активов","повышении финансовой устойчивости","снижении отдачи активов","снижении финансовой устойчивости"],a:2,e:"Отдача (оборачиваемость) активов = выручка / активы. Знаменатель растёт быстрее числителя → на каждый рубль активов приходится меньше выручки.",s:"Банк тестов к контрольной; «показатель отдачи активов» — Крылов, с. 50"},
{b:4,t:"b4d",v:1,c:1,q:"Выручка выросла на 20 %, активы — на 10 %. Как изменилась отдача активов?",o:["повысилась","снизилась","не изменилась","по этим данным сказать нельзя"],a:0,e:"1,20 / 1,10 ≈ 1,09 → отдача выросла примерно на 9 %.",s:"Вариация вопроса из контрольной"}
);

// Открытые вопросы — карточки с проверкой по ключевым словам
const CARDS = [
{b:1,q:"Дайте определение финансового анализа.",a:"Составление на основе бухгалтерской, финансовой, статистической и другой отчётности аналитического обоснования управленческих решений, направленных на достижение поставленных целей.",k:[["отчетн"],["обоснован"],["решени"],["цел"]],s:"Конспект"},
{b:1,st:1,q:"Назовите предмет финансового анализа.",a:"Финансовые результаты и финансовое состояние организации (предприятия).",k:[["результат"],["состояни"]],s:"Конспект; Крылов, с. 5 · было в контрольной"},
{b:1,q:"Назовите объект финансового анализа.",a:"Финансовые аспекты хозяйственной деятельности организации.",k:[["аспект"],["хозяйств"]],s:"Конспект; Крылов, с. 6"},
{b:1,q:"Что является информационной базой финансового анализа?",a:"Данные бухгалтерского учёта и финансовой отчётности организации.",k:[["учет"],["отчетн"]],s:"Конспект; Крылов, с. 6"},
{b:1,st:1,q:"Назовите цель внешнего финансового анализа.",a:"Оценка (внешнего) рейтинга организации, её финансовой устойчивости, платёжеспособности и надёжности, т. е. уменьшение степени риска взаимодействия данной организации и её контрагентов.",k:[["рейтинг"],["устойчив"],["платеж"],["надежн"],["риск"],["контрагент"]],s:"Конспект; Крылов, с. 6 · было в контрольной"},
{b:1,st:1,q:"Назовите цель внутреннего финансового анализа.",a:"Рассмотреть состояние финансовых ресурсов организации, дать внутреннюю оценку её рейтинга и выявить финансовые резервы — в конечном итоге обеспечить эффективное управление ликвидностью.",k:[["ресурс"],["рейтинг"],["резерв"],["ликвидн"]],s:"Конспект; Крылов, с. 6 · было в контрольной"},
{b:1,q:"Что понимается под финансовым состоянием организации? Какова его ключевая характеристика?",a:"Способность организации финансировать свою деятельность. Характеризуется обеспеченностью финансовыми ресурсами, целесообразностью их размещения, интенсивностью и эффективностью использования. Ключевая характеристика — платёжеспособность.",k:[["финансир"],["обеспеченн"],["размещ"],["эффективн","интенсивн"],["платеж"]],s:"Конспект; Крылов, с. 5"},
{b:1,q:"Какие показатели относятся к финансовым результатам организации? (7 штук)",a:"Валовая прибыль, прибыль от продаж, прибыль от прочей деятельности, прибыль до налогообложения, чистая прибыль, совокупный финансовый результат, нераспределённая прибыль.",k:[["валов"],["продаж"],["проч"],["налогообл"],["чист"],["совокуп"],["нераспредел"]],s:"Конспект; Крылов, с. 5"},
{b:1,q:"Перечислите основные функции финансового анализа (4).",a:"1) объективная оценка финансового состояния; 2) выявление факторов и причин достигнутого состояния; 3) подготовка и обоснование финансовых решений; 4) выявление и мобилизация резервов улучшения финансового состояния.",k:[["оценк"],["фактор","причин"],["решени"],["резерв"]],s:"Конспект"},
{b:1,q:"В каких случаях применяется финансовый анализ в организациях? (4)",a:"При выявлении проблем в текущей и инвестиционной деятельности; как инструмент прогнозирования будущих финансовых условий и результатов; при управлении хозяйствующим субъектом; при оценке вариантов инвестирования капитала.",k:[["проблем"],["прогноз"],["управлен"],["инвестир"]],s:"Конспект"},
{b:1,q:"Назовите основные категории метода финансового анализа и его принципы.",a:"Категории: показатели, факторы, резервы («ПФР»). Принципы: единство анализа и синтеза, изучение явлений во взаимосвязи, в развитии от простого к сложному, в переходе от количества к качественным изменениям, в сравнении.",k:[["показател"],["фактор"],["резерв"],["синтез"],["взаимосвяз"]],s:"Конспект"},
{b:1,q:"Кто является пользователями информации внешнего и внутреннего финансового анализа?",a:"Внешний: 1) пользователи с прямым финансовым интересом — кредиторы и инвесторы; 2) с непрямым интересом — налоговые и финансовые органы, деловые партнёры, работники и профсоюзы, местные органы власти, регуляторы, покупатели и общество, консультанты, статистические органы. Внутренний: администрация (топ-менеджеры) и собственники.",k:[["прям"],["кредитор"],["инвестор"],["налог"],["собственник"],["администрац","менеджер","руковод"]],s:"Крылов, с. 6; Конспект, таблица пользователей"},
{b:1,q:"Назовите формы финансовой отчётности по РСБУ (5).",a:"Бухгалтерский баланс; отчёт о финансовых результатах; отчёт об изменениях капитала; отчёт о движении денежных средств; пояснения.",k:[["баланс"],["финансовых результат"],["капитал"],["денежн"],["пояснен"]],s:"Конспект, таблица форм отчётности"},
{b:2,q:"Перечислите этапы финансового анализа.",a:"I — предварительный финансовый анализ; II — углублённый финансовый анализ; III — обобщение результатов, переходящее в разработку рекомендаций; IV — прогнозирование финансовых результатов и финансового состояния.",k:[["предварит"],["углубл"],["обобщ","рекоменд"],["прогноз"]],s:"Конспект; Крылов, с. 7"},
{b:2,q:"Какие подэтапы выделяют в предварительном финансовом анализе?",a:"1) подготовительный этап (проверка отчётности, аналитический баланс); 2) предварительный обзор финансовой отчётности (аудиторское заключение, пояснительная записка); 3) расчёт и анализ важнейших аналитических показателей.",k:[["подготов"],["обзор"],["расчет","показател"]],s:"Крылов, с. 7–8"},
{b:2,q:"Назовите составляющие углублённого финансового анализа (3 группы).",a:"1) Анализ финансовых результатов (ПДН, прибыль от продаж и прочей деятельности; ЧП и СФР; резервы). 2) Анализ финансового состояния (имущественное положение, финансовая устойчивость, платёжеспособность и ликвидность, деловая активность, рейтинговая оценка, несостоятельность, резервы). 3) Специальные разделы (инфляция, консолидированная и сегментная отчётность, переход к МСФО, прогнозный анализ).",k:[["результат"],["состояни"],["специальн"]],s:"Конспект; Крылов, с. 9"},
{b:2,q:"Перечислите основные методические приёмы финансового анализа (10).",a:"Способы абсолютных, относительных и средних величин; сравнение; группировка; графический; табличный; балансовый способ; способ цепных подстановок; способ абсолютных разниц.",k:[["абсолютн"],["относительн"],["средн"],["сравнен"],["группиров"],["график","графич"],["таблиц","таблич"],["баланс"],["цепн"],["разниц"]],s:"Крылов, с. 10; Конспект"},
{b:2,q:"Какие виды относительных величин применяются в ФА и какие виды анализа на них основаны?",a:"Относительные величины структуры → вертикальный (структурный) анализ; относительные величины динамики (темпы роста: базисные и цепные) → горизонтальный и трендовый анализ; финансовые коэффициенты → анализ финансовых коэффициентов.",k:[["структур"],["динамик"],["коэффициент"],["вертикальн"],["горизонтальн"],["трендов"]],s:"Конспект; Крылов, с. 10–11"},
{b:2,q:"Чем горизонтальный анализ отличается от трендового?",a:"Горизонтальный — сравнение каждой позиции отчётности с предыдущим периодом. Трендовый — сравнение с рядом предшествующих периодов и определение тренда (основной тенденции, очищенной от случайностей); на нём строится прогнозный анализ.",k:[["предыдущ"],["ряд"],["тенденц","тренд"],["прогноз","перспектив"]],s:"Конспект; Крылов, с. 11"},
{b:2,q:"Перечислите основные виды сравнений в финансовом анализе (6).",a:"План — факт (при внутреннем анализе); факт — нормативы (рекомендуемые значения); факт — прошлые периоды; межхозяйственные сравнения; со средними данными (по региону, отрасли); результаты до и после изменения фактора.",k:[["план"],["норматив","рекомендуем"],["прошл"],["межхозяйств"],["средн","отрасл"],["фактор"]],s:"Конспект; Крылов, с. 12"},
{b:2,q:"Какие бывают группировки и какие чаще всего используются в ФА?",a:"По сложности: простые (один признак) и комбинированные (два и более). По задачам: типологические, структурные, аналитические. В ФА чаще всего — простые структурные и аналитические.",k:[["прост"],["комбинир"],["типологич"],["структурн"],["аналитич"]],s:"Конспект; Крылов, с. 12–13"},
{b:2,q:"Какие три значения имеют графики в финансовом анализе?",a:"Иллюстративное (доходчивость), аналитическое (видны закономерности, тенденции и связи), методологическое (схемы внутреннего строения показателя и связей результата с факторами).",k:[["иллюстрат"],["аналитич"],["методолог"]],s:"Конспект; Крылов, с. 13"},
{b:2,q:"В чём суть способа цепных подстановок?",a:"Применяется при строгой функциональной зависимости. Базисная величина одного фактора последовательно заменяется фактической, остальные остаются неизменными. Число расчётов на единицу больше числа факторов. Влияние фактора = последующая подстановка − предыдущая.",k:[["функциональн"],["замен","подстан"],["базисн"],["фактическ"],["вычит","предыдущ"],["единиц"]],s:"Конспект; Крылов, с. 14"},
{b:3,q:"Как анализируется прибыль до налогообложения и какое соотношение темпов желательно?",a:"Изучают объём, состав, структуру и динамику ПДН в разрезе источников: прибыли от продаж и прибыли от прочей деятельности. Качество ПДН определяется долей прибыли от продаж. Желательно ТРпр ≥ ТРпдн — тогда доля прибыли от продаж не снижается.",k:[["продаж"],["проч"],["структур","удельн","дол"],["качеств"],["трпр","темп"]],s:"Конспект; Крылов, с. 17–18"},
{b:3,q:"Сформулируйте условие оптимизации прибыли от продаж.",a:"ТРвр > ТРсп: темп роста выручки больше темпа роста полной себестоимости реализованной продукции (себестоимость продаж + коммерческие + управленческие расходы). Это снижает долю полной себестоимости в выручке и повышает эффективность текущей деятельности.",k:[["выручк"],["себестоим"],["коммерч"],["управлен"],["эффективн"]],s:"Конспект; Крылов, с. 19"},
{b:3,q:"Из каких элементов складываются чистая прибыль и совокупный финансовый результат?",a:"ЧП = прибыль до налогообложения − текущий налог на прибыль − изменение отложенных налоговых обязательств (ОНО) + изменение отложенных налоговых активов (ОНА) − прочее. СФР = ЧП + результат от переоценки внеоборотных активов, не включаемый в ЧП + результат от прочих операций, не включаемый в ЧП.",k:[["налогообл"],["текущ"],["отложен"],["переоценк"],["прочих операц"]],s:"Конспект, табл. 2.4–2.5; Крылов, с. 20–22"},
{b:3,q:"Назовите основные направления поиска резервов повышения финансовых результатов (5).",a:"1) увеличение выручки (рост физического объёма, изменение структуры продаж, повышение цен); 2) снижение затрат (производительность труда, материалоёмкость, непроизводительные выплаты, брак); 3) увеличение доходов от прочей деятельности; 4) снижение расходов, связанных с прочей деятельностью; 5) оптимизация налогообложения.",k:[["выручк"],["затрат"],["доход"],["расход"],["налогообл"]],s:"Конспект; Крылов, с. 22–23"},
{b:3,q:"Коэффициент самофинансирования: формула и смысл.",a:"Ксф = (ЧП + Ам) / И, где ЧП — чистая прибыль, Ам — амортизационные отчисления, И — потребность в инвестициях. Показывает, в какой степени инвестиционные потребности могут быть удовлетворены за счёт собственных внутренних источников.",k:[["чист"],["амортиз"],["инвестиц"],["внутрен","собствен"]],s:"Конспект; Крылов, с. 23"},
{b:4,q:"Что такое реальные активы, из чего они состоят и что характеризуют?",a:"Нематериальные активы и основные средства (по остаточной стоимости), производственные запасы (сырьё, материалы), затраты в незавершённом производстве. Характеризуют производственный потенциал промышленного предприятия.",k:[["нематериал"],["основн"],["запас"],["незаверш"],["потенциал"]],s:"Конспект; Крылов, с. 25"},
{b:4,q:"Какие соотношения темпов роста желательны при анализе имущества и почему?",a:"ТРоба > ТРва (оборотные активы растут быстрее внеоборотных) — ускорение оборачиваемости оборотных активов, высвобождение средств в мобильных формах. ТРва ≥ ТРдфв — ДФВ отвлекают средства из оборота надолго и рискованны. ТРва ≥ ТРона — ОНА имеют нулевую доходность (иммобилизация средств).",k:[["оборотн"],["внеоборотн"],["вложен","дфв"],["отложен","она"],["оборачиваем","мобильн"],["риск"],["доходн","иммобилиз"]],s:"Конспект; Крылов, с. 25, 30"},
{b:4,q:"Как по структуре внеоборотных активов определить стратегию развития организации?",a:"Наибольший удельный вес НМА и результатов исследований и разработок → инновационная стратегия; основных средств → производственная направленность; долгосрочных финансовых вложений → финансово-инвестиционная.",k:[["инновац"],["производств"],["инвестиц"]],s:"Конспект; Крылов, с. 29"},
{b:1,st:1,q:"Назовите цель финансового анализа.",a:"Цель внешнего ФА — оценка (внешнего) рейтинга организации, её финансовой устойчивости, платёжеспособности и надёжности, т. е. уменьшение риска взаимодействия с ней контрагентов. Цель внутреннего ФА — рассмотреть состояние финансовых ресурсов, дать внутреннюю оценку рейтинга и выявить финансовые резервы, в итоге — обеспечить эффективное управление ликвидностью.",k:[["внешн"],["рейтинг"],["устойчив"],["платеж"],["риск"],["внутренн"],["резерв"],["ликвидн"]],s:"Вопрос контрольной; Конспект; Крылов, с. 6"},
{b:3,q:"Сформулируйте «золотое правило экономики» предприятия.",a:"Тп > Тв > Та > 100 %: темп роста прибыли больше темпа роста выручки (рентабельность продаж растёт), темп роста выручки больше темпа роста активов (отдача активов растёт), а активы растут — больше 100 % (масштабы деятельности расширяются).",k:[["прибыл"],["выручк"],["актив"],["100"],["рентабельн"],["отдач","оборачиваем"]],s:"Банк тестов к контрольной"},
{b:3,q:"Из чего складывается прибыль до налогообложения? Как оценить её качество?",a:"ПДН = прибыль от продаж + прибыль (убыток) от прочей деятельности (доходы от участия + проценты к получению − проценты к уплате + прочие доходы − прочие расходы). Качество определяется долей прибыли от продаж: желательно ТРпр ≥ ТРпдн.",k:[["продаж"],["проч"],["процент"],["качеств"],["дол","удельн"]],s:"Конспект, табл. 2.1; Крылов, с. 17–18"}
];

{g:"t1",kt:"def",q:"Анализ, который проводится только внутри предприятия для нужд руководства с использованием всей, в том числе закрытой, информации, — это…",o:["финансовый анализ","управленческий анализ","внешний анализ","статистический анализ"],a:1,e:"Только внутри + закрытая информация → управленческий анализ. Финансовый может быть и внешним.",s:"Банк тестов"},
{g:"t1",kt:"def",k:1,q:"Выявление относительных величин, при исчислении которых одну из величин принимают за единицу, а другую выражают как отношение к единице, происходит при помощи…",o:["сравнительного анализа","вертикального анализа","анализа финансовых коэффициентов","трендового анализа","факторного анализа"],a:2,e:"База = 1 → коэффициент. Относительные величины выражают в коэффициентах (база 1) или процентах (база 100).",s:"Вопрос контрольной; Крылов, с. 10"},
{g:"t1",kt:"def",q:"Расчёт отношений между отдельными позициями одного отчёта или позициями разных форм отчётности — это…",o:["анализ относительных показателей (финансовых коэффициентов)","горизонтальный анализ","трендовый анализ","балансовый способ"],a:0,e:"Финансовые коэффициенты — отношения показателей финансовой отчётности.",s:"Крылов, с. 11"},

{g:"t1",kt:"def",q:"Анализ влияния отдельных факторов на результативный показатель — это…",o:["факторный анализ","вертикальный анализ","горизонтальный анализ","трендовый анализ"],a:0,e:"Факторный анализ: способы цепных подстановок, абсолютных разниц, балансовый.",s:"Крылов, с. 14–15"},

{g:"t1",kt:"def",q:"Отношение собственного капитала к внеоборотным активам — это коэффициент…",o:["инвестирования","финансирования","автономии","мобильности"],a:0,e:"СК / ВнА ≥ 1: внеоборотные активы покрыты собственным капиталом.",s:"Крылов, табл. 3.11"},

{g:"t1",kt:"def",q:"Объект финансового анализа — это…",o:["финансовые аспекты хозяйственной деятельности организации","производственный потенциал","конкурентоспособность продукции","численность персонала"],a:0,e:"Не путать с предметом (финрезультаты и финсостояние).",s:"Банк тестов; Крылов, с. 6"},

{g:"t2",kt:"tr",k:1,q:"Если темпы роста выручки меньше темпов роста активов, это свидетельствует о…",o:["повышении отдачи активов","повышении финансовой устойчивости","снижении отдачи активов","снижении финансовой устойчивости"],a:2,e:"Отдача активов = выручка / активы: знаменатель растёт быстрее → отдача падает.",s:"Вопрос контрольной"},

{g:"t2",kt:"tr",q:"Если темпы роста выручки выше темпов роста полной себестоимости, это свидетельствует о…",o:["повышении эффективности текущей деятельности (доля затрат в выручке падает)","снижении рентабельности продаж","снижении отдачи активов","снижении качества прибыли"],a:0,e:"Это условие оптимизации прибыли от продаж: ТРвр > ТРсп.",s:"Крылов, формула 2.2"},

function shuffle(arr,r){r=r||Math.random;const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- sessions ---------- */
function makePerm(q){return q.fix?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i))}
function startSession(o){
 clearInterval(timerInt);
 sess=Object.assign({idx:0,ans:{},perm:{},instant:true,finished:false},o);
 sess.items=sess.items.slice();
 sess.items.forEach(id=>{if(!isOpen(id))sess.perm[id]=makePerm(QID[id])});
 go("quiz");
}
function pickN(a,n){return shuffle(a).slice(0,n)}
function startVariant(step){
 const T1=[...pickN(KBY("t1","def"),5),...pickN([...KBY("t1","m"),...KBY("t1","tf")],1)];
 const O=["o:"+pickN(OPEN1,1)[0],"o:"+pickN(OPEN2,1)[0]];
 const d=pickN(KBY("t2","def"),2),tf=pickN(KBY("t2","tf"),2),tr=pickN(KBY("t2","tr"),2),m=pickN(KBY("t2","m"),1);
 startSession({mode:"kr",title:"Вариант контрольной",items:[...T1,...O,d[0],tf[0],tf[1],d[1],tr[0],tr[1],m[0]],instant:false,step,started:Date.now()});
 startTimer();
}
function startKBank(step){startSession({mode:"kbank",title:"Банк «как на контрольной»",items:KQ.map(q=>q.id),step})}
function startKTr(){startSession({mode:"kbank",title:"Темпы роста",items:shuffle(KQ.filter(q=>q.kt==="tr").map(q=>q.id))})}
function gradeOf(sc,n){const p=sc/n;return p>=.85?5:p>=.65?4:p>=.5?3:2}
function krScore(){const s=sess;return s.items.filter(id=>(s.ans[id]||{}).ok).length}
function gradeVariant(){
 const s=sess;s.finished=true;clearInterval(timerInt);s.dur=Date.now()-s.started;
 s.items.forEach(id=>{const A=s.ans[id]||(s.ans[id]={sel:[],done:false});
  if(isOpen(id)){const c=CID[id.slice(2)],ks=keyInfo(c,A.text||"");A.hits=ks.filter(k=>k.hit).length;A.total=ks.length;A.ok=!!(A.text||"").trim()&&A.hits/A.total>=.6}
  else{const q=QID[id];const sel=A.done?(A.sel||[]):[];let ok;if(q.multi){const need=new Set(q.a),got=new Set(sel);ok=need.size===got.size&&[...need].every(x=>got.has(x))}else ok=sel[0]===q.a;A.ok=ok;A.sel=sel;record(id,ok)}
  A.done=true});
 const sc=krScore();s.krRec={t:Date.now(),score:sc,grade:gradeOf(sc,s.items.length)};
 S.kr=(S.kr||[]).concat([s.krRec]).slice(-50);save();go("result");
}
function krRescore(){const s=sess,sc=krScore();s.krRec.score=sc;s.krRec.grade=gradeOf(sc,s.items.length);save()}
function startBlock(b,step){startSession({mode:"block",block:b,title:"Блок "+b+": "+BLOCKS[b].short,items:QB[b],step})}
function startTopic(t){startSession({mode:"topic",title:TOPICS[t],items:Q.filter(q=>q.t===t).map(q=>q.id)})}
function startTicket(n){startSession({mode:"ticket",ticket:n,title:"Билет "+(n+1),items:TICKETS[n]})}
function startMarathon(){startSession({mode:"marathon",title:"Марафон",items:shuffle(Q.map(q=>q.id))})}
function startStarred(step){startSession({mode:"starred",title:"Вопросы из контрольной",items:Q.filter(q=>q.k).map(q=>q.id),step})}
function startMistakes(step){const ids=errIds();if(!ids.length){if(step){S.plan[step]=true;save()}toast(step?"Ошибок нет — шаг отмечен":"Ошибок нет — так держать");render();return}startSession({mode:"mistakes",title:"Мои ошибки",items:ids,step})}
function startExam(step){
 const items=[1,2,3,4].flatMap(b=>shuffle(QB[b]).slice(0,5));
 startSession({mode:"exam",title:"Экзамен",items,instant:false,step,exam:{phase:"main",deadline:Date.now()+20*60000,extraBlocks:[]}});
 startTimer();
}
function runStep(id){const st=STEP[id],a=st.act;
 if(a.m==="block")startBlock(a.b,id);
 else if(a.m==="cards")startCards(a.f,id);
 else if(a.m==="mistakes")startMistakes(id);
 else if(a.m==="starred")startStarred(id);
 else if(a.m==="exam")startExam(id);

 if(ex.phase==="main"){
  const by={};s.items.slice(0,20).forEach(id=>{if(!s.ans[id].ok){const b=QID[id].b;by[b]=(by[b]||0)+1}});

  const blocks=Object.keys(by).map(Number);
  blocks.forEach(b=>{shuffle(QB[b].filter(id=>!s.items.includes(id))).slice(0,5).forEach(id=>{s.items.push(id);s.perm[id]=makePerm(QID[id])})});

 return c.k.map(alts=>{
  const hit=!!text&&alts.some(a=>nt.includes(a));
  let label=alts[0];

}
