<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Билеты по учёту и анализу</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sofia+Sans:wght@400;500;700;800&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap">
<style>
:root{
  --paper:#F2F4F1; --sheet:#FAFBF9; --ink:#1D2025; --ink-2:#4A505A; --ink-3:#69707B;
  --rule:#C7CCD0; --rule-2:#9AA1A9;
  --copy:#4630A6; --copy-soft:#E6E2F5; --copy-line:#B5ABE3; --on-copy:#FFFFFF;
  --storno:#BE2A22; --storno-soft:#F8E3E0; --storno-line:#E3A9A3;
  --f-body:"Sofia Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-cond:"Sofia Sans Extra Condensed","Sofia Sans Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-type:"IBM Plex Mono","PT Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  --gut:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#171528; --sheet:#1F1C36; --ink:#ECE9F8; --ink-2:#B9B4D3; --ink-3:#928DAE;
    --rule:#37335A; --rule-2:#5A557F;
    --copy:#B9A9FF; --copy-soft:#2B2552; --copy-line:#51478F; --on-copy:#171528;
    --storno:#FF8B7B; --storno-soft:#3D1E24; --storno-line:#7F3D40;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#171528; --sheet:#1F1C36; --ink:#ECE9F8; --ink-2:#B9B4D3; --ink-3:#928DAE;
  --rule:#37335A; --rule-2:#5A557F;
  --copy:#B9A9FF; --copy-soft:#2B2552; --copy-line:#51478F; --on-copy:#171528;
  --storno:#FF8B7B; --storno-soft:#3D1E24; --storno-line:#7F3D40;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--copy);outline-offset:2px}
h1,h2,h3,p,ul,ol,dl,dd,table,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3{text-wrap:balance}
.sheet{max-width:920px;margin:0 auto;padding-inline:var(--gut);padding-block:18px 72px}
@media (max-width:560px){:root{--gut:16px}}
.typed{font-family:var(--f-type);color:var(--copy);font-variant-numeric:tabular-nums}
.cap{font-size:13px;color:var(--ink-3);line-height:1.35}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1.5px solid var(--ink);border-radius:3px;background:transparent;font-weight:700;font-size:15px;line-height:1.2;text-align:center}
.btn:hover:not(:disabled){background:var(--sheet)}
.btn.main{background:var(--copy);border-color:var(--copy);color:var(--on-copy)}
.btn.main:hover:not(:disabled){filter:brightness(1.12);background:var(--copy)}
.btn.quiet{border-color:transparent;color:var(--ink-2);padding-inline:8px;font-weight:500}
.btn.quiet:hover:not(:disabled){color:var(--ink);background:transparent;text-decoration:underline}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.4}

.stamp{display:inline-block;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.09em;font-size:19px;line-height:1;padding:5px 10px 4px;border:2px solid currentColor;border-radius:4px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px currentColor;transform:rotate(-3deg);color:var(--copy);white-space:nowrap}
.stamp.bad{color:var(--storno)}
.stamp.big{font-size:34px;padding:12px 18px 9px;border-width:3px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px currentColor;transform:rotate(-6deg)}
.stamp small{display:block;font-size:.42em;letter-spacing:.14em;margin-top:5px;font-family:var(--f-body);font-weight:700}

.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 32px;align-items:end;padding-bottom:22px;border-bottom:3px double var(--ink)}
.formno{font-size:12.5px;color:var(--ink-3);line-height:1.3;margin-bottom:10px}
.head h1{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:clamp(46px,10.5vw,84px);line-height:.9;letter-spacing:.004em}
.lead{margin-top:14px;max-width:56ch;color:var(--ink-2)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.sum{border-collapse:collapse;font-size:14px;min-width:230px}
.sum caption{caption-side:top;text-align:right;font-size:12.5px;color:var(--ink-3);padding-bottom:4px}
.sum th{font-weight:400;text-align:right;padding:5px 10px 5px 0;color:var(--ink-2);white-space:nowrap}
.sum td{border:1.5px solid var(--ink);padding:4px 10px;text-align:center;font-family:var(--f-type);color:var(--copy);font-weight:500;min-width:92px;white-space:nowrap}
@media (max-width:760px){.head{grid-template-columns:minmax(0,1fr)}.sum{width:100%}.sum caption{text-align:left}.sum th{text-align:left;width:100%}}

.resume{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:18px;padding:12px 14px;border:1.5px dashed var(--copy);border-radius:3px;background:var(--copy-soft)}
.resume p{min-width:0;flex:1 1 260px}
.resume div{display:flex;gap:8px;flex-wrap:wrap}

.sec{margin-top:40px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding-bottom:8px;border-bottom:1.5px solid var(--ink);margin-bottom:4px}
.sec-h h2{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:30px;line-height:1;letter-spacing:.01em}
.sec-h p{font-size:14px;color:var(--ink-2);min-width:0}

.abacus{margin-top:26px;border:2.5px solid var(--ink);border-radius:5px;overflow:hidden}
.wire{--st:21px;display:grid;grid-template-columns:54px minmax(0,1fr) 76px;align-items:center;width:100%;padding:0 14px 0 0;border:0;background:none;text-align:left}
.wire:hover{background:var(--sheet)}
.wire + .wire{border-top:1px solid var(--rule)}
.w-no{font-family:var(--f-cond);font-weight:800;font-size:28px;line-height:1;text-align:center;border-right:2.5px solid var(--ink);align-self:stretch;display:grid;place-items:center}
.w-mid{min-width:0;padding:8px 0 8px 14px}
.w-name{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.w-name small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}
.w-rod{position:relative;display:block;height:26px;margin-top:4px;background:linear-gradient(var(--rule-2),var(--rule-2)) 0 50%/100% 2px no-repeat}
.bead{position:absolute;top:2px;width:17px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);left:calc(100% - (10 - var(--i)) * var(--st));transition:left .7s cubic-bezier(.3,.9,.3,1)}
.bead.mid{background:var(--ink)}
.bead.m{left:calc(var(--i) * var(--st));background:var(--copy);border-color:var(--copy)}
.w-val{font-family:var(--f-type);color:var(--copy);font-weight:500;font-size:15px;text-align:right;white-space:nowrap;line-height:1.2}
.w-val small{display:block;color:var(--storno);font-size:12px;font-weight:400}
.w-val small .sm{display:none}
.abacus-cap{margin-top:8px}
@media (max-width:480px){.wire{--st:19px;grid-template-columns:42px minmax(0,1fr) 62px;padding-right:10px}.w-no{font-size:23px}.w-mid{padding-left:10px}.bead{width:16px}.w-name small{display:none}.w-val small .lg{display:none}.w-val small .sm{display:inline}}
@media (prefers-reduced-motion:reduce){.bead{transition:none}}

.days{display:flex;flex-wrap:wrap;gap:0;margin-top:14px;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;width:fit-content;max-width:100%}
.day-tab{border:0;border-right:1.5px solid var(--ink);background:none;padding:7px 14px;font-weight:700;font-size:14.5px;line-height:1.2;display:flex;align-items:center;gap:6px}
.day-tab:last-child{border-right:0}
.day-tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.day-tab .tick{display:inline-grid;place-items:center;width:14px;height:14px;color:var(--copy)}
.day-tab[aria-selected="true"] .tick{color:inherit}
.day-t{margin-top:14px;font-weight:700;font-size:18px}
.day-t span{font-weight:400;color:var(--ink-2);font-size:14.5px;margin-left:8px}
.steps{margin-top:6px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.chk{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:2px;background:none;padding:0;display:grid;place-items:center;font-family:var(--f-type);font-weight:600;color:var(--copy);font-size:16px;line-height:1}
.chk[aria-pressed="true"]::after,.tick::after{content:"";display:block;width:11px;height:6px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-2px) rotate(-45deg)}
.chk:disabled{border-style:dashed;opacity:1}
.step-l{min-width:0;line-height:1.35}
.step-l small{display:block;color:var(--ink-3);font-size:13px}
.step.done .step-l b{color:var(--ink-3);font-weight:500}
.step-l b{font-weight:700}

.tickets{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));margin-top:14px;border:1.5px solid var(--ink);border-radius:4px}
.tk{border:0;border-right:1.5px dashed var(--rule-2);background:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tk:last-child{border-right:0}
.tk:hover{background:var(--sheet)}
.tk b{font-family:var(--f-cond);font-weight:800;font-size:34px;line-height:1}
.tk span{font-family:var(--f-type);font-size:12px;color:var(--ink-3);white-space:nowrap;line-height:1.3}
.tk small{font-family:var(--f-type);font-size:11px;color:var(--ink-3);white-space:nowrap;line-height:1.3;min-height:1.3em}
.tk.pass b,.tk.pass span{color:var(--copy)}
.tk.fail span,.tk.fail small{color:var(--storno)}
@media (max-width:640px){.tickets{grid-template-columns:repeat(5,minmax(0,1fr))}.tk:nth-child(5){border-right:0}.tk:nth-child(n+6){border-top:1.5px dashed var(--rule-2)}}

.reg-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:baseline;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left}
.reg-row:hover:not(:disabled){background:var(--sheet)}
.reg-row b{font-size:17px;font-weight:700}
.reg-row .n{font-family:var(--f-type);color:var(--copy);font-size:14.5px;white-space:nowrap;text-align:right}
.reg-row .d{grid-column:1/-1;color:var(--ink-2);font-size:14.5px;max-width:70ch}
.reg-row:disabled{opacity:.5}
.reg-row.lead-row b{font-size:19px}
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kind{border:1.5px solid var(--ink);border-radius:3px;background:none;padding:6px 12px;font-weight:700;font-size:14.5px;display:inline-flex;gap:8px;align-items:baseline}
.kind:hover{background:var(--sheet)}
.kind span{font-family:var(--f-type);color:var(--copy);font-weight:500;font-size:13.5px}
.blk{margin-top:22px}
.blk-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1.5px solid var(--ink)}
.blk-h .r{font-family:var(--f-cond);font-weight:800;font-size:30px;line-height:1;min-width:38px}
.blk-h .nm{min-width:0;line-height:1.3}
.blk-h .nm b{display:block;font-size:17px}
.blk-h .nm span{font-size:13px;color:var(--ink-3)}
.tp-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:12px;align-items:center;width:100%;padding:8px 0 8px 50px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;font-size:15px}
.tp-row:hover{background:var(--sheet)}
.meter{height:8px;border:1px solid var(--rule-2);display:flex;background:var(--sheet)}
.meter i{display:block;height:100%}
.meter .g{background:var(--copy)}
.meter .x{background:var(--storno)}
.tp-row .n{font-family:var(--f-type);color:var(--copy);font-size:13.5px;text-align:right;white-space:nowrap}
@media (max-width:560px){.tp-row{grid-template-columns:minmax(0,1fr) 64px 46px;padding-left:0}}
.foot{margin-top:44px;padding-top:14px;border-top:3px double var(--ink);display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink-2)}
.foot p{min-width:0;flex:1 1 300px}
.foot .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1.5px solid var(--ink)}
.bar-t{min-width:0;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:24px;line-height:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-r{display:flex;gap:10px;align-items:center}
.timer{font-family:var(--f-type);font-weight:600;font-size:17px;color:var(--copy);padding:3px 8px;border:1.5px solid var(--copy);border-radius:3px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--storno);border-color:var(--storno)}
.nav-wrap{overflow-x:auto;margin-top:12px;padding:3px 2px 6px;scrollbar-width:thin}
.nav{position:relative;display:flex;gap:5px;min-width:min-content;padding-block:2px;background:linear-gradient(var(--rule-2),var(--rule-2)) 0 50%/100% 2px no-repeat}
.nb{flex:0 0 26px;width:26px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);padding:0;font-family:var(--f-type);font-size:11.5px;font-weight:500;color:var(--ink-2);display:grid;place-items:center}
.nb.ok{background:var(--copy);border-color:var(--copy);color:var(--on-copy)}
.nb.bad{background:var(--storno);border-color:var(--storno);color:var(--paper)}
.nb.ans{background:var(--ink);color:var(--paper)}
.nb.cur{outline:2px solid var(--copy);outline-offset:2px}
.nb.sep{margin-left:14px}
.nb:disabled{opacity:.35}
.note{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--storno);border-radius:3px;font-size:15px}
.note b{color:var(--storno)}

.task{margin-top:16px}
.task-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:end;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.task-no{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:24px;line-height:1;letter-spacing:.01em}
.task-no span{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--ink-3);text-transform:none;letter-spacing:0;margin-left:8px}
.codes{display:flex;border:1.5px solid var(--ink);border-radius:2px;font-size:12.5px;line-height:1.25}
.codes div{padding:3px 9px 4px;border-right:1px solid var(--ink);min-width:0}
.codes div:last-child{border-right:0}
.codes dt{color:var(--ink-3)}
.codes dd{font-family:var(--f-type);color:var(--copy);font-weight:500;font-size:13.5px;white-space:nowrap}
@media (max-width:560px){.task-h{grid-template-columns:minmax(0,1fr)}.codes{width:fit-content;max-width:100%}.codes .wide{display:none}}
.ctx{margin-top:12px;border:1.5px solid var(--ink);border-radius:3px}
.ctx summary{cursor:pointer;padding:8px 12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
.ctx summary::-webkit-details-marker{display:none}
.ctx summary::after{content:"показать";font-weight:400;color:var(--ink-3);font-size:14px}
.ctx[open] summary::after{content:"свернуть"}
.ctx-b{padding:4px 12px 12px;border-top:1px solid var(--rule);display:grid;gap:12px}
.ctx-b p{font-size:15px;max-width:75ch}
.q{margin-top:16px;font-size:clamp(18px,2.5vw,20.5px);font-weight:700;line-height:1.4;max-width:66ch}
.hint{margin-top:8px;font-size:14px;color:var(--ink-3)}
.tbl-w{overflow-x:auto;margin-top:12px}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.35}
.tbl caption{caption-side:top;text-align:left;font-size:13px;color:var(--ink-3);padding-bottom:5px}
.tbl th{font-weight:700;font-size:13px;text-align:left;padding:6px 10px;border:1px solid var(--rule-2);background:var(--sheet);vertical-align:bottom}
.tbl td{padding:6px 10px;border:1px solid var(--rule-2);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:3px double var(--ink)}
.tbl-cap{margin-top:12px}
.tbl-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;align-items:start}
.tbl-2 .tbl-w{margin-top:5px}
.tbl-2 .tbl{table-layout:fixed}
.tbl-2 .tbl .num{width:104px}
@media (max-width:700px){.tbl-2{grid-template-columns:minmax(0,1fr)}.tbl-2 .tbl-w + .tbl-w{margin-top:0}.tbl-2 .tbl-w + .tbl-w thead{display:none}.tbl-2 .tbl-w + .tbl-w tr:first-child td{border-top:0}}
.work{margin-top:14px}

.opts{border-top:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:11px 4px 11px 0;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;line-height:1.42}
.opt:hover:not(:disabled){background:var(--sheet)}
.box{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:2px;display:grid;place-items:center;font-weight:700;font-size:14px;line-height:1;text-transform:uppercase;background:var(--paper)}
.opt.multi .box{border-radius:2px}
.opt.sel .box{background:var(--copy);border-color:var(--copy);color:var(--on-copy)}
.opt.sel .opt-t{color:var(--copy)}
.opt.right .box{background:var(--copy);border-color:var(--copy);color:var(--on-copy)}
.opt.right .opt-t{font-weight:700}
.opt.wrong .box{background:var(--storno);border-color:var(--storno);color:var(--paper)}
.opt.wrong .opt-t{color:var(--storno);text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.missed .box{border:1.5px dashed var(--copy);color:var(--copy)}
.opt-m{font-size:12.5px;font-weight:700;white-space:nowrap;align-self:center;font-family:var(--f-type)}
.opt.right .opt-m,.opt.missed .opt-m{color:var(--copy)}
.opt.wrong .opt-m{color:var(--storno)}
@media (max-width:480px){.opt-m{display:none}}

.flds{display:grid;gap:14px;max-width:520px}
.fld{display:grid;gap:3px}
.fld-l{font-size:15px;font-weight:700}
.fld-in{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--ink)}
.fld-in input{flex:1 1 auto;min-width:0;width:100%;border:0;background:transparent;padding:6px 2px 4px;font-family:var(--f-type);font-size:19px;font-weight:500;color:var(--copy);font-variant-numeric:tabular-nums}
.fld-in input:focus{outline:none}
.fld-in:focus-within{border-bottom-color:var(--copy);box-shadow:0 1.5px 0 var(--copy)}
.fld-in input::placeholder{color:var(--ink-3);opacity:.55}
.unit{font-size:14px;color:var(--ink-2);white-space:nowrap}
.fld-c{font-size:12.5px;color:var(--ink-3)}
.fld.right .fld-in{border-bottom-color:var(--copy)}
.fld.wrong .fld-in input{color:var(--storno);text-decoration:line-through}
.fld.wrong .fld-in{border-bottom-color:var(--storno)}

 e:"В определении три свойства отражения: сплошное (без пропусков), непрерывное (без перерывов во времени) и взаимосвязанное. Отражают факты на счетах, а основанием служат первичные документы. Выборочное наблюдение — приём статистики, а оперативный учёт — отдельный вид учёта.",
 s:"Лекция 1, слайд 7"},

{b:1,t:"1a",k:"bucket",q:"К какому виду учёта относится каждая ситуация?",
 c:[["Опер.","Оперативный"],["Стат.","Статистический"],["Фин.","Финансовый (бухгалтерский)"],["Нал.","Налоговый"],["Упр.","Управленческий"]],
 it:[["Подготовлены операционный и финансовый бюджеты компании на предстоящий год",4],
     ["Сделана выборка о возрастном и образовательном составе работников",1],
     ["Сформирована декларация по налогу на прибыль",3],
     ["С расчётного счёта перечислены деньги в погашение задолженности",2],
     ["Получены данные, что на складе есть нужное количество запасов",0],
     ["Учтена явка работников на смену",0]],
 e:"Бюджеты нужны для управления — это управленческий учёт. Выборка о составе работников изучает массовое явление — статистика. Декларация формирует налоговую базу — налоговый учёт. Перечисление денег отражается на счетах по документу — финансовый (бухгалтерский) учёт. Наличие запасов «прямо сейчас» и явка на работу требуют быстрой информации — оперативный учёт.",
 s:"Практика 1, задания 1 и 3; лекция 1, слайды 3–8"},

{b:1,t:"1a",k:"tf",q:"Оцени каждое утверждение о видах учёта.",
 st:[["Статистический учёт применяется в народном хозяйстве и отраслях, но не на отдельных предприятиях",0],
     ["Бухгалтерский учёт отражает факты хозяйственной деятельности на основании первичных документов",1],
     ["Финансовый и налоговый учёт — внешняя информационная система, управленческий — внутренняя",1],
     ["Бухгалтерский учёт ведётся с первой хозяйственной операции до сдачи годовой отчётности",0]],
 e:"Статистический учёт применяется и на предприятиях, в объединениях, организациях и учреждениях. Бухгалтерский учёт ведётся непрерывно с момента регистрации юридического лица до его реорганизации или ликвидации, а не до сдачи отчётности.",
 s:"Лекция 1, слайды 6–9"},

{b:1,t:"1a",k:"bucket",q:"Какой измеритель используется для каждого показателя?",
 c:[["Натур.","Натуральный"],["Труд.","Трудовой"],["Ден.","Денежный"]],
 it:[["Норма расхода материалов на единицу продукции",0],
     ["Отработанное время производственных рабочих",1],
     ["Выручка от продажи продукции",2],
     ["Поголовье животных",0],
     ["Пробег автомобиля руководителя",0],
     ["Себестоимость единицы продукции",2],
     ["Норма штучного времени на изделие, часов",1]],
 e:"Натуральные измерители — меры количества, веса, длины: килограммы на изделие, головы, километры. Трудовые — затраты времени: человеко-часы, нормо-часы. Денежный измеритель обобщает разнородные объекты: выручка, себестоимость.",
 s:"Лекция 1, слайды 12–25; практика 1, задание 2; практика 1.1, задание 1"},

{b:1,t:"1a",k:"gen",g:"prod",kk:"num"},
{b:1,t:"1a",k:"gen",g:"usl",kk:"grid"},

{b:1,t:"1a",k:"one",q:"Завод выпускает три удобрения с разным содержанием пятиокиси фосфора. Почему общий выпуск нельзя получить, просто сложив килограммы?",
 o:["продукция неоднородна по полезному веществу: нужен пересчёт в условные единицы",
    "натуральные измерители применимы только к материалам, но не к готовой продукции",
    "выпуск продукции по правилам учёта измеряют только в трудовых измерителях",
    "килограммы допустимы только вместе с денежной оценкой каждой позиции выпуска"],a:0,
 e:"Натуральные единицы складывают только по однородным объектам. Когда содержание полезного вещества разное, применяют условно-натуральный измеритель: объём каждого вида умножают на коэффициент пересчёта и суммируют (в примере лекции — 430 000 кг условного продукта).",
 s:"Лекция 1, слайды 18–19"},

{b:1,t:"1a",k:"multi",q:"Отметь все натуральные измерители.",
 o:["тонны","штуки","километры пробега","нормо-часы","человеко-дни","рубли"],a:[0,1,2],
 e:"Натуральные измерители показывают количество, вес, длину, объём: тонны, штуки, километры. Нормо-часы и человеко-дни — трудовые измерители (затраты времени), рубли — денежный.",
 s:"Лекция 1, слайды 12–25"},

{b:1,t:"1b",k:"match",q:"Соотнеси вид учёта с ключевым фрагментом его определения.",
 L:["Оперативный учёт","Статистический учёт","Финансовый учёт","Налоговый учёт","Управленческий учёт"],
 R:["наблюдение и контроль за отдельными хозяйственными операциями, главное — быстрота информации",
    "наблюдение, изучение и контроль массовых социально-экономических явлений и процессов",
    "исчисление и оценка показателей и представление их пользователям для принятия решений",
    "сплошной документальный учёт операций, связанных с исчислением базы и сумм платежей в бюджет",
    "сбор и контроль данных, необходимых для управления структурными подразделениями",
    "проверка соответствия фактического наличия объектов данным учётных регистров"],
 a:[0,1,2,3,4],
 e:"Оперативный учёт ценен быстротой информации и возможностью быстро реагировать. Статистика изучает массовые явления. Финансовый учёт готовит показатели для пользователей, налоговый формирует налоговую базу, управленческий даёт данные для управления подразделениями. Лишний вариант — определение инвентаризации.",
 s:"Лекция 1, слайды 3, 6, 26–28"},

{b:1,t:"1b",k:"tf",q:"Оцени каждое утверждение.",
 st:[["Закон «О бухгалтерском учёте» — Федеральный закон от 06.12.2011 № 402-ФЗ",1],
     ["Управленческий учёт служит прежде всего внешним пользователям отчётности",0],
     ["Налоговый учёт ведётся выборочно — по наиболее крупным хозяйственным операциям",0],
     ["Финансовый учёт документально наблюдает, измеряет и регистрирует факты хозяйственной жизни",1]],
 e:"Управленческий учёт — внутренняя информационная система: он нужен для управления подразделениями и принятия решений. Налоговый учёт ведётся путём сплошного, непрерывного и документального учёта операций.",
 s:"Лекция 1, слайды 8–9, 26–28"},

{b:1,t:"1b",k:"one",q:"Финансовый директор просит показать затраты каждого цеха, чтобы решить, какой из них сокращать. Какая подсистема учёта даёт такие данные?",
 o:["управленческий учёт","финансовый учёт","налоговый учёт","статистический учёт"],a:0,
 e:"Управленческий учёт — информационная система сбора, измерения, систематизации и контроля данных, необходимых для управления структурными подразделениями и принятия оптимальных управленческих решений. Финансовый учёт готовит показатели для пользователей отчётности, а не разрез по цехам.",
 s:"Лекция 1, слайд 28"},

{b:1,t:"1b",k:"cloze",q:"Восстанови определение налогового учёта.",
 tx:"Налоговый учёт — упорядоченная система сбора, регистрации и обобщения информации в {0} выражении о формировании {1} по конкретным налогам путём {2}, непрерывного и {3} учёта хозяйственных операций.",
 g:["денежном","налоговой базы","сплошного","документального"],x:["натуральном","чистой прибыли","выборочного","оперативного"],sw:[[2,3]],
 e:"Налоговый учёт обобщает информацию только в денежном выражении, его цель — налоговая база по конкретным налогам. Как и бухгалтерский, он сплошной, непрерывный и документальный.",
 s:"Лекция 1, слайд 27"},

{b:1,t:"1c",k:"one",q:"Принципы регулирования бухгалтерского учёта, по лекции, позволяют сделать учётную информацию…",
 o:["уместной, объективной, осуществимой","полной, своевременной, рациональной","правдивой, реальной, преемственной","сплошной, непрерывной, взаимосвязанной"],a:0,
 e:"В лекции: принципы «позволяют сделать информацию… уместной, объективной, осуществимой». Остальные тройки тоже из курса, но о другом: полнота, своевременность и рациональность — требования к ведению учёта; правдивость, реальность и преемственность — требования к балансу; сплошное, непрерывное и взаимосвязанное — свойства отражения в определении бухгалтерского учёта.",
 s:"Лекция 1, слайд 30; лекция 2, слайд 8"},

{b:1,t:"1c",k:"match",q:"Подбери к каждому требованию его определение.",
 L:["Полнота","Осмотрительность","Приоритет содержания перед формой","Непротиворечивость","Рациональность","Своевременность"],
 R:["отражение всех фактов хозяйственной деятельности без пропусков и изъятий в регистрах",
    "бо́льшая готовность признать потери и пассивы, чем возможные доходы и активы",
    "отражение фактов исходя не только из правовой формы, но и из экономической сути",
    "тождество данных аналитического учёта оборотам и остаткам синтетических счетов",
    "экономное ведение учёта исходя из структуры и особенностей деятельности организации",
    "регистрация и накопление данных первичных документов в регистрах без опозданий"],
 a:[0,1,2,3,4,5],
 e:"Это шесть требований к ведению учёта из ПБУ 1/2008. Чаще всего путают полноту (ничего не пропущено) со своевременностью (ничего не опоздало) и осмотрительность (осторожность в оценках) с рациональностью (экономность самого учёта).",
 s:"Практика 1, задание 6; ПБУ 1/2008, пункт 6"},

{b:1,t:"1c",k:"one",q:"Компания признала в учёте вероятный убыток по одному судебному иску, но не стала признавать вероятный выигрыш по другому. Какое требование к ведению учёта она выполнила?",
 o:["осмотрительность","полнота","приоритет содержания перед формой","рациональность"],a:0,
 e:"Осмотрительность — бо́льшая готовность к учёту потерь (расходов) и пассивов, чем возможных доходов и активов, без создания скрытых резервов. Полнота здесь не подходит: она требует отражать все свершившиеся факты, а не вероятные доходы.",
 s:"Практика 1, задание 6"},

{b:1,t:"1c",k:"one",q:"По договору оборудование числится арендованным, но все риски и выгоды от него несёт арендатор, и он показывает объект в своих активах. Какое требование здесь работает?",
 o:["приоритет содержания перед формой","последовательность применения учётной политики","временная определённость фактов","имущественная обособленность"],a:0,
 e:"Факты отражают исходя не только из правовой формы, но и из экономического содержания и условий хозяйствования. На этой же идее построен учёт аренды по ФСБУ 25/2018. Остальные три варианта — не требования, а допущения из ПБУ 1/2008.",
 s:"Практика 1, задание 6; лекция 3, слайд 50"},

{b:1,t:"1c",k:"one",q:"На 1-е число сумма остатков по аналитическим счетам материалов не совпала с остатком синтетического счёта 10. Какое требование нарушено?",
 o:["непротиворечивость","полнота","приоритет содержания перед формой","своевременность"],a:0,
 e:"Непротиворечивость — тождество данных аналитического учёта оборотам и остаткам по счетам синтетического учёта на первое число каждого месяца, а также показателей отчётности данным синтетического и аналитического учёта.",
 s:"Практика 1, задание 6"},

{b:1,t:"1c",k:"bucket",q:"Раздели принципы ведения учёта на допущения и требования.",
 c:[["Допущ.","Допущение"],["Треб.","Требование"]],
 it:[["Имущественная обособленность",0],["Непрерывность деятельности",0],
     ["Последовательность применения учётной политики",0],["Временная определённость фактов хозяйственной деятельности",0],
     ["Полнота",1],["Осмотрительность",1],["Рациональность",1],["Приоритет содержания перед формой",1]],
 e:"Принципы, по которым учёт ведётся, делятся на требования и допущения. Допущений в ПБУ 1/2008 четыре: имущественная обособленность, непрерывность деятельности, последовательность применения учётной политики, временная определённость фактов. Требований шесть: полнота, своевременность, осмотрительность, приоритет содержания перед формой, непротиворечивость, рациональность.",
 s:"Лекция 1, слайды 31–33; ПБУ 1/2008, пункты 5 и 6"},

{b:1,t:"1c",k:"one",q:"Допущения и требования — это разновидности…",
 o:["принципов, по которым учёт ведётся","принципов, по которым учёт регулируется","элементов метода бухгалтерского учёта","объектов бухгалтерского учёта"],a:0,
 e:"Все принципы делятся на те, по которым учёт регулируется, и те, по которым он ведётся. Именно вторые делятся на требования и допущения.",
 s:"Лекция 1, слайд 31"},

{b:1,t:"1c",k:"bucket",q:"Распредели пользователей бухгалтерской информации по четырём группам из практики 1.",
 c:[["Внутр.","Внутренние"],["Прямой","Внешние с прямым финансовым интересом"],["Косв.","Внешние с косвенным финансовым интересом"],["Без инт.","Внешние без финансового интереса"]],
 it:[["Правление",0],["Кредитующий банк",1],["Потенциальный инвестор",1],["Поставщики и подрядчики",1],
     ["Обслуживающий банк",2],["Страховая компания",2],["Аудиторская фирма",3],["Органы статистики",3]],
 e:"Внутренние пользователи — руководство и специалисты самой организации. Прямой финансовый интерес у тех, кто вложил или собирается вложить средства: инвесторы, кредитующие банки, поставщики. Косвенный — у обслуживающих банков, страховых компаний, налоговых органов. Аудиторские фирмы, органы статистики и арбитраж финансового интереса не имеют.\nВ практике 1.1 колонок только три: группы «без финансового интереса» там нет, и аудиторов со статистикой обычно относят к косвенному интересу. Сверь обе таблицы со схемой на слайде 35 лекции: в тренажёр она попала без рисунка.",
 s:"Практика 1, задание 4; лекция 1, слайды 34–35"},

{b:1,t:"1c",k:"one",q:"Банк А выдал компании кредит, банк Б только ведёт её расчётный счёт. К каким группам внешних пользователей они относятся?",
 o:["А — прямой финансовый интерес, Б — косвенный","А — косвенный финансовый интерес, Б — прямой","оба — с прямым финансовым интересом","оба — с косвенным финансовым интересом"],a:0,
 e:"Кредитующий банк рискует собственными деньгами — у него прямой финансовый интерес, как у инвесторов и поставщиков. Обслуживающий банк, как страховые компании и налоговые органы, относится к пользователям с косвенным интересом.",
 s:"Практика 1, задание 4"},

{b:1,t:"1c",k:"tf",q:"Оцени каждое утверждение о пользователях бухгалтерской информации.",
 st:[["Аудиторская фирма — внутренний пользователь, раз она работает с документами организации",0],
     ["Деление пользователей на внутренних и внешних следует общей концепции международных стандартов",1],
     ["В классификации из четырёх групп органы статистики и арбитраж — пользователи без финансового интереса",1],
     ["Руководитель отдела снабжения — внешний пользователь с косвенным интересом",0],
     ["Пользователем признаётся любое юридическое или физическое лицо, нуждающееся в информации об организации",1]],
 e:"Аудиторская фирма — внешний пользователь: в классификации из четырёх групп у неё нет финансового интереса. Руководитель отдела снабжения работает внутри организации — он внутренний пользователь.",
 s:"Лекция 1, слайд 34; практика 1, задание 4; практика 1.1, задание 2"},

{b:1,t:"1d",k:"multi",q:"Что закон и лекция относят к объектам бухгалтерского учёта? Отметь все.",
 o:["активы","обязательства","источники финансирования деятельности","доходы и расходы","первичные учётные документы","бухгалтерские счета","пользователи отчётности"],a:[0,1,2,3],
 e:"Объекты: факты хозяйственной жизни, активы, обязательства, источники финансирования деятельности, доходы, расходы и иные объекты, если это установлено федеральными стандартами. Документы и счета — элементы метода (способы учёта), а пользователи — те, для кого учёт ведётся.",
 s:"Лекция 1, слайд 36"},

{b:1,t:"1d",k:"bucket",q:"Объекты учёта делят на обеспечивающие хозяйственную деятельность и составляющие её. Куда относится каждый?",
 c:[["Обеспеч.","Обеспечивают деятельность"],["Составл.","Составляют деятельность"]],

{b:1,t:"1d",k:"bucket",q:"Актив, обязательство или капитал?",

 c:[["Дебит.","Дебиторская: должны организации"],["Кредит.","Кредиторская: должна организация"]],

 s:"Практика 1.1, задание 4; лекция 3, слайд 70"}
);

{b:2,t:"2b",k:"grid",q:"По данным ПАО «Темп» составь баланс-нетто на начало периода и найди итоги разделов, тыс. руб.",tb:TB_TEMP,

 s:"Практика 2, задание 3"},

 ln:[["84","75"]],pool:["50","51","70","75","80","84"],tp:2,
 e:"Прибыль уменьшается — дебет счёта 84. Возникает кредиторская задолженность перед учредителями по выплате доходов — кредит счёта 75. Это пассивная пермутация, II тип.",
 s:"Лекция 2, слайд 15; План счетов, счёт 75"},

{b:3,t:"3c",k:"post",q:"С расчётного счёта перечислен аванс поставщику под будущую поставку материалов. Составь проводку и определи тип изменения баланса.",
 ln:[["60","51"]],pool:["10","51","60","62","76","97"],tp:1,
 e:"Счёт 60 активно-пассивный. Аванс — это дебиторская задолженность поставщика: он должен организации материалы. Её увеличение записывают по дебету 60, уменьшение денег — по кредиту 51. Обе статьи в активе: I тип. Материалы на счёт 10 придут позже, при поставке.",
 s:"Лекция 2, слайды 30 и 46; «Счета и двойная запись», рис. 3"},

{b:3,t:"3c",k:"post",q:"На расчётный счёт поступило 15 000 руб.: 10 000 — от покупателя в погашение долга и 5 000 — из кассы. Составь сложную проводку: две строки.",
 ln:[["51","62"],["51","50"]],pool:["50","51","60","62","66","90"],
 e:"Дебетуется один счёт — 51, кредитуются два: 62 (покупатель погасил долг) и 50 (наличные сданы из кассы). Такую проводку называют сложной; её всегда можно разложить на простые.",
 s:"Практика 3, операция 9; лекция 2, слайд 49"},

{b:3,t:"3c",k:"post",q:"От поставщиков поступили строительные материалы на 18 000 руб. и запасные части на 21 000 руб. Составь проводки по субсчетам счёта 10.",
 ln:[["10.8","60"],["10.5","60"]],pool:["10.3","10.5","10.8","41","60","62"],
 e:"По Плану счетов субсчёт 10.8 — строительные материалы, 10.5 — запасные части (10.3 — топливо). Оба дебетуются в корреспонденции с кредитом счёта 60: всего 39 000 руб.",
 s:"Лекция 2, слайд 49; План счетов, субсчета счёта 10"},

{b:3,t:"3c",k:"order",q:"В каком порядке, по лекции, рассуждают при составлении проводки?",
 seq:["Назвать два счёта, в которых операция вызвала изменения","Определить, к средствам или к источникам относится каждый счёт","Определить вид каждого счёта по отношению к балансу",
      "Определить, увеличение или уменьшение вызвала операция","Решить, на какой стороне каждого счёта отразить изменение"],
 e:"Сначала находят счета, затем выясняют их природу (средства или источники; активный, пассивный или активно-пассивный), потом направление изменения — и только после этого выбирают дебет или кредит.",
 s:"Лекция 2, слайд 46"},

{b:3,t:"3c",k:"rows",q:"В какой строке журнала корреспонденция счетов составлена неверно?",
 h:["Операция","Дебет","Кредит"],
 r:[["Поступили материалы от поставщика","10","60"],["Из кассы выдана заработная плата","50","70"],["Получен краткосрочный кредит на расчётный счёт","51","66"],
    ["С расчётного счёта перечислен налог в бюджет","68","51"],["Покупатель оплатил долг на расчётный счёт","51","62"]],a:1,
 e:"При выдаче зарплаты уменьшается долг перед работниками (дебет пассивного счёта 70) и уменьшаются деньги в кассе (кредит активного счёта 50). Верно: Д 70 К 50. Запись Д 50 К 70 означала бы, что работники внесли деньги в кассу.",
 s:"Практика 3, операция 4"},

{b:3,t:"3c",k:"one",q:"Поступили материалы, счёт поставщика ещё не оплачен. Как эта операция отражается на активно-пассивном счёте 60?",
 o:["по кредиту: растёт кредиторская задолженность","по дебету: растёт кредиторская задолженность","по кредиту: растёт дебиторская задолженность","по дебету: растёт дебиторская задолженность"],a:0,
 e:"Организация стала должна поставщику — это кредиторская задолженность. На активно-пассивных счетах расчётов её увеличение записывают по кредиту, а увеличение дебиторской — по дебету.",
 s:"Лекция 2, слайд 46"},

{b:3,t:"3d",k:"match",q:"Чем объясняется каждое равенство оборотной ведомости?",
 L:["Итоги начальных сальдо по дебету и кредиту равны","Итоги оборотов по дебету и кредиту равны","Итоги конечных сальдо по дебету и кредиту равны"],
 R:["актив и пассив баланса на начало месяца равны","каждая сумма записана и по дебету, и по кредиту","итоги актива и пассива баланса на конец месяца равны",
    "данные аналитических счетов равны синтетическим","каждый счёт к концу месяца должен быть закрыт"],a:[0,1,2],
 e:"Первая пара следует из равенства актива и пассива начального баланса, вторая — из двойной записи, третья — из равенства итогов баланса на конец месяца. Если хоть одно равенство не выполнено, в разноске или подсчётах есть ошибка.",
 s:"Лекция 2, слайд 54"},

{b:3,t:"3d",k:"one",q:"В оборотной ведомости ООО «Ромашка» за октябрь итог оборотов по дебету — 365 000 руб. С какой ещё величиной он обязан совпасть, кроме итога оборотов по кредиту?",
 o:["с итогом журнала хозяйственных операций","с валютой баланса на конец отчётного месяца","с итогом конечных сальдо по дебету всех счетов","с итогом начальных сальдо по кредиту всех счетов"],a:0,
 e:"Каждая сумма из журнала попадает один раз в дебетовый и один раз в кредитовый оборот. Поэтому итог оборотов по дебету = итог оборотов по кредиту = итог журнала: 365 000. Валюта баланса и итоги сальдо — другие величины: 650 000 на начало и 690 000 на конец.",
 s:"Практика 3, таблицы 2 и 7"},

{b:3,t:"3d",k:"one",q:"Какую ошибку проверка трёх равенств оборотной ведомости НЕ обнаружит?",
 o:["в проводке перепутаны дебет и кредит","сумма записана по дебету, но не по кредиту","по кредиту записана сумма с лишним нулём","при подсчёте оборота пропущена одна запись"],a:0,
 e:"Три равенства ловят только арифметическое расхождение сторон. Если дебет и кредит перепутаны, итоги оборотов и сальдо по-прежнему равны — ведомость сойдётся, хотя остатки по счетам неверны. Поэтому сошедшаяся ведомость ещё не гарантирует, что ошибок нет.",
 s:"Лекция 2, слайд 54; практика 3, раздел 5"},

{b:3,t:"3d",k:"grid",q:"Заполни итоги оборотной ведомости из примера лекции.",tb:TB_VED,
 f:[["Итог оборотов по дебету",45000],["Итог конечных сальдо по дебету",110000],["Конечное сальдо расчётов с поставщиками",25000],["Итог конечных сальдо по кредиту",110000]],u:"руб.",
 e:"Обороты по дебету: 20 000 + 10 000 + 5 000 + 10 000 = 45 000 (по кредиту столько же).\nКонечные сальдо по дебету: основные средства 50 000 + материалы 40 000 + касса 1 000 + расчётные счета 19 000 = 110 000.\nПоставщики: 10 000 + 20 000 − 5 000 = 25 000 (кредитовое).\nПо кредиту: уставный капитал 60 000 + кредиты 25 000 + поставщики 25 000 = 110 000; счёт расчётов с персоналом закрылся.",
 s:"Лекция 2, слайд 53"},

{b:3,t:"3d",k:"order",q:"Расставь шаги сквозного примера «от проводок до баланса».",
 seq:["Открыть счета и перенести на них начальные сальдо из баланса","Составить проводки по хозяйственным операциям","Разнести проводки по счетам",
      "Подсчитать обороты и вывести конечные сальдо","Составить оборотную ведомость и проверить три равенства","Составить баланс на конец месяца"],
 e:"Баланс составляют последним: сначала ведомость, чтобы вовремя поймать ошибки разноски. Остатки активных счетов при открытии записывают по дебету, пассивных — по кредиту.",
 s:"Практика 3, раздел 2; лекция 2, слайд 51"},

{b:3,t:"3d",k:"num",q:"ООО «Ромашка»: на 1 октября по счёту 60 «Расчёты с поставщиками» кредитовое сальдо 40 000 руб. Операции октября — в таблице. Найди сальдо счёта 60 на 31 октября.",tb:TB_ROM_J,
 a:20000,u:"руб.",
 e:"Счёт 60 затронут трижды. Операция 2: поступили материалы — кредит 50 000. Операция 3: оплата поставщику — дебет 60 000. Операция 8: долг переоформлен в заём — дебет 10 000.\nСк = 40 000 + 50 000 − (60 000 + 10 000) = 20 000, сальдо кредитовое.",
 s:"Практика 3, таблицы 1–2"}
);
Q.push(
{b:4,t:"4a",k:"multi",q:"Какие признаки основного средства установлены ФСБУ 6/2020? Отметь все четыре.",
 o:["материально-вещественная форма","использование в обычной деятельности","срок использования более 12 месяцев","способность приносить экономические выгоды",
    "стоимость более 40 000 руб. за единицу","отсутствие намерения перепродать объект","государственная регистрация права"],a:[0,1,2,3],
 e:"Объект должен одновременно отвечать четырём признакам. Лимит 40 000 руб. и условие «не предполагается перепродажа» — из прежнего ПБУ 6/01. Государственная регистрация признаком не является: недвижимость принимают к учёту по факту ввода в эксплуатацию.",
 s:"Лекция 3, слайды 6 и 9"},

{b:4,t:"4a",k:"one",q:"Автосалон купил 10 автомобилей для продажи клиентам и ещё один — для разъездов менеджера. Как их учесть?",
 o:["10 — товары, 1 — основное средство","все 11 — основные средства","все 11 — товары в составе запасов","10 — основные средства, 1 — товар"],a:0,
 e:"Значение имеет предназначенность объекта, а не его вид. Автомобили для перепродажи — товар (запас). Автомобиль для служебных поездок используется в обычной деятельности дольше 12 месяцев — основное средство.",
 s:"Лекция 3, слайд 9"},

{b:4,t:"4a",k:"one",q:"В учётной политике установлен лимит стоимости основных средств 100 000 руб. Куплен принтер за 60 000 руб. со сроком службы 5 лет. Как его учесть?",
 o:["списать в расходы периода, наличие контролировать за балансом","учесть в составе запасов и списать при вводе в эксплуатацию","признать основным средством и амортизировать пять лет","держать на счёте 08, пока затраты не достигнут лимита"],a:0,
 e:"Активы дешевле лимита основными средствами не признаются: затраты на них списывают в расходы того периода, когда они понесены. Организация обязана контролировать их наличие и движение — например, на забалансовом счёте. Учёт «малоценки» в составе запасов — прежний порядок ПБУ 6/01.",
 s:"Лекция 3, слайды 6 и 10"},

{b:4,t:"4a",k:"one",q:"Почему большинство организаций устанавливают лимит стоимости основных средств именно 100 000 руб.?",
 o:["такова граница амортизируемого имущества в налоговом учёте","такой лимит прямо закреплён в тексте самого ФСБУ 6/2020","такой лимит перенесён в новый стандарт из прежнего ПБУ 6/01","такова граница существенности по Закону о бухгалтерском учёте"],a:0,
 e:"Стандарт суммы не называет: лимит организация определяет сама с учётом существенности и раскрывает в отчётности. 100 000 руб. — граница стоимости амортизируемого имущества в налоговом учёте (ст. 256 НК РФ); совпадение лимитов избавляет от разниц между бухгалтерским и налоговым учётом.",
 s:"Лекция 3, слайд 10"},

{b:4,t:"4a",k:"one",q:"Куплены станок с числовым программным управлением вместе с постоянной оснасткой и три отдельных стеллажа. Сколько инвентарных объектов принять к учёту?",
 o:["4","2","5","1"],a:0,
 e:"Станок с постоянной оснасткой — один инвентарный объект: объект со всеми приспособлениями и принадлежностями. Каждый стеллаж выполняет функцию самостоятельно — это три отдельных объекта. Итого 1 + 3 = 4.",
 s:"Лекция 3, слайд 11"},

{b:4,t:"4a",k:"one",q:"Здание будет служить 40 лет, а его лифты — 10 лет, и их стоимость существенна. Как учесть лифты по ФСБУ 6/2020?",
 o:["как самостоятельный инвентарный объект","в составе здания, с общим сроком 40 лет","в составе здания, со сроком 10 лет","как запасы — до первой плановой замены лифтов"],a:0,
 e:"Если стоимость и срок использования части существенно отличаются от стоимости и срока объекта в целом, часть признают самостоятельным инвентарным объектом. Цель компонентного подхода — амортизировать каждую часть в течение её собственного срока.",
 s:"Лекция 3, слайд 12"},

{b:4,t:"4a",k:"bucket",q:"Прежний порядок ПБУ 6/01 или действующий ФСБУ 6/2020?",
 c:[["ПБУ","ПБУ 6/01 — прежний порядок"],["ФСБУ","ФСБУ 6/2020 — действует"]],

{b:4,t:"4a",k:"multi",q:"Что организация выбирает именно для группы основных средств? Отметь всё.",
 o:["способ последующей оценки","способ начисления амортизации","периодичность переоценки","инвентарные номера объектов","первоначальную стоимость объектов","дату ввода в эксплуатацию"],a:[0,1,2],
 e:"Группа — совокупность объектов одного вида со сходным характером использования. Для группы выбирают способ последующей оценки (первоначальная или переоценённая стоимость), способ амортизации и периодичность переоценки. Номер, первоначальная стоимость и дата ввода — индивидуальные характеристики объекта.",
 s:"Лекция 3, слайд 13"},

{b:4,t:"4a",k:"tf",q:"Оцени каждое утверждение об инвестиционной недвижимости.",
 st:[["Инвестиционная недвижимость образует отдельную группу основных средств",1],
     ["Её можно оценивать по переоценённой стоимости и не начислять по ней амортизацию",1],

     ["Инвестиционная недвижимость предназначена только для получения дохода от прироста стоимости",0]],

 s:"Лекция 3, слайд 14"},

 c:[["Капвлож.","Капитальные вложения: входят в стоимость объекта"],["Расход","Расходы периода"],["Не затрата","Не затрата: дебиторская задолженность"]],
 it:[["Доставка, монтаж и пусконаладочные работы",0],["Проценты по кредиту на инвестиционный актив",0],["Оценочное обязательство по будущему демонтажу",0],
     ["Обучение персонала работе на новом оборудовании",1],["Реклама продукции новой линии",1],["Сверхнормативный расход материалов и потери от брака",1],

 e:"В стоимость объекта входят только затраты, без которых его нельзя создать и подготовить к использованию. Обучение, реклама, сверхнормативные потери и затраты до решения об инвестировании — расходы периода. Аванс затратой не является: это дебиторская задолженность, в стоимость вложений он попадёт после исполнения поставщиком обязательств.",
 s:"Лекция 3, слайды 19, 23–24"},

{b:4,t:"4b",k:"one",q:"Станок куплен в рассрочку на 3 года: сумма платежей по договору — 3 600 000 руб., при немедленной оплате он стоил бы 3 000 000 руб. (суммы без НДС). Как это отразить?",
 o:["стоимость 3 000 000 руб.; 600 000 руб. — расходы по займам","стоимость 3 600 000 руб.; разница отдельно не выделяется","стоимость 3 000 000 руб.; 600 000 руб. — прочие доходы","стоимость 3 600 000 руб.; 600 000 руб. — резерв расходов"],a:0,
 e:"При отсрочке или рассрочке более 12 месяцев в стоимость включают сумму, которую организация заплатила бы без рассрочки. Разницу с номинальной величиной платежей учитывают как расходы по займам и кредитам.",
 s:"Лекция 3, слайды 20 и 22"},

{b:4,t:"4b",k:"post",q:"Получен станок от поставщика: отражена его стоимость по договору без НДС и выделен НДС. Составь две проводки.",

 s:"Лекция 3, слайд 30, таблица 6"},

{b:4,t:"4b",k:"order",q:"Расставь шаги оформления поступившего основного средства.",
 seq:["Приём от поставщика по накладной или универсальному передаточному документу","Приказ руководителя о вводе объекта в эксплуатацию","Составление комиссией акта о приёме-передаче (ОС-1)",

{b:4,t:"4b",k:"post",q:"Организация безвозмездно получила оборудование. Отрази вложение по справедливой стоимости.",

 s:"Лекция 3, слайд 31, таблица 7"},

{b:4,t:"4b",k:"one",q:"Организация не имеет права на вычет НДС. Что произойдёт с налогом, предъявленным поставщиком станка?",

 s:"Лекция 3, слайды 19 и 30"},

{b:4,t:"4c",k:"post",q:"Станок продан. Отрази списание: первоначальной стоимости, накопленной амортизации и остаточной стоимости.",

 s:"Лекция 3, слайды 32 и 36, таблицы 7–8"},

{b:4,t:"4c",k:"post",q:"Станок продан покупателю. Отрази продажную стоимость с НДС и начисление НДС с продажи.",
 ln:[["62","91"],["91","68"]],pool:["19","62","68","90","91","99"],

 s:"Лекция 3, слайды 32 и 36"},

{b:4,t:"4c",k:"order",q:"Расставь шаги отражения выбытия основного средства в учёте.",
 seq:["Открыть к счёту 01 субсчёт «Выбытие основных средств»","Списать первоначальную стоимость и накопленную амортизацию","Отразить остаточную стоимость в расходах и доход от выбытия","Закрыть результат выбытия на счёт 99"],
 e:"Схема лекции: открыть субсчёт → списать стоимость → отразить остаток и доход → закрыть на 99. Результат выбытия — разница между доходом и суммой остаточной стоимости и расходов на выбытие; его признают в периоде списания объекта.",
 s:"Лекция 3, слайд 34"},

     ["Результат выбытия признают в том периоде, в котором объект списан",1]],

{b:4,t:"4c",k:"rows",q:"В какой строке записей по продаже станка допущена ошибка?",

    ["Начислен НДС с продажи","91","68"],["Определена прибыль от продажи","91.9","99"]],a:2,

{b:4,t:"4c",k:"one",q:"Руководство решило продать неиспользуемый цех в ближайшие 12 месяцев. Что делают с объектом в учёте до продажи?",

 e:"Если принято решение продать объект в ближайшие 12 месяцев, его переклассифицируют в долгосрочные активы к продаже и учитывают по отдельному стандарту. Списание через счёт 91 делают позже — в момент фактического выбытия.",
 s:"Лекция 3, слайд 37"}
);

{b:5,t:"5a",k:"one",q:"Объект признан в учёте 12 марта. С какого момента по ФСБУ 6/2020 начинают начислять амортизацию?",
 o:["с 12 марта; по решению организации — с 1 апреля","только с 1 апреля: иного стандарт не допускает","с 1 марта: за полный месяц признания объекта","с 1 января года, следующего за годом признания"],a:0,
 e:"Общее правило — с даты признания объекта в учёте. По решению организации, закреплённому в учётной политике, можно начинать с первого числа месяца, следующего за месяцем признания. «Только с 1-го числа следующего месяца» — прежний порядок ПБУ 6/01.",
 s:"Лекция 3, слайды 7 и 40"},

{b:5,t:"5a",k:"one",q:"Станок законсервирован на пять месяцев. Что происходит с амортизацией по ФСБУ 6/2020?",
 o:["начисляется: консервация её не приостанавливает","приостанавливается: консервация дольше трёх месяцев","приостанавливается до приказа о расконсервации","начисляется в половинном размере до расконсервации"],a:0,
 e:"Амортизация не приостанавливается ни при простое, ни при временном прекращении использования, ни при консервации. Единственное исключение — когда ликвидационная стоимость стала равной балансовой или превысила её. Правило о консервации более трёх месяцев — из ПБУ 6/01, оно уже не действует.",
 s:"Лекция 3, слайды 7 и 40"},

 e:"Не амортизируются: инвестиционная недвижимость, оцениваемая по переоценённой стоимости, земельные участки, объекты природопользования, музейные предметы и коллекции, законсервированные объекты для мобилизационной подготовки. Простой и обычная консервация начисление не останавливают.",

{b:5,t:"5a",k:"one",q:"По какому показателю ФСБУ 6/2020 запрещает определять амортизацию основного средства?",
 o:["по выручке от продукции, произведённой на объекте","по количеству продукции, произведённой объектом","по норме от оставшейся амортизируемой величины","по оставшемуся сроку полезного использования"],a:0,
 e:"Способы стандарта: линейный, уменьшаемого остатка, пропорционально количеству продукции (объёму работ). Определять амортизацию по величине выручки от продажи продукции, производимой на объекте, запрещено: выручка зависит от цен, а не от износа.",
 s:"Лекция 3, слайд 42"},

{b:5,t:"5a",k:"one",q:"В конце года выяснилось, что из-за интенсивной работы станок прослужит не восемь лет, а шесть. Как отразить пересмотр срока?",
 o:["как изменение оценочных значений, без пересчёта","пересчитать амортизацию за все прошлые отчётные периоды","оставить прежний срок до модернизации станка","списать всю разницу единовременно на счёт 84"],a:0,
 e:"Элементы амортизации — срок, ликвидационную стоимость и способ — проверяют в конце каждого отчётного года и при появлении признаков изменения. Корректировки не влекут пересчёта прошлых периодов: это изменение оценочных значений, его отражают в текущем и последующих периодах. По ПБУ 6/01 срок пересматривали только при модернизации и реконструкции.",
 s:"Лекция 3, слайды 8 и 41"},

{b:5,t:"5a",k:"post",q:"Собственный экскаватор работает на строительстве нового склада организации. Начислена его амортизация. Составь проводку.",
 ln:[["08","02"]],pool:["01","02","08","20","25","26"],

 a:"Активные счета отражают хозяйственные средства: сальдо дебетовое, увеличение по дебету, уменьшение по кредиту. Пассивные — источники средств: сальдо кредитовое, увеличение по кредиту. Активно-пассивные отражают и средства, и источники (расчёты, финансовые результаты) и могут иметь развёрнутое сальдо: дебетовое идёт в актив баланса, кредитовое — в пассив.",
 k:[["средства","средств","имуществ"],["источники","источник"],["дебетовое сальдо","дебет"],["кредитовое сальдо","кредит"],["развёрнутое сальдо","развернут"],["расчёты и результаты","расчет","результат"]],s:"Лекция 2, слайды 27–31; «Счета и двойная запись»"},
{b:3,q:"Что такое двойная запись, корреспонденция счетов и проводка? Какие бывают проводки?",
 a:"Двойная запись — отражение суммы операции одновременно по дебету одного счёта и по кредиту другого. Корреспонденция счетов — взаимосвязь двух счетов, возникшая в результате операции; её оформляют бухгалтерской записью — проводкой. Простая проводка затрагивает два счёта; в сложной один счёт дебетуется и несколько кредитуются или наоборот.",
 k:[["по дебету и кредиту","дебет","кредит"],["одновременно","одновременн"],["взаимосвязь счетов","взаимосвяз","корреспонденц"],["простая","прост"],["сложная","сложн"]],s:"Лекция 2, слайды 44, 49"},
{b:3,q:"Для чего нужна оборотная ведомость и какие три равенства в ней проверяют?",
 a:"Оборотную ведомость составляют до баланса, чтобы вовремя обнаружить ошибки. В ней три части: сальдо на начало, обороты, сальдо на конец. Равенства: итоги начальных сальдо по дебету и кредиту (равенство актива и пассива), итоги оборотов (двойная запись), итоги конечных сальдо (равенство баланса на конец месяца).",
 k:[["обнаружить ошибки","ошиб"],["сальдо на начало","начал"],["обороты","оборот"],["сальдо на конец","конец","конечн"],["двойная запись","двойн"],["равенство актива и пассива","актив","пассив"]],s:"Лекция 2, слайды 51–54"},
{b:3,q:"Как классифицируют счета по назначению и структуре?",
 a:"Основные — для учёта имущества и источников. Регулирующие — уточняют оценку основного счёта, делятся на контрарные (уменьшают оценку) и дополнительные. Операционные — распределительные и калькуляционные. Финансово-результатные (сопоставляющие) — выявляют результаты деятельности.",
 k:[["основные","основн"],["регулирующие","регулир"],["контрарные","контрарн"],["операционные","операцион"],["калькуляционные","калькуляц"],["финансово-результатные","результат"]],s:"Лекция 2, слайды 41–43"},

{b:4,q:"Назови четыре признака основного средства по ФСБУ 6/2020.",
 a:"Материально-вещественная форма; использование в обычной деятельности (производство, управление, предоставление за плату и т. д.); срок использования более 12 месяцев или обычного операционного цикла; способность приносить экономические выгоды. Организация вправе установить лимит стоимости, ниже которого активы основными средствами не признаются.",
 k:[["материально-вещественная форма","материальн","веществен"],["обычная деятельность","обычн"],["более 12 месяцев","12"],["экономические выгоды","выгод"],["лимит стоимости","лимит"]],s:"Лекция 3, слайды 9–10"},
{b:4,q:"Из чего складывается первоначальная стоимость основного средства и что в неё не входит?",
 a:"Первоначальная стоимость — сумма капитальных вложений до признания объекта: цена без возмещаемого НДС и с учётом скидок, доставка, монтаж, пусконаладка, проценты по инвестиционному активу, оценочное обязательство по демонтажу. Не входят: аванс (это дебиторская задолженность), текущий ремонт, обучение, реклама, управленческие расходы, сверхнормативные потери, затраты до решения о покупке.",
 k:[["капитальные вложения","капитальн","капвлож"],["без возмещаемого НДС","ндс"],["доставка и монтаж","доставк","монтаж"],["аванс не входит","аванс"],["обучение и реклама — расходы","обучен","реклам"]],s:"Лекция 3, слайды 17, 19, 23–24"},
{b:4,q:"Опиши проводки при покупке основного средства и при его продаже.",
 a:"Покупка: Д 08 К 60 — стоимость без НДС; Д 19 К 60 — НДС; Д 01 К 08 — ввод в эксплуатацию; Д 68 К 19 — вычет НДС. Продажа: Д 01 «Выбытие» К 01 — первоначальная стоимость; Д 02 К 01 «Выбытие» — амортизация; Д 91 К 01 «Выбытие» — остаточная стоимость; Д 62 К 91 — выручка с НДС; Д 91 К 68 — НДС; Д 91.9 К 99 — прибыль.",
 k:[["Д 08 К 60","08"],["Д 19 К 60","19"],["Д 01 К 08","01"],["списание амортизации Д 02","02"],["выручка на счёте 91","91"],["результат на 99","99"]],s:"Лекция 3, таблицы 6–8"},
{b:4,q:"Что изменилось в учёте основных средств с переходом от ПБУ 6/01 к ФСБУ 6/2020?",
 a:"Лимит устанавливает организация (раньше — не более 40 000 руб.); введены ликвидационная стоимость и амортизируемая величина; амортизация начинается с даты признания и не приостанавливается при консервации; исключён способ по сумме чисел лет; элементы амортизации проверяют ежегодно; введены проверка на обесценение, компонентный учёт и инвестиционная недвижимость.",
 k:[["лимит","лимит"],["ликвидационная стоимость","ликвидацион"],["с даты признания","дат","признан"],["консервация","консерв"],["сумма чисел лет исключена","чисел"],["обесценение","обесцен"]],s:"Лекция 3, слайды 6–8, таблица 1"},
{b:5,q:"Назови три элемента амортизации и способы её начисления.",
 a:"Элементы: срок полезного использования, ликвидационная стоимость, способ начисления амортизации. Способы: линейный, уменьшаемого остатка, пропорционально количеству продукции (объёму работ). Амортизируемая величина = балансовая стоимость − ликвидационная стоимость. Определять амортизацию по выручке запрещено.",
 k:[["срок полезного использования","срок"],["ликвидационная стоимость","ликвидацион"],["линейный","линейн"],["уменьшаемого остатка","уменьшаем"],["пропорционально объёму","пропорц","продукц"],["не по выручке","выручк"]],s:"Лекция 3, слайды 39, 42"},
{b:5,q:"Как учитывают текущий ремонт, существенный плановый ремонт и модернизацию?",
 a:"Текущий и неплановый ремонт, техобслуживание — расходы периода (Д 20, 25, 26, 44). Существенный плановый ремонт с периодичностью более 12 месяцев — самостоятельный инвентарный объект, амортизируется до следующего ремонта. Модернизация, реконструкция, достройка — капитальные вложения: увеличивают первоначальную стоимость, элементы амортизации пересматривают.",
 k:[["текущий ремонт — расходы периода","расход"],["более 12 месяцев","12"],["самостоятельный объект","самостоятельн","компонент"],["модернизация","модерниз"],["увеличивает стоимость","увелич","стоимост"]],s:"Лекция 3, слайды 47–48"},
{b:5,q:"Как арендатор учитывает аренду по ФСБУ 25/2018?",
 a:"Арендатор признаёт право пользования активом и обязательство по аренде. Обязательство оценивают по приведённой (дисконтированной) стоимости будущих платежей. Право пользования амортизируют, на обязательство начисляют проценты. Можно не признавать их при аренде до 12 месяцев, стоимости предмета до 300 000 руб. и при упрощённом учёте.",
 k:[["право пользования активом","право пользован"],["обязательство по аренде","обязательств"],["приведённая стоимость","приведен","дисконт"],["проценты","процент"],["амортизация","амортиз"],["исключения: 12 месяцев, 300 000","300","12"]],s:"Лекция 3, слайды 50–54"},
{b:5,q:"Как отражают дооценку и уценку основных средств?",
 a:"Дооценку отражают в совокупном финансовом результате без включения в прибыль, в добавочном капитале (счёт 83); исключение — часть, восстанавливающая прежнюю уценку: она идёт в доход. Уценку признают расходом, кроме части, уменьшающей ранее накопленную дооценку. Накопленную дооценку списывают на нераспределённую прибыль: Д 83 К 84.",
 k:[["добавочный капитал, счёт 83","83","добавочн"],["без включения в прибыль","без включ","мимо прибыл","не в прибыл"],["уценка — расход","расход"],["за счёт накопленной дооценки","накоплен"],["Д 83 К 84","84","нераспределен"]],s:"Лекция 3, слайды 55–59"},
{b:5,q:"Как отражают излишки и недостачи основных средств при инвентаризации?",
 a:"Излишки приходуют по справедливой стоимости: Д 01 К 91.1 — прочий доход. Недостачу списывают по остаточной стоимости на счёт 94. Затем на виновное лицо: Д 73 К 94 — в размере ущерба по рыночным ценам, не ниже балансовой; разница — Д 73 К 98. Если виновных нет: Д 91 К 94.",
 k:[["излишки по справедливой стоимости","справедлив"],["Д 01 К 91","91"],["счёт 94","94"],["на виновное лицо, счёт 73","73","виновн"],["рыночная цена","рыночн"],["разница на счёт 98","98"]],s:"Лекция 3, слайды 65–66"},

 k:[["нет вещественной формы","веществен"],["обычная деятельность","обычн"],["более 12 месяцев","12"],["выгоды","выгод"],["контроль","контрол","огранич"],["идентифицируемость","идентифиц","выдел"]],s:"Лекция 3, слайд 69"},
{b:6,q:"Что не признаётся нематериальным активом и почему?",
 a:"Знания и квалификация работников, затраты на подготовку персонала, созданная организацией клиентская база, реклама, расходы на образование юрлица — нет контроля: нельзя ограничить доступ других лиц. Средства индивидуализации, созданные своими силами (товарный знак, фирменное наименование), и гудвил, созданный своими силами. Результаты, созданные для продажи, — это запасы.",
 k:[["квалификация работников","квалификац","знани","персонал"],["нет контроля","контрол"],["клиентская база","клиентск"],["товарный знак своими силами","знак","своими силами","собственными силами"],["гудвил","гудвил","репутац"],["для продажи — запасы","запас","продаж"]],s:"Лекция 3, слайды 70–71"},
{b:6,q:"Как учитывают затраты на НИОКР?",
 a:"Затраты стадии исследований — расходы периода (Д 26). Затраты стадии разработок признают капитальными вложениями (Д 08) при шести условиях одновременно: осуществимо завершение, есть намерение завершить, намерение и возможность использовать, будущие выгоды, достаточные ресурсы, определена сумма затрат. По завершении: Д 04 К 08. Неклассифицируемые затраты — расходы.",
 k:[["исследования — расходы периода","исследован"],["разработки — капвложения","разработ"],["шесть условий","шест","6"],["счёт 08","08"],["Д 04 К 08","04"]],s:"Лекция 3, слайды 75–76"},
{b:6,q:"В чём особенности амортизации нематериальных активов?",
 a:"Срок определяют по сроку действия прав и ожидаемому использованию; он не может превышать срок действия прав. Объекты с неопределённым сроком не амортизируют и ежегодно проверяют. Ликвидационная стоимость, как правило, равна нулю. Способы те же, что у основных средств; по выручке — только если выгоды юридически обусловлены ею. Амортизацию копят на счёте 05.",
 k:[["срок действия прав","действия прав","срок"],["неопределённый срок — не амортизируют","неопределен"],["ликвидационная стоимость — ноль","ликвидацион","нул"],["способы как у основных средств","способ","линейн"],["счёт 05","05"]],s:"Лекция 3, слайды 83–86"}
);

 {type:"fm",r:[

  ["Первоначальная стоимость = цена без НДС + доставка + монтаж + …","сумма капитальных вложений до признания объекта"],

  ["Амортизируемая величина = балансовая − ликвидационная стоимость","к концу срока балансовая стоимость равна ликвидационной"],
  ["Линейный: (БС − ЛС) : оставшийся срок","равные суммы каждый период"],
  ["Уменьшаемого остатка: (БС на начало − ЛС) × норма","суммы убывают; в последний год остаток списывают полностью"],
  ["Пропорционально объёму: (БС − ЛС) × объём периода : оставшийся объём","по выручке считать нельзя"],
  ["После модернизации: (БС + затраты − ЛС) : (оставшийся срок + продление)","прошлую амортизацию не пересчитывают"],
  ["Результат продажи = цена с НДС − НДС − остаточная стоимость − расходы на выбытие","прибыль — Д 91.9 К 99, убыток — Д 99 К 91.9"],
  ["Аренда: PV = Σ платёж : (1 + r)ⁿ","проценты = остаток × r; остаток на конец = остаток + проценты − платёж"],
  ["Переоценка: k = справедливая : балансовая","первоначальную стоимость и амортизацию умножают на k; дооценка = справедливая − балансовая"],

  if(!db||!user){cloud.state="off";if(manual)toast("Синхронизация здесь недоступна");return}
  let st=manual?"granted":"prompt";
  if(perm){try{st=manual?((await perm.request(["db","user"]))||{}).db||"unavailable":await perm.state("db")}catch(e){}}
  if(st!=="granted"){cloud.state=st==="prompt"?"ask":"off";if(manual)toast("Синхронизация не подключена");if(view==="home")render();return}
  const uid=await user.id();if(!uid){cloud.state="off";if(manual)toast("Синхронизация здесь недоступна");if(view==="home")render();return}

  cloud.state="on";cloud.dirty=false;
  cloud.ref.onSnapshot(function(s){if(!s.exists||s.metadata.hasPendingWrites)return;const r=clone(s.data());if(r.rev===cloud.sent||r.rev===S.rev)return;S=mergeState(S,r);lsSet(KEY,JSON.stringify(S));if(view==="home")render()},function(){cloud.state="off";if(view==="home")render()});
  if(S.rev!==cloud.sent)cloudPush();

 }catch(e){cloud.state="off";if(manual)toast("Синхронизация не подключена");if(view==="home")try{render()}catch(e2){}}

function startSession(o){clearInterval(timerInt);pending=null;
 sess=Object.assign({idx:0,ans:{},inst:{},instant:true,finished:false},o);sess.items=sess.items.slice();
 sess.items.forEach(id=>{sess.inst[id]=makeInst(TASK[id])});saveSess();go("quiz")}
function startBlock(b,step){startSession({mode:"block",block:b,title:"Раздел "+BLOCKS[b].r,sub:BLOCKS[b].n,items:QB[b],step})}
function startTopic(t){startSession({mode:"topic",title:"Тема",sub:TOPICS[t],items:BANK.filter(id=>TASK[id].t===t)})}
function startTicket(n){startSession({mode:"ticket",ticket:n,title:"Билет "+(n+1),items:TICKETS[n]})}
function startMarathon(){startSession({mode:"marathon",title:"Марафон",items:shuffle(BANK)})}
function startKind(g,step){const G=GROUPS.find(x=>x[0]===g);startSession({mode:"kind",kind:g,title:G[1],items:shuffle(byKinds(G[2])),step})}
function startMistakes(step){const ids=errIds();if(!ids.length){if(step)markStep(step);toast(step?"Ошибок нет — шаг отмечен":"Ошибок нет");render();return}startSession({mode:"mistakes",title:"Мои ошибки",items:ids,step})}
function startCase(id,step){const c=CASE[id];startSession({mode:"case",cs:id,title:c.n,items:c.ids,step})}
function startExam(step){const items=[];for(let b=1;b<=NB;b++)shuffle(QB[b]).slice(0,PER).forEach(id=>items.push(id));
 startSession({mode:"exam",title:"Экзамен",items,instant:false,step,exam:{phase:"main",deadline:Date.now()+EXAM_MIN*60000,extra:[]}});startTimer()}
function resumeSession(){sess=pending;pending=null;view="quiz";if(sess.mode==="exam"){if(Date.now()>=sess.exam.deadline){examEnd(false,"Время вышло, пока попытка была закрыта.");return}startTimer()}render();toTop()}

const MAIN=NB*PER;
function curI(){return sess.inst[sess.items[sess.idx]]}
function curA(){const id=sess.items[sess.idx];return sess.ans[id]||(sess.ans[id]={v:emptyV(sess.inst[id]),done:false,act:0})}
function phaseRange(){if(sess.mode!=="exam")return[0,sess.items.length];return sess.exam.phase==="main"?[0,MAIN]:[MAIN,sess.items.length]}
function nextUnanswered(){const r=phaseRange(),lo=r[0],n=r[1]-lo;
 for(let k=1;k<=n;k++){const j=lo+((sess.idx-lo+k)%n);if(!(sess.ans[sess.items[j]]||{}).done){sess.idx=j;saveSess();render();toTop();return true}}return false}
function goNext(){if(nextUnanswered())return;if(sess.mode==="exam"){examCheck();return}finishSession()}
function move(d){const r=phaseRange(),j=sess.idx+d;if(j>=r[0]&&j<r[1]){sess.idx=j;saveSess();render();toTop()}}
function readFields(){const A=curA(),c=curI().t;if(A.done)return;if(c.k==="num"){const el=document.getElementById("f0");if(el)A.v=el.value}else if(c.k==="grid"){c.f.forEach((_,i)=>{const el=document.getElementById("f"+i);if(el)A.v[i]=el.value})}}
function commit(){if(!sess||sess.finished)return;const id=sess.items[sess.idx],I=sess.inst[id],A=curA();if(A.done)return;readFields();
 if(!complete(I,A.v)){toast({multi:"Отметь хотя бы один вариант",tf:"Оцени каждое утверждение",num:"Впиши ответ",grid:"Заполни все поля",post:I.t.tp?"Заполни дебет, кредит и выбери тип":"Заполни дебет и кредит во всех строках",match:"Подбери пару к каждой строке",bucket:"Отнеси каждую строку к группе",order:"Пронумеруй все строки",cloze:"Заполни все пропуски"}[I.t.k]||"Выбери ответ");return}
 A.g=grade(I,A.v);A.ok=A.g.ok;A.done=true;record(id,A.ok);saveSess();render();
 if(sess.instant){const fb=document.getElementById("fb");if(fb)try{fb.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}}
 else{const at=sess.idx;setTimeout(()=>{if(!sess||sess.finished||view!=="quiz")return;if(sess.mode==="exam"&&examCheck())return;if(sess.idx===at)nextUnanswered()},350)}}
function nextEmpty(arr,from){const n=arr.length;for(let k=1;k<=n;k++){const j=(from+k)%n;if(arr[j]==null)return j}return-1}

function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{
 if(!sess||sess.mode!=="exam"||sess.finished){clearInterval(timerInt);return}
 const left=sess.exam.deadline-Date.now();if(left<=0){examEnd(false,"Время вышло: экзамен не сдан.");return}
 const el=document.getElementById("timer");if(el){el.textContent=fmtT(left);el.classList.toggle("low",left<120000)}},500)}
function examCheck(){const s=sess,ex=s.exam,r=phaseRange();
 for(let i=r[0];i<r[1];i++)if(!(s.ans[s.items[i]]||{}).done)return false;
 if(ex.phase==="main"){const by={};s.items.slice(0,MAIN).forEach(id=>{if(!s.ans[id].ok){const b=TASK[id].b;by[b]=(by[b]||0)+1}});
  ex.by=by;const total=Object.keys(by).reduce((a,k)=>a+by[k],0);
  if(total===0)return examEnd(true,"Все "+MAIN+" заданий без ошибок.");
  if(Object.keys(by).some(k=>by[k]>=2))return examEnd(false,"Две ошибки в одном разделе: экзамен не сдан.");
  if(total>PASS_ERR)return examEnd(false,"Больше двух ошибок: экзамен не сдан.");
  const blocks=Object.keys(by).map(Number);
  blocks.forEach(b=>{shuffle(QB[b].filter(id=>!s.items.includes(id))).slice(0,EXTRA_N).forEach(id=>{s.items.push(id);s.inst[id]=makeInst(TASK[id])})});
  ex.phase="extra";ex.extra=blocks;ex.deadline+=blocks.length*EXTRA_MIN*60000;s.idx=MAIN;saveSess();render();toTop();return true}
 const bad=s.items.slice(MAIN).filter(id=>!s.ans[id].ok).length;
 return examEnd(bad===0,bad===0?"Ошибки основной части закрыты: дополнительные задания решены без ошибок.":"Ошибка в дополнительных заданиях: экзамен не сдан.")}
function examEnd(pass,reason){const s=sess;s.finished=true;s.exam.pass=pass;s.exam.reason=reason;clearInterval(timerInt);
 const errs=s.items.filter(id=>(s.ans[id]||{}).done&&!s.ans[id].ok).length;S.exams.push({t:Date.now(),pass,errs});if(S.exams.length>50)S.exams=S.exams.slice(-50);save();saveSess();go("result");return true}
function finishSession(){const s=sess;s.finished=true;clearInterval(timerInt);
 const done=s.items.filter(id=>(s.ans[id]||{}).done),wrong=done.filter(id=>!s.ans[id].ok),full=done.length===s.items.length,now=Date.now();
 if(full){
  if(s.mode==="ticket"){const t=S.tickets[s.ticket];S.tickets[s.ticket]={best:t?Math.min(t.best,wrong.length):wrong.length,last:wrong.length,t:now}}
  if(s.mode==="case"){const t=S.cases[s.cs];S.cases[s.cs]={best:t?Math.min(t.best,wrong.length):wrong.length,last:wrong.length,t:now}}
  if(s.step)S.plan[s.step]={v:1,t:now};
  if(s.mode==="block")PLAN.forEach(d=>d.steps.forEach(st=>{if(st.a.m==="block"&&st.a.b===s.block)S.plan[st.id]={v:1,t:now}}));
  if(s.mode==="case")PLAN.forEach(d=>d.steps.forEach(st=>{if(st.a.m==="case"&&st.a.c===s.cs)S.plan[st.id]={v:1,t:now}}));
