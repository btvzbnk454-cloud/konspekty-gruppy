 else{if(cs.text.trim())h+=`<p class="ref mine">${T(cs.text)}</p>`;
  h+=`<div class="ktags">${ks.map(k=>`<span class="ktag${cs.text.trim()&&k.hit?" hit":""}">${esc(k.label)}</span>`).join("")}</div>`;
  if(cs.text.trim())h+=`<p class="cap" style="margin-top:8px">Ключевых мыслей раскрыто: ${hits} из ${ks.length}. ${hits===ks.length?"Отлично.":hits/ks.length>=.6?"Почти: добавь недостающее.":"Перечитай эталон."}</p>`;
  h+=`<div class="ref"><p class="cap">Эталон</p><p>${T(c.a)}</p><p class="fb-s">Источник: ${T(c.s)}</p></div><div class="acts"><div class="r" style="margin-left:0"><button class="btn main" data-act="cknow">Знаю</button><button class="btn" data-act="cagain">Повторить позже</button></div></div>`}
 app.innerHTML=h+`</div>`;
 const ta=document.getElementById("card-in");if(ta)ta.addEventListener("input",()=>{cs.text=ta.value});
}

function renderCheat(){
 const a=t=>`<span class="a">${t}</span>`;
 let h=`<div class="sheet"><div class="bar"><button class="btn sm quiet" data-act="home">Меню</button><div class="bar-t">Шпаргалка</div><div class="bar-r"><button class="btn sm${cheat.hide?" main":""}" data-act="chide" aria-pressed="${cheat.hide}">${cheat.hide?"Открыть ответы":"Закрыть ответы"}</button></div></div>
 <div class="cnav">${CHEAT.map(s=>`<button class="btn sm" data-act="cnav" data-s="${s.id}">${esc(s.t)}</button>`).join("")}</div>
 ${cheat.hide?`<p class="cap" style="margin-top:10px">Ответы размыты: сначала вспомни, потом нажми на размытый текст.</p>`:""}<div class="${cheat.hide?"hide":""}">`;
 CHEAT.forEach(s=>{h+=`<section class="cs" id="cs-${s.id}"><h2>${esc(s.t)}</h2><p class="cap">${T(s.lead)}</p>`;
  s.items.forEach(it=>{
   if(it.type==="tbl")h+=`<div class="tbl-w"><table class="tbl">${it.cap?`<caption>${T(it.cap)}</caption>`:""}<thead><tr>${it.h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${it.r.map(r=>`<tr>${r.map((x,j)=>`<td>${(it.ans||[]).includes(j)?a(T(x)):T(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
   else if(it.type==="fm")h+=`<div class="fms">${it.r.map(r=>`<div class="fm"><span class="fx">${a(T(r[0]))}</span><span class="fn">${T(r[1])}</span></div>`).join("")}</div>`;
   else if(it.type==="pairs")h+=`<div class="prs">${it.r.map(row=>`<div class="pr">${row.map(p=>`<div><b>${T(p[0])}</b>${a(T(p[1]))}</div>`).join("")}</div>`).join("")}</div>`;
   else if(it.type==="li")h+=`<div class="lis">${it.r.map(r=>`<div class="li"><b>${T(r[0])}</b>${s.id==="note"?`<span>${T(r[1])}</span>`:a(T(r[1]))}</div>`).join("")}</div>`;
   else if(it.type==="note")h+=`<p class="cnote">${T(it.tx)}</p>`});
  h+=`</section>`});
 app.innerHTML=h+`</div></div>`;
}

function act(a,el){
 const A=sess&&view==="quiz"?curA():null,I=A?curI():null,c=I?I.t:null,free=A&&!A.done&&!sess.finished;
 switch(a){
  case"continue":{const d=PLAN.find(d=>!d.steps.every(stepDone));if(!d){startExam();break}runStep(d.steps.find(s=>!stepDone(s)).id);break}
  case"exam":startExam();break;
  case"marathon":startMarathon();break;
  case"mistakes":startMistakes();break;
  case"cards":startCards("all");break;
  case"cheat":cheat={hide:false};go("cheat");break;
  case"last":if(sess&&sess.finished)go("result");break;
  case"resume":resumeSession();break;
  case"drop":pending=null;lsDel(SKEY);render();break;
  case"day":planDay=+el.dataset.d;render();break;
  case"step":runStep(el.dataset.step);break;
  case"tick":{const id=el.dataset.step;markStep(id,stepDone(STEP[id])?0:1);render();break}
  case"scroll-tickets":{const t=document.getElementById("tickets");if(t)t.scrollIntoView({behavior:"smooth",block:"start"});break}
  case"ticket":startTicket(+el.dataset.n);break;
  case"block":startBlock(+el.dataset.b);break;
  case"topic":startTopic(el.dataset.t);break;
  case"kind":startKind(el.dataset.g);break;
  case"case":startCase(el.dataset.c);break;
  case"sync":cloudInit(true);break;
  case"reset":confirmReset=true;render();break;
  case"reset-no":confirmReset=false;render();break;
  case"reset-yes":{const t=Date.now();S=blank();S.resetAt=t;save();confirmReset=false;sess=null;pending=null;lsDel(SKEY);prevBeads=null;render();toast("Прогресс сброшен");break}
  case"home":clearInterval(timerInt);if(sess&&!sess.finished&&view==="quiz"){readFields();saveSess();if(sess.mode==="exam")toast("Экзамен не на паузе: время идёт");pending=sess;sess=null}
   confirmReset=false;planDay=null;go("home");break;
  case"finish":finishSession();break;
  case"prev":move(-1);break;
  case"next":goNext();break;
  case"skip":readFields();if(!nextUnanswered())move(1);break;
  case"goto":readFields();sess.idx=+el.dataset.i;saveSess();render();toTop();break;
  case"commit":commit();break;
  case"opt":if(!free)break;{const o=+el.dataset.o;if(c.k==="multi"){const i=A.v.indexOf(o);if(i>=0)A.v.splice(i,1);else A.v.push(o);saveSess();render()}else{A.v=o;commit()}}break;
  case"row":if(!free)break;A.v=+el.dataset.r;commit();break;
  case"tf":if(!free)break;A.v[+el.dataset.i]=+el.dataset.v;saveSess();render();break;
  case"bk":if(!free)break;A.v[+el.dataset.i]=+el.dataset.k;saveSess();render();break;
  case"tp":if(!free)break;A.v.tp=+el.dataset.n;saveSess();render();break;
  case"sign":{const inp=document.getElementById("f"+el.dataset.i);if(inp){inp.value=/^\s*[-−]/.test(inp.value)?inp.value.replace(/^\s*[-−]\s*/,""):"−"+inp.value;inp.dispatchEvent(new Event("input"));inp.focus()}break}
  case"slot":if(!free)break;{const n=+el.dataset.s,l=n>>1,sd=n&1;if(A.v.ln[l][sd]){A.v.ln[l][sd]=null}A.act=n;saveSess();render()}break;
  case"acc":if(!free)break;{const flat=[];A.v.ln.forEach(l=>{flat.push(l[0],l[1])});let n=A.act;if(n==null||n<0||flat[n]!=null)n=nextEmpty(flat,-1);if(n<0)n=flat.length-1;
   A.v.ln[n>>1][n&1]=el.dataset.a;flat[n]=el.dataset.a;A.act=nextEmpty(flat,n);saveSess();render()}break;
  case"ms":if(!free)break;{const i=+el.dataset.i;A.act=A.act===i?-1:i;saveSess();render()}break;
  case"mr":if(!free)break;{const r=+el.dataset.r;let i=A.act;const was=A.v.indexOf(r);if(was>=0)A.v[was]=null;if(i==null||i<0)i=nextEmpty(A.v,-1);if(i<0)break;A.v[i]=r;A.act=nextEmpty(A.v,i);saveSess();render()}break;
  case"od":if(!free)break;{const i=+el.dataset.i,p=A.v.indexOf(i);if(p>=0)A.v.splice(p,1);else A.v.push(i);saveSess();render()}break;
  case"gp":if(!free)break;{const i=+el.dataset.i;if(A.v[i]!=null)A.v[i]=null;A.act=i;saveSess();render()}break;
  case"bw":if(!free)break;{const b=+el.dataset.b;let i=A.act;if(i==null||i<0||A.v[i]!=null)i=nextEmpty(A.v,-1);if(i<0)break;A.v[i]=b;A.act=nextEmpty(A.v,i);saveSess();render()}break;
  case"fix":{const s=sess,w=s.items.filter(id=>(s.ans[id]||{}).done&&!s.ans[id].ok);startSession({mode:"retry",title:"Работа над ошибками",items:w});break}
  case"again":{const s=sess;if(s.mode==="exam")startExam(s.step);else if(s.mode==="ticket")startTicket(s.ticket);else if(s.mode==="marathon")startMarathon();else if(s.mode==="mistakes")startMistakes();
   else if(s.mode==="case")startCase(s.cs,s.step);else if(s.mode==="kind")startKind(s.kind,s.step);else if(s.mode==="block")startBlock(s.block,s.step);else startSession({mode:s.mode,title:s.title,sub:s.sub,items:s.items})}break;
  case"cfilter":startCards(el.dataset.f);break;
  case"ccheck":{const ta=document.getElementById("card-in");cs.text=ta?ta.value:cs.text;if(!cs.text.trim()){toast("Сначала напиши хотя бы пару слов или нажми «показать ответ»");break}cs.stage="shown";render();break}
  case"creveal":{const ta=document.getElementById("card-in");cs.text=ta?ta.value:cs.text;cs.stage="shown";render();break}
  case"cknow":case"cagain":{const id=cs.queue[cs.pos],r=S.cards[id]||(S.cards[id]={box:0});if(a==="cknow"){r.box=Math.min(3,(r.box||0)+1);cs.known++}else{r.box=0;if(!cs.again[id]){cs.again[id]=1;cs.queue.push(id)}}
   r.t=Date.now();save();cs.pos++;cs.stage="ask";cs.text="";render();toTop();break}
  case"chide":cheat.hide=!cheat.hide;render();break;
  case"cnav":{const t=document.getElementById("cs-"+el.dataset.s);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});break}
 }}
app.addEventListener("click",e=>{
 const an=e.target.closest(".hide .a");if(an){an.classList.toggle("shown");return}
 const el=e.target.closest("[data-act]");if(!el||el.disabled)return;act(el.dataset.act,el)});
document.addEventListener("keydown",e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const tg=e.target,inField=tg&&tg.closest&&tg.closest("textarea,input");
 if(view!=="quiz"||!sess||sess.finished)return;
 const A=curA(),c=curI().t;
 if(e.key==="Enter"){
  if(tg&&tg.closest&&tg.closest("tr.pick-tr")){act("row",tg.closest("tr.pick-tr"));e.preventDefault();return}
  if(tg&&tg.closest&&tg.closest("button")&&!inField)return;
  if(!A.done){if(c.k!=="one"&&c.k!=="rows")commit()}else if(sess.instant)goNext();e.preventDefault();return}
 if(inField)return;
 if(/^[1-9]$/.test(e.key)&&(c.k==="one"||c.k==="multi")&&!A.done){const p=+e.key-1,I=curI();if(p<c.o.length){const b=app.querySelector('[data-act="opt"][data-o="'+I.perm[p]+'"]');if(b)act("opt",b);e.preventDefault()}}
 else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&cloud.dirty)cloudFlush()});
render();
cloudInit(false);
})();
</script>
