<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр по управлению качеством</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=Literata:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0F3; --sheet:#FFFFFF; --sunk:#F4F6F8;
  --ink:#11151B; --ink-2:#55606E; --ink-3:#7C8794;
  --line:#D5DAE1; --line-2:#B7BFCA;
  --tape:#FFC62B; --tape-hi:#FFD45C; --tape-ink:#1B1500; --tape-soft:#FFF3CC; --tape-edge:#B98600;
  --ok:#17804A; --ok-soft:#E2F3E9; --bad:#C3362B; --bad-soft:#FBE7E4;
  --focus:#1F5AE0; --shade:rgba(10,14,20,.18);
  --f-display:'Fira Sans Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --f-body:'Golos Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-math:'Literata','PT Serif',Georgia,'Times New Roman',serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --sheet:#181C22; --sunk:#12161B;
    --ink:#ECEFF3; --ink-2:#A6B0BD; --ink-3:#7B8693;
    --line:#2A313B; --line-2:#434D5A;
    --tape:#FFC62B; --tape-hi:#FFD45C; --tape-ink:#1B1500; --tape-soft:#3A2F08; --tape-edge:#FFD45C;
    --ok:#4FC98A; --ok-soft:#10301F; --bad:#F47F73; --bad-soft:#3B1915;
    --focus:#8FB0FF; --shade:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216; --sheet:#181C22; --sunk:#12161B;
  --ink:#ECEFF3; --ink-2:#A6B0BD; --ink-3:#7B8693;
  --line:#2A313B; --line-2:#434D5A;
  --tape:#FFC62B; --tape-hi:#FFD45C; --tape-ink:#1B1500; --tape-soft:#3A2F08; --tape-edge:#FFD45C;
  --ok:#4FC98A; --ok-soft:#10301F; --bad:#F47F73; --bad-soft:#3B1915;
  --focus:#8FB0FF; --shade:rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:752px;margin-inline:auto;padding-inline:16px;padding-block:20px 28px}
.f{font-family:var(--f-math);font-size:1.04em}
.fn{white-space:nowrap}
.f sub,.f sup,.prose sub,.prose sup{font-size:.72em;line-height:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.eyebrow{font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
h1{font:700 clamp(40px,10.5vw,60px)/.94 var(--f-display);letter-spacing:-.005em;margin:8px 0 0;text-wrap:balance}
.lead{font-size:17px;line-height:1.5;color:var(--ink-2);max-width:60ch;margin:14px 0 0}
.sec-h{font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:32px 0 8px}
.note{font-size:14px;color:var(--ink-2);margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--sheet);color:var(--ink);font:600 17px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;transition:transform .08s,background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:var(--tape);border-color:var(--tape-ink);color:var(--tape-ink)}
.btn.pri:hover:not(:disabled){background:var(--tape-hi);border-color:var(--tape-ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:0 12px}
.btn.ghost:hover:not(:disabled){border-color:var(--line-2)}
.btn .cnt{font-variant-numeric:tabular-nums;opacity:.75}
.ibtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line-2);border-radius:8px;background:var(--sheet);color:var(--ink)}
.ibtn:hover{border-color:var(--ink-2)}
.seg{display:inline-flex;border:1.5px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:42px;font:500 15px/1.2 var(--f-body);color:var(--ink-2)}
.seg button + button{border-left:1.5px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg .cnt{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}

.ruler{position:relative;height:32px;border-radius:5px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden;flex:1 1 auto;min-width:0}
.ruler .tape{position:absolute;inset:0 auto 0 0;width:0;background:var(--tape);box-shadow:inset 0 0 0 1px var(--tape-edge);border-radius:5px 0 0 5px;transition:width .35s ease}
.ruler .tape.full{border-radius:5px}
.ruler .tks{position:absolute;inset:0;display:flex}
.ruler i{flex:1 1 0;min-width:0;position:relative}
.ruler i::before{content:"";position:absolute;right:0;bottom:0;width:1px;height:7px;background:var(--line-2)}
.ruler i.m5::before{height:11px}
.ruler i.m10::before{height:17px;background:var(--ink-3)}
.ruler.dense i:not(.m5):not(.m10)::before{display:none}
.ruler i b{position:absolute;right:4px;top:4px;font:600 11px/1 var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.ruler i.d::before,.ruler i.d.m10::before{background:var(--tape-ink)}
.ruler i.d b{color:var(--tape-ink)}
.ruler i.x::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--bad)}
.ruler-cap{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--ink-2);margin-top:6px}
.ruler-cap span:last-child{white-space:nowrap}

.mast{padding:6px 0 0}
.home-ruler{margin-top:24px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px;display:grid;gap:16px}
@media(min-width:600px){.panel{padding:22px 24px}}
.setup{display:grid;gap:10px}
.setup-row{display:grid;grid-template-columns:5.6em 1fr;gap:6px 14px;align-items:center;justify-items:start}
.setup-row > .lbl{font:600 12.5px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
@media(max-width:480px){.setup-row{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .btn.pri{flex:1 1 240px}
.panel-h{font:600 20px/1.2 var(--f-body);margin:0}
.panel p{margin:0}
.hist{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl{border-top:1px solid var(--line-2)}
.tl details{border-bottom:1px solid var(--line)}
.tl summary{display:grid;grid-template-columns:2em 1fr auto;gap:10px;align-items:baseline;padding:12px 2px;cursor:pointer;list-style:none}
.tl summary::-webkit-details-marker{display:none}
.tl summary:hover .ti{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.tl .no{font:600 16px/1 var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl .ti{min-width:0}
.tl .sc{font:600 14px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
.tl .sc.full{color:var(--ok)}
.tl .sc.miss{color:var(--bad)}
.tl .tb{padding:0 2px 16px 2em}
@media(max-width:560px){.tl .tb{padding-left:2px}}
.sync{margin:22px 0 0;font-size:13.5px;color:var(--ink-2)}

.quiz{display:flex;flex-direction:column;min-height:calc(100dvh - 48px)}
.quiz .grow{flex:1 1 auto}
@media(min-width:720px) and (min-height:760px){.quiz{min-height:0}.quiz .grow{display:none}}
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 0 10px;background:var(--bg)}
.qcount{flex:none;min-width:3.4em;text-align:right;font:600 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.qcount small{font-size:13px;color:var(--ink-2);font-weight:500}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 16px 18px}
@media(min-width:600px){.qcard{padding:28px 30px 26px}}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.qtopic{font:600 13px/1.3 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.qsrc{font:500 12px/1.3 var(--f-body);color:var(--ink-2);border:1px dashed var(--line-2);border-radius:999px;padding:2px 9px}
.qtext{font:600 20px/1.32 var(--f-body);margin:0}
@media(min-width:600px){.qtext{font-size:22px}}
.qnote{margin:10px 0 0;font-size:16.5px;line-height:1.5}
.qhint{margin:8px 0 16px;font-size:14px;color:var(--ink-2)}
.act{position:sticky;bottom:0;z-index:4;margin-top:6px;padding:14px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.act .btn{width:100%}
@media(min-width:720px){.act .btn{width:auto;min-width:240px}}

.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:var(--r);background:var(--sheet);line-height:1.4;transition:border-color .12s,background .12s}
.opt-k{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);font:600 14px/1 var(--f-display);color:var(--ink-2)}
.opt-t{flex:1 1 auto;min-width:0;padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt.on{border-color:var(--ink);background:var(--tape-soft)}
.opt.on .opt-k{background:var(--tape);color:var(--tape-ink);box-shadow:inset 0 0 0 1px var(--tape-ink)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .opt-k,.opt.missed .opt-k{background:var(--ok);color:var(--sheet);box-shadow:none}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:var(--sheet);box-shadow:none}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt-tag{flex:none;align-self:center;font:600 12px/1.2 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ok)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;align-items:center;padding:16px 10px;font-weight:600}
.tf .opt-t{flex:0 1 auto;padding:0}

.g{display:grid;gap:10px}
.g-row{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;background:var(--sheet)}
.g-t{line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:6px 12px;border:1.5px solid var(--line-2);border-radius:999px;background:var(--sheet);font:500 14.5px/1.2 var(--f-body);color:var(--ink);transition:border-color .12s,background .12s}
.chip:hover:not(:disabled){border-color:var(--ink-2)}
.chip.on{background:var(--tape);border-color:var(--tape-ink);color:var(--tape-ink)}
.chip:disabled{cursor:default;opacity:1;color:var(--ink-2)}
.chip.on:disabled{color:var(--tape-ink)}
.chip.good:disabled{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.chip.badc:disabled{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.chip.need:disabled{border-color:var(--ok);border-style:dashed;color:var(--ok);font-weight:600}
.g-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.g-row.no{border-color:var(--bad);background:var(--bad-soft)}
select.sel{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--sheet);color:var(--ink)}
select.sel:disabled{opacity:1;color:var(--ink)}
.g-fix{font-size:14.5px}
.g-fix b{color:var(--ok)}

.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord li{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 2px;border:1.5px solid var(--line-2);border-radius:var(--r);background:var(--sheet)}
.ord .grip{flex:none;width:34px;height:44px;display:grid;place-items:center;color:var(--ink-3);cursor:grab;touch-action:none;border:0;background:none;border-radius:6px}
.ord .n{flex:none;width:22px;text-align:center;font:600 15px/1 var(--f-display);color:var(--ink-2);font-variant-numeric:tabular-nums}
.ord .t{flex:1 1 auto;min-width:0;line-height:1.35;padding:4px 0}
.ord .mv{flex:none;display:flex;gap:4px}
.ord .mv button{width:38px;height:38px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--sheet);display:grid;place-items:center;color:var(--ink)}
.ord .mv button:disabled{opacity:.3;cursor:default}
.ord li.drag{border-color:var(--ink);background:var(--tape-soft);position:relative;z-index:2;box-shadow:0 8px 18px var(--shade)}
.ord li.drag .grip{cursor:grabbing}
.ord li.ok{border-color:var(--ok);background:var(--ok-soft)}
.ord li.no{border-color:var(--bad);background:var(--bad-soft)}
.ord.locked .grip,.ord.locked .mv{display:none}
.ord.locked li{padding-left:12px}
@media(max-width:520px){
  .ord li{padding:4px 6px 4px 0;gap:4px}
  .ord .grip{width:30px}
  .ord .n{width:18px}
  .ord .mv{flex-direction:column;gap:3px}
  .ord .mv button{width:36px;height:30px}
}
.ord-key{margin:14px 0 0}
.ord-key p{margin:0 0 6px;font-weight:600}
.ord-key ol{margin:0;padding-left:1.5em}
.ord-key li{margin:3px 0}

.bk-text{font-size:17.5px;line-height:2.3;margin:0}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:5.5em;min-height:34px;padding:1px 10px;margin:0 2px;border:1.5px dashed var(--line-2);border-radius:8px;background:var(--sunk);vertical-align:middle;font:500 16px/1.25 var(--f-body);color:var(--ink)}
.slot.cur{border-color:var(--ink);border-style:solid}
.slot.full{border-style:solid;border-color:var(--tape-ink);background:var(--tape);color:var(--tape-ink)}
.slot:disabled{cursor:default;opacity:1}
.slot.ok:disabled{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.slot.no:disabled{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--ink);text-decoration:line-through}
.slot-fix{color:var(--ok);font-weight:600;margin:0 4px 0 2px}
.bk-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-2)}
.bk-bank .chip{border-radius:8px;font-size:15.5px;min-height:42px}
.bk-bank .chip.used{opacity:.25}

.inrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inp{width:100%;max-width:22em;min-height:48px;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:var(--r);background:var(--sheet);font-size:18px}
.inp.num{max-width:9em;font-variant-numeric:tabular-nums}
.inp.ok{border-color:var(--ok);background:var(--ok-soft)}
.inp.no{border-color:var(--bad);background:var(--bad-soft)}
.inp:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.unit{color:var(--ink-2)}
.right-val{font-weight:600;color:var(--ok)}

.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font:600 12.5px/1.3 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--sunk)}
thead th .f{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody th{font-weight:500}
td.nm{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:480px){th,td{padding:8px}table{font-size:14.5px}thead th{font-size:11.5px}}
th.nm{text-align:right}
.parts{display:grid;gap:14px}
.part{display:grid;gap:6px}
.plabel{font-weight:500}
@media(min-width:600px){.part.pn{grid-template-columns:1fr auto;align-items:center;gap:14px}.part.pn .inrow{justify-content:flex-end}}

.val{display:grid;gap:12px}
.val svg{width:100%;max-width:440px;height:auto;display:block;margin-inline:auto}
.val-ctl{display:grid;gap:4px}
.val-ctl label{font-weight:500}
.val-ctl input[type=range]{width:100%;height:36px;accent-color:var(--tape-edge)}
.val-out{font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.val-leg{font-size:14px;color:var(--ink-2)}
.sv-ink{fill:var(--ink)} .sv-ink2{fill:var(--ink-2)} .sv-cost{fill:var(--line-2)} .sv-profit{fill:var(--tape)} .sv-max{fill:var(--sunk);stroke:var(--ink-2);stroke-width:1.5}
.sv-line{stroke:var(--ink);stroke-width:1.5;fill:none} .sv-dash{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3;fill:none} .sv-base{stroke:var(--ink-2);stroke-width:1.5}
.sv-t{font:600 14px var(--f-display);letter-spacing:.04em} .sv-s{font:400 12px var(--f-body)} .sv-k{font:500 17px var(--f-math)}
.sv-tapeink{fill:var(--tape-ink)}

.fb{margin-top:18px;border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;scroll-margin:76px 0 96px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:700 18px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-n{font:500 14px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.fb-t{margin:0;line-height:1.5}
details.cheat{border-top:1px solid var(--line-2);padding-top:4px;margin-top:2px}
details.cheat > summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none;padding:8px 0;font-size:15px}
details.cheat > summary::-webkit-details-marker{display:none}
.cheat-k{flex:none;font:600 12.5px/1.2 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.cheat-k::before{content:"▸";display:inline-block;width:1em}
details[open] > summary .cheat-k::before{content:"▾"}
.cheat-t{min-width:0}
.prose{font-size:15.5px;line-height:1.55;min-width:0}
.prose p{margin:.6em 0}
.prose ul,.prose ol{margin:.5em 0;padding-left:1.3em}
.prose li{margin:.25em 0}
.prose .fm{font-family:var(--f-math);font-size:1.04em;padding-left:1em}
.prose .key{font-weight:500}
.prose .tw{margin:.8em 0}
.prose table{font-size:14px;min-width:520px}

.score{display:flex;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin-top:8px}
.score .big{font:700 clamp(64px,19vw,104px)/.86 var(--f-display);font-variant-numeric:tabular-nums}
.score .of{font:600 26px/1 var(--f-display);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lvl{margin:12px 0 0;color:var(--ink-2)}
.res-ruler{margin-top:22px}
.res-actions{margin-top:22px}
.segs{display:inline-flex;gap:3px;vertical-align:middle}

const CHEAT = {"titles":["Понятие качества продукции. Последовательность оценки уровня качества объекта.","Понятие конкурентоспособности товара. Конкуренция. Виды конкуренции.","Потребительская ценность товара, ее связь с конкурентоспособностью.","Виды измерений. Измерительные шкалы.","Основные принципы квалиметрии.","Шкала порядка и шкала интервалов. Принцип построения, преимущества и недостатки.","Шкала отношений. Принцип построения. Сходство и отличия от шкалы интервалов.","Федеральный закон «Об обеспечении единства измерений».","Методы количественной оценки показателей качества объекта.","Классификация показателей качества.","Номенклатура показателей качества.","Дифференциальный метод оценки качества изделия.","Понятие «базовый образец». Определение группы аналогов и выбор базового образца.","Комплексный метод оценки качества объекта.","Весовые коэффициенты: назначение, способы определения.","Интегральный метод оценки качества изделия.","Смешанный метод оценки качества объекта.","Экономико-статистический метод оценки качества изделия.","Экспертные методы оценки качества.","Федеральный закон «О техническом регулировании». Система технического регулирования в РФ.","Понятия «технический регламент» и «стандарт», их виды.","Понятие «цена потребления». В каком методе оценки уровня качества используется?","Понятие «услуга». Материальные и нематериальные услуги.","Номенклатура показателей качества услуг."],"sections":["<p><strong>Качество<\/strong> – совокупность характеристик объекта, относящихся к его способности удовлетворять установленные и предполагаемые потребности; степень соответствия совокупности присущих характеристик объекта требованиям (ГОСТ Р ИСО 9000-2015).<\/p><p><strong>Качество продукции/услуги<\/strong> – совокупность свойств и характеристик продукции (услуги), которые придают ей способность удовлетворять обусловленные или предполагаемые потребности (ИСО 8402-86).<\/p><p><strong>Последовательность оценки уровня качества:<\/strong><\/p><ol><li><strong>Цель оценки<\/strong> уровня качества продукции. Основные задачи: обеспечение и управление качеством; аттестация продукции; выбор наилучшего варианта продукции; планирование показателей качества; контроль качества; анализ изменения уровня качества.<\/li><li><strong>Классификация и выбор номенклатуры показателей качества<\/strong> – решаем, какие свойства продукции будем оценивать (ГОСТ 22851-77).<\/li><li><strong>Выбор базовых образцов и определение базовых показателей качества<\/strong> – выбираем лучший аналог, с которым будем сравнивать (РД 50-451-84). Шаги 2 и 3 выполняются параллельно.<\/li><li><strong>Выбор методов и определение значений показателей качества<\/strong> – измеряем или рассчитываем значения показателей у объекта и у базового образца (РД 50-149-79).<\/li><li><strong>Выбор и обоснование метода оценки уровня качества<\/strong> – дифференциальный, комплексный, смешанный, интегральный и др. (РД 50-149-79).<\/li><li><strong>Оценка уровня качества<\/strong> – сравниваем объект с базовым образцом, получаем У<sub>К<\/sub>.<\/li><li><strong>Выработка рекомендаций.<\/strong><\/li><li><strong>Принятие управленческих решений.<\/strong><\/li><\/ol>","<p><strong>Конкурентоспособность товара<\/strong> – способность продукции быть привлекательной по сравнению с другими изделиями аналогичного вида и назначения благодаря лучшему соответствию своих характеристик требованиям данного рынка и потребительским оценкам; способность товара быть реализованным на определённом рынке в определённый момент времени.<\/p><p><strong>Конкуренция<\/strong> – элемент рыночного механизма, реализующийся в форме взаимодействия рыночных субъектов и борьбы между ними за наиболее выгодные условия приложения капитала (за максимально эффективное использование факторов производства при единых для всех правилах). Основной механизм формирования хозяйственных отношений в условиях рынка и способ оздоровления экономики.<\/p><p><strong>Виды конкуренции<\/strong> выделяют по классификационным признакам:<\/p><ul><li>этические нормы (добросовестная / недобросовестная);<\/li><li>тип рынка или конкурентной среды;<\/li><li>ценовой признак (ценовая / неценовая);<\/li><li>форма;<\/li><li>территориальный или страновой признак;<\/li><li>уровень конкуренции;<\/li><li>тип конкурентов и их роль в конкурентной борьбе;<\/li><li>субъект;<\/li><li>количество участвующих в противоборстве хозяйствующих субъектов.<\/li><\/ul>","<p><strong>Потребительская ценность товара<\/strong> – максимальная цена (Ц<sub>max<\/sub>), которую потребитель считает для себя выгодным заплатить за товар.<\/p><ul><li>Цена продавца (производителя): <strong>Ц = З + П<\/strong> (затраты + прибыль).<\/li><li>Потребительская ценность (для покупателя): <strong>Ц<sub>max<\/sub> = З<sub>п<\/sub> + П<sub>п<\/sub><\/strong>.<\/li><li><strong>К = Ц<sub>max<\/sub> – Ц<\/strong> – неоплаченная часть потребительской ценности (выгода покупателя).<\/li><\/ul><p><strong>Неоплаченная часть потребительской ценности товара (К) пропорциональна его конкурентоспособности.<\/strong> Если продавец повышает цену (П<sub>1<\/sub> &gt; П), а ценность для покупателя не меняется, К уменьшается и товар становится менее конкурентоспособным. Повысить конкурентоспособность можно, снизив цену или увеличив ценность товара в глазах покупателя.<\/p>","<p><strong>Измерение<\/strong> – получение численного значения размера. <strong>Измеряемая величина<\/strong> – некоторое свойство объекта.<\/p><p>Основное уравнение численных измерений:<\/p><p class=\"fm\">Q<sub>i<\/sub> = N<sub>i<\/sub> · [Q]<\/p><p>где N<sub>i<\/sub> – числовое значение, [Q] – единица величины.<\/p><p><strong>Виды измерений:<\/strong><\/p><ol><li><strong>Прямые<\/strong> – искомое значение получают непосредственным сравнением с мерой этой величины.<\/li><li><strong>Косвенные<\/strong> – значение вычисляют по известной зависимости от величин, полученных прямыми измерениями.<\/li><li><strong>Совокупные<\/strong> – одновременные измерения нескольких <strong>одноимённых<\/strong> величин; искомые значения находят решением системы уравнений.<\/li><li><strong>Совместные<\/strong> – одновременные измерения нескольких <strong>разноимённых<\/strong> величин для нахождения зависимости между ними.<\/li><\/ol><p><strong>Измерительные шкалы:<\/strong><\/p><ul><li><strong>Шкала порядка<\/strong> – определяет операцию упорядочения между объектами (Q<sub>3<\/sub> &lt; Q<sub>1<\/sub> &lt; Q<sub>2<\/sub> &lt; Q<sub>4<\/sub> &lt; Q<sub>5<\/sub> – возрастающего порядка; Q<sub>1<\/sub> &gt; Q<sub>4<\/sub> &gt; Q<sub>2<\/sub> &gt; Q<sub>3<\/sub> &gt; Q<sub>5<\/sub> – убывающего). (+) простота, широкое использование; (–) не даёт возможности определить, во сколько раз один размер больше или меньше другого.<\/li><li><strong>Шкала интервалов<\/strong> – фиксируются отличия сопоставляемых размеров: Q<sub>i<\/sub> – Q<sub>j<\/sub> = ΔQ<sub>ij<\/sub>, i = 1, 2, …, n, j = const. Начало отсчёта и деление шкалы на равные части – произвольные.<\/li><li><strong>Шкала отношений<\/strong> – определяется численное значение измеряемой величины: N<sub>i<\/sub> = Q<sub>i<\/sub> / [Q]. Не имеет отрицательных значений; построение не всегда возможно.<\/li><\/ul>","<p><strong>Квалиметрия<\/strong> – учение об измерении и количественной оценке качества объектов и процессов деятельности людей.<\/p><ol><li>Количественная оценка качества изделия проводится после того, как установлены <strong>условия и цель<\/strong> оценки.<\/li><li>Качество рассматривается как <strong>иерархическая совокупность свойств<\/strong>, расположенных на различных уровнях.<\/li><li>Оценка свойств объекта заканчивается вычислением <strong>относительного показателя<\/strong> качества.<\/li><li>Оценка качества проводится с точки зрения <strong>общественной потребности<\/strong>.<\/li><li>Каждое свойство качества определяется двумя параметрами – <strong>относительным показателем и весовым коэффициентом<\/strong>.<\/li><\/ol>","<p>Шкала порядка<\/p><p>Определяет операцию упорядочения между объектами (пример: уровень образования – начальное, среднее, высшее; баллы твёрдости).<\/p><p>Q<sub>3<\/sub> &lt; Q<sub>1<\/sub> &lt; Q<sub>2<\/sub> &lt; Q<sub>4<\/sub> &lt; Q<sub>5<\/sub> – шкала возрастающего порядка<\/p><p>Q<sub>1<\/sub> &gt; Q<sub>4<\/sub> &gt; Q<sub>2<\/sub> &gt; Q<sub>3<\/sub> &gt; Q<sub>5<\/sub> – шкала убывающего порядка<\/p><p>Допустимые отношения: =, ≠, &lt;, &gt;.<\/p><p><strong>Преимущества:<\/strong> простота и широкое использование на практике; позволяет упорядочить объекты по степени выраженности свойства; удобна для сравнения и классификации.<\/p><p><strong>Недостатки:<\/strong> не даёт возможности определить, на сколько и во сколько раз один размер больше или меньше другого.<\/p><p>Шкала интервалов<\/p><p>Фиксируются отличия (разности) сопоставляемых размеров. Пример: температура по Цельсию и Фаренгейту, календарные даты.<\/p><p>Q<sub>i<\/sub> – Q<sub>j<\/sub> = ΔQ<sub>ij<\/sub>, i = 1, 2, …, n, j = const<\/p><p>Начало отсчёта – произвольное (условный ноль); деление шкалы на равные части – произвольное.<\/p><p>Допустимые отношения: =, ≠, &lt;, &gt;, +, –.<\/p><p><strong>Преимущества:<\/strong> позволяет упорядочить объекты и измерить, <strong>на сколько<\/strong> один размер отличается от другого; допускает сложение и вычитание; подходит для статистического анализа.<\/p><p><strong>Недостатки:<\/strong> нет абсолютного (естественного) нуля, поэтому нельзя умножать, делить и говорить, <strong>во сколько раз<\/strong> одно значение больше другого (20 °C не «вдвое теплее» 10 °C).<\/p>","<p><strong>Шкала отношений<\/strong> – шкала с равными интервалами и <strong>абсолютным (естественным) нулём<\/strong>, обозначающим отсутствие измеряемого свойства. Определяется численное значение измеряемой величины. Примеры: масса, длина, время, возраст, температура по Кельвину.<\/p><p class=\"fm\">N<sub>i<\/sub> = Q<sub>i<\/sub> / [Q]<\/p><p><strong>Принцип построения:<\/strong> задаётся естественный ноль и единица измерения [Q]; значение величины – число единиц, содержащихся в ней. Не имеет отрицательных значений; построение не всегда возможно.<\/p><p>Допустимые отношения: =, ≠, &lt;, &gt;, +, –, ×, ÷.<\/p><p><strong>Сходство со шкалой интервалов:<\/strong> обе метрические (количественные), имеют равные интервалы, допускают упорядочение, сложение и вычитание.<\/p><p><strong>Отличие:<\/strong> у шкалы отношений ноль абсолютный, а у шкалы интервалов – условный. Поэтому только на шкале отношений допустимы умножение и деление и можно сказать, <strong>во сколько раз<\/strong> одно значение больше другого.<\/p><p><strong>Преимущества:<\/strong> наивысшая информативность; допустимы все арифметические операции и статистический анализ.<\/p><p><strong>Недостатки:<\/strong> требует естественного нуля, поэтому построение не всегда возможно; не имеет отрицательных значений.<\/p>","<p><strong>Требование единства измерений<\/strong> – это такое их осуществление, которое обеспечивает достоверность и сопоставимость результатов однородных измерений, а значения измеряемых величин при этом выражаются в узаконенных и общепринятых единицах (Закон РФ «Об обеспечении единства измерений» от 27.04.1993 № 4871-1, с изменениями от 10.01.2003).<\/p><ul><li><strong>Правовая основа<\/strong> – законодательная метрология.<\/li><li><strong>Организационное обеспечение<\/strong> – осуществляет Федеральное агентство по техническому регулированию и метрологии (Росстандарт).<\/li><li><strong>Техническая база<\/strong> – система хранения эталонов.<\/li><\/ul><p><strong>Основные задачи:<\/strong><\/p><ul><li>осуществление государственного управления деятельностью по обеспечению единства измерений;<\/li><li>утверждение и хранение государственных эталонов единиц величин;<\/li><li>аттестация методик выполнения измерений;<\/li><li>координация работ по обеспечению единства измерений времени, частоты, определения параметров вращения Земли (Гос. служба времени и частоты);<\/li><li>координация работ по разработке и внедрению стандартных справочных данных о физических константах и свойствах веществ и материалов (Гос. служба стандартных справочных данных);<\/li><li>утверждение типа средств измерений;<\/li><li>поверка средств измерений;<\/li><li>калибровка средств измерений;<\/li><li>государственный метрологический надзор за количеством товаров, отчуждаемых при совершении торговых операций;<\/li><li>контроль за количеством фасованных товаров в упаковках любого вида.<\/li><\/ul>","<p>Значения показателей качества получают, измеряя свойства на одной из шкал. Количественную оценку обеспечивают <strong>метрические шкалы<\/strong>, позволяющие выполнять математические операции с результатами измерений.<\/p><div class=\"tw\"><table><thead><tr><th><\/th><th>Шкала интервалов<\/th><th>Шкала отношений<\/th><th>Шкала абсолютных величин<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Измеряемые характеристики<\/th><td>Количественные (дискретные и непрерывные)<\/td><td>Количественные (дискретные и непрерывные)<\/td><td>Количественные (дискретные и непрерывные)<\/td><\/tr><tr><th scope=\"row\">Определяемые отношения<\/th><td>=, ≠, &lt;, &gt;, +, –<\/td><td>=, ≠, &lt;, &gt;, +, –, ×, ÷<\/td><td>=, ≠, &lt;, &gt;, +, –, ×, ÷<\/td><\/tr><tr><th scope=\"row\">Примеры<\/th><td>Температура в °C и °F, календарные даты<\/td><td>Температура в K, возраст, время и др.<\/td><td>Доход, величины с размерностью физических единиц, количество остановок, высота и др.<\/td><\/tr><tr><th scope=\"row\">Информативность результатов<\/th><td>Высокая<\/td><td>Наивысшая<\/td><td>Наивысшая<\/td><\/tr><tr><th scope=\"row\">Чувствительность к погрешностям<\/th><td>Высокая<\/td><td>Наивысшая<\/td><td>Наивысшая<\/td><\/tr><\/tbody><\/table><\/div><p>По способу получения значений показателей выделяют методы: измерительный, регистрационный, расчётный, органолептический, экспертный, социологический.<\/p>","<ul><li><strong>По характеризуемым свойствам:<\/strong> назначения, надёжности, экономного использования ресурсов, технологичности, транспортабельности, эргономические, экологические, безопасности, эстетические, стандартизации и унификации, патентно-правовые, экономические.<\/li><li><strong>По стадии определения:<\/strong> прогнозируемые, проектные, производственные, эксплуатационные.<\/li><li><strong>По применению для оценки:<\/strong> базовые (значения у базового образца), относительные (отношение показателя объекта к базовому).<\/li><li><strong>По количеству характеризуемых свойств:<\/strong> единичные (одно свойство), комплексные – групповые, интегральные, обобщённые (несколько свойств).<\/li><\/ul><p><strong>Содержание основных видов показателей:<\/strong><\/p><ul><li><strong>Назначения<\/strong> – характеризуют свойства продукции, определяющие основные функции, для выполнения которых она предназначена, и обусловливают область её применения.<\/li><li><strong>Надёжности<\/strong> – характеризуют изменение качества изделия (объекта) во времени.<\/li><li><strong>Экономного использования ресурсов<\/strong> – отражают техническое совершенство изделия по количеству потребляемых в процессе работы ресурсов.<\/li><li><strong>Технологичности<\/strong> – характеризуют оптимальное распределение затрат материалов, средств труда и времени при подготовке производства, изготовлении, эксплуатации, ремонте и утилизации.<\/li><li><strong>Транспортабельности<\/strong> – характеризуют приспособленность продукции к перемещению (транспортированию) без её использования.<\/li><li><strong>Эргономические<\/strong> – характеризуют систему «человек – изделие» и учитывают гигиенические, антропометрические, физиологические, психофизиологические свойства человека.<\/li><li><strong>Экологические<\/strong> – характеризуют уровень вредного воздействия на окружающую среду при эксплуатации изделия.<\/li><li><strong>Безопасности<\/strong> – характеризуют безопасность персонала, пассажиров (для транспорта) и окружающих людей при эксплуатации, хранении и утилизации изделия.<\/li><li><strong>Эстетические<\/strong> – характеризуют информационную выразительность, рациональность формы, гармоничность сочетания элементов изделия между собой и с окружающей средой.<\/li><li><strong>Стандартизации и унификации<\/strong> – характеризуют насыщенность продукции стандартными, унифицированными и оригинальными частями.<\/li><li><strong>Патентно-правовые<\/strong> – характеризуют степень обновления технических решений, их патентную защиту и возможность беспрепятственной реализации в стране и за рубежом.<\/li><li><strong>Экономические<\/strong> – характеризуют затраты на разработку, изготовление и эксплуатацию изделия и экономическую эффективность его применения: себестоимость изготовления, цена изделия, затраты при эксплуатации, суммарные затраты за весь жизненный цикл (см. цену потребления, вопрос 22).<\/li><\/ul>","<p><strong>Номенклатура показателей качества<\/strong> – перечень показателей, по которым оценивают качество данного вида продукции. Её выбирают на основе классификации показателей (вопрос 10) по ГОСТ 22851-77 «Выбор номенклатуры показателей качества промышленной продукции. Основные положения».<\/p><p>Номенклатура зависит от назначения и условий использования продукции, требований потребителей и цели оценки. Для выбора номенклатуры часто применяют экспертные методы. Номенклатура показателей базового образца должна совпадать с номенклатурой показателей оцениваемой продукции.<\/p><p>Для услуг номенклатура показателей установлена ГОСТ Р 52113-2014 (см. вопрос 24).<\/p>","<p>Дифференциальный метод основан на <strong>сопоставлении значений единичных показателей качества<\/strong> оцениваемого и базового образцов. Определяют, достигнут ли уровень базового образца в целом, по каким показателям он достигнут и какие показатели существенно отличаются от базовых. Свойства условно рассматриваются как равнозначные; количество учитываемых свойств ограничено, что облегчает оценивание.<\/p><p><strong>Алгоритм:<\/strong><\/p><ol><li>Определение единичных показателей качества исследуемого объекта P<sub>1<\/sub>, P<sub>2<\/sub>, …, P<sub>n<\/sub> и базового образца P<sub>1Б<\/sub>, P<sub>2Б<\/sub>, …, P<sub>nБ<\/sub>.<\/li><li>Определение единичных относительных показателей качества:<\/li><\/ol><p class=\"fm\">q<sub>i<\/sub> = (P<sub>i<\/sub> / P<sub>iБ<\/sub>)<sup>ξ<\/sup><\/p><p>где ξ = 1, если росту P<sub>i<\/sub> соответствует повышение качества; ξ = –1, если росту P<sub>i<\/sub> соответствует снижение качества.<\/p><p><strong>Вывод:<\/strong><\/p><ul><li>все q<sub>i<\/sub> ≥ 1 → уровень качества объекта <strong>не ниже<\/strong> уровня базового образца;<\/li><li>все q<sub>i<\/sub> &lt; 1 → уровень качества объекта <strong>не выше<\/strong> уровня базового образца;<\/li><li>часть q<sub>i<\/sub> ≥ 1, часть &lt; 1 → однозначного вывода нет, <strong>выбирают другой метод<\/strong> (комплексный или смешанный).<\/li><\/ul>","<p><strong>Базовый образец<\/strong> – совокупность реально достигаемых значений показателей качества определённого типа продукции, принятых для сравнения и отражающих в среднем потребности определённой группы потребителей. Отражает требования, установленные на определённый период.<\/p><p><strong>Группы базовых образцов<\/strong> (РД 50-451-84):<\/p><ol><li><strong>Перспективные<\/strong> – прогнозируемые реально достижимые значения показателей, соответствующие передовым научно-техническим достижениям на установленный будущий период.<\/li><li><strong>Реальные мировые<\/strong> – образцы, отражающие современные мировые достижения на установленный период.<\/li><li><strong>Реальные отечественные<\/strong> – образцы, отражающие наиболее высокие отечественные научно-технические достижения на установленный период.<\/li><\/ol><p><strong>Базовыми образцами могут служить:<\/strong><\/p><ul><li><strong>на стадии разработки:<\/strong> перспективный образец; планируемая к освоению продукция, показатели которой заложены в техническом задании, техническом или рабочем проекте;<\/li><li><strong>на стадии изготовления:<\/strong> выпускаемая в России или за рубежом продукция с самыми высокими показателями, наиболее эффективная в эксплуатации; национальные, международные и прогрессивные зарубежные стандарты, технические условия с оптимальными значениями показателей.<\/li><\/ul><p><strong>Аналог<\/strong> – продукция отечественного или зарубежного производства, сходная с оцениваемой по назначению и области применения, т. е. с теми же классификационными показателями. Все аналоги в группе и оцениваемая продукция должны иметь <strong>одинаковые значения классификационных показателей<\/strong>.<\/p><p><strong>Выбор базового образца:<\/strong> из группы продукции, аналогичной по назначению, условиям изготовления и эксплуатации (потребления). В группу должна входить продукция:<\/p><ul><li>представляющая значительную часть общего объёма продукции, производимой и реализуемой в России и за рубежом;<\/li><li>пользующаяся устойчивым спросом на внутреннем рынке;<\/li><li>конкурентоспособная на международном рынке.<\/li><\/ul><p>Такая группа характеризует достигнутый уровень качества, близкий к оптимальному. Номенклатура показателей базового образца должна соответствовать номенклатуре показателей оцениваемой продукции.<\/p>","<p>Для сложной продукции учитывается много единичных показателей, что затрудняет вывод об уровне качества. Комплексный метод объединяет выбранные единичные показатели в <strong>один комплексный (обобщённый) показатель<\/strong> – уровень качества выражается одним числом.<\/p><p><strong>Алгоритм:<\/strong><\/p><ol><li>Определение единичных показателей объекта P<sub>i<\/sub> и базового образца P<sub>iБ<\/sub>.<\/li><li>Определение единичных относительных показателей q<sub>i<\/sub> = (P<sub>i<\/sub> / P<sub>iБ<\/sub>)<sup>ξ<\/sup>.<\/li><li>Определение комплексного показателя качества с учётом весовых коэффициентов:<\/li><\/ol><p class=\"fm\">K = Σ m<sub>i<\/sub> q<sub>i<\/sub> (i = 1…n), Σ m<sub>i<\/sub> = 1<\/p><p class=\"fm\">У<sub>К<\/sub> = K / K<sub>Б<\/sub><\/p><p>где m<sub>i<\/sub> – весовые коэффициенты (определяются экспертно), K<sub>Б<\/sub> – комплексный показатель базового образца. У<sub>К<\/sub> &gt; 1 – качество объекта выше базового.<\/p>","<p><strong>Назначение:<\/strong> весовые коэффициенты <strong>количественно<\/strong> отражают важность (значимость) соответствующих свойств (частных критериев). Каждое свойство качества определяется двумя параметрами – относительным показателем и весовым коэффициентом.<\/p><p>Значения весовых коэффициентов выбираются исходя из анализа мирового уровня развития отрасли, требований к проектируемому объекту и возможностей реализации этих требований. Величина λ<sub>i<\/sub> задаёт в количественном измерении предпочтение i-го критерия над другими. Условие нормирования:<\/p><p>Σ λ<sub>i<\/sub> = 1 (i = 1…m)<\/p><p><strong>Способы определения<\/strong> – группа экспертных методов:<\/p><ul><li>метод анализа иерархий;<\/li><li>метод расстановки приоритетов;<\/li><li>метод согласования по критериям;<\/li><li><strong>метод ранжирования<\/strong> – каждый эксперт расставляет критерии в порядке их важности;<\/li><li><strong>метод приписывания баллов<\/strong> – эксперты оценивают важность каждого критерия по шкале (например, 0–10).<\/li><\/ul>","<p>Используется <strong>интегральный показатель качества (И)<\/strong> – отношение суммарного полезного эффекта от эксплуатации или потребления продукции к суммарным затратам на её создание и эксплуатацию или потребление.<\/p><p class=\"fm\">У<sub>К<\/sub> = И / И<sub>Б<\/sub><\/p><p>И = Э / (З<sub>С<\/sub> + З<sub>Э<\/sub>) – для продукции со сроком службы не более одного года<\/p><p>И = Э / (З<sub>С<\/sub> · φ(t) + З<sub>Э<\/sub>) – для продукции со сроком службы более одного года<\/p><p>Э – суммарный полезный эффект от эксплуатации или потребления продукции; З<sub>С<\/sub> – суммарные затраты на создание продукции; З<sub>Э<\/sub> – суммарные затраты на эксплуатацию или потребление; φ(t) – поправочный коэффициент, учитывающий срок службы.<\/p>","<p>Основан на одновременном использовании <strong>единичных и комплексных (групповых)<\/strong> показателей. Применяется для сложных объектов с большим числом показателей (более 20–30), когда:<\/p><ul><li>единичных показателей много, они разнообразны и анализ каждого не позволяет сделать обобщающий вывод;<\/li><li>один комплексный показатель недостаточно полно учитывает значимые свойства и не даёт выводов по группам свойств.<\/li><\/ul><p><strong>Алгоритм:<\/strong> единичные показатели P<sub>1<\/sub>…P<sub>M<\/sub> объединяют в группы 1…n; для каждой группы алгоритмом комплексного метода считают групповой показатель, затем по группам – обобщённый показатель. Отдельные особо важные показатели можно оставить единичными и сравнить дифференциальным методом.<\/p><p class=\"fm\">q<sub>ij<\/sub> = (P<sub>ij<\/sub> / P<sub>ijБ<\/sub>)<sup>ξ<\/sup><\/p><p class=\"fm\">K<sub>i<\/sub> = Σ m<sub>ij<\/sub> q<sub>ij<\/sub> (j = 1…N<sub>i<\/sub>), Σ m<sub>ij<\/sub> = 1<\/p><p class=\"fm\">Q = Σ α<sub>i<\/sub> K<sub>i<\/sub> (i = 1…n), Σ α<sub>i<\/sub> = 1<\/p><p class=\"fm\">У<sub>К<\/sub> = Q / Q<sub>Б<\/sub><\/p><p>m<sub>ij<\/sub> – весовой коэффициент j-го свойства i-й группы; q<sub>ij<\/sub> – относительный показатель j-го свойства i-й группы; K<sub>i<\/sub> – комплексный показатель i-й группы; α<sub>i<\/sub> – весовой коэффициент i-й группы. При нормированных весах у базового образца K<sub>iБ<\/sub> = 1 и Q<sub>Б<\/sub> = 1, поэтому У<sub>К<\/sub> = Q.<\/p>","<p>Уровень качества оценивается через <strong>экономическую эффективность продукции<\/strong> – суммарный эффект для производителя и для потребителя – в сравнении с базовым образцом.<\/p><p class=\"fm\">У<sub>К<\/sub> = П / П<sub>Б<\/sub><\/p><p>П = П<sub>П<\/sub> + П<sub>Э<\/sub> – экономическая эффективность продукции<\/p><p class=\"fm\">П<sub>П<\/sub> = Ц<sub>ОПТ<\/sub> · V – З<sub>П<\/sub><\/p><p>П<sub>П<\/sub> – экономическая эффективность для производителя; Ц<sub>ОПТ<\/sub> – оптовая цена единицы продукции; V – объём реализованной продукции; З<sub>П<\/sub> – затраты на производство продукции.<\/p><p class=\"fm\">П<sub>Э<\/sub> = Ц · N – Ц<sub>П<\/sub><\/p><p>П<sub>Э<\/sub> – экономическая эффективность для потребителя; Ц – стоимость единицы полезного эффекта от эксплуатации (использования) продукции; N – количество изготовленной конечной продукции или выполненной работы; Ц<sub>П<\/sub> – цена потребления продукции (вопрос 22).<\/p>","<p>Группа методов экспертной оценки основана на <strong>знаниях, опыте и интуиции специалистов-экспертов<\/strong>. Применяется в слабо формализуемых ситуациях; обобщённое мнение экспертов служит основанием для выбора.<\/p><p><strong>Применяют при:<\/strong><\/p><ul><li>аттестации продукции;<\/li><li>разработке классификации оцениваемых изделий;<\/li><li>определении номенклатуры показателей качества;<\/li><li>определении весовых коэффициентов показателей качества;<\/li><li>выборе базовых образцов и значений базовых показателей качества.<\/li><\/ul><p>Метод <strong>не используется<\/strong>, если качество можно оценить аналитическими или экспериментальными методами с большей точностью или меньшими затратами.<\/p><p><strong>К группе относятся:<\/strong> метод рангов (ранжирования); метод непосредственного оценивания (балльный); метод сопоставлений; метод «Дельфи»; органолептический; социологический и др.<\/p>","<p><strong>Федеральный закон от 27.12.2002 № 184-ФЗ «О техническом регулировании»<\/strong> – основной нормативный документ, определяющий техническое регулирование в РФ.<\/p><p><strong>Недостатки старой системы:<\/strong> несоответствие международным нормам (ВТО); барьеры для экономики, сдерживание инвестиций; чрезмерная сложность и противоречивость (дублирование процедур, конфликтующие требования ведомств); низкая вовлечённость бизнеса в разработку норм.<\/p><p><strong>Цели нового закона:<\/strong><\/p><ul><li>гармонизировать систему технического регулирования России с международной (прежде всего европейской) и устранить технические барьеры в торговле;<\/li><li>содействовать выходу отечественных товаров на мировой рынок;<\/li><li>обеспечить равные условия для отечественных и зарубежных производителей на российском рынке;<\/li><li>исключить нормотворчество ведомств.<\/li><\/ul><p><strong>Ключевые понятия:<\/strong> технический регламент – обязательный документ с минимально необходимыми требованиями безопасности; стандарт – добровольный документ с характеристиками продукции и процессов; <strong>сертификация<\/strong> – подтверждение соответствия продукции требованиям регламентов, стандартов или договоров независимым органом.<\/p><p><strong>Принципы технического регулирования:<\/strong><\/p><ul><li>единые правила установления требований к продукции, процессам, работам и услугам;<\/li><li>соответствие технического регулирования уровню развития национальной экономики, материально-технической базы и науки;<\/li><li>независимость органов по аккредитации и сертификации от изготовителей, продавцов, исполнителей и приобретателей;<\/li><li>единая система и правила аккредитации;<\/li><li>единство правил и методов испытаний и измерений при обязательной оценке соответствия;<\/li><li>единство применения требований технических регламентов независимо от видов сделок;<\/li><li>недопустимость ограничения конкуренции при аккредитации и сертификации;<\/li><li>недопустимость совмещения полномочий органа госконтроля (надзора) и органа по сертификации;<\/li><li>недопустимость совмещения одним органом полномочий на аккредитацию и сертификацию;<\/li><li>недопустимость внебюджетного финансирования госконтроля за соблюдением технических регламентов.<\/li><\/ul><p><strong>Структура системы технического регулирования РФ:<\/strong><\/p><ul><li>ФЗ «О техническом регулировании»;<\/li><li>технические регламенты — общие и специальные, обязательны для исполнения;<\/li><li>стандарты — международные, национальные, стандарты организаций; применяются добровольно.<\/li><\/ul>","<p><strong>Технический регламент<\/strong> – документ, который принят международным договором РФ, ратифицированным в установленном порядке, или федеральным законом, или указом Президента РФ, или постановлением Правительства РФ, и устанавливает <strong>обязательные<\/strong> для применения и исполнения требования к объектам технического регулирования (продукции, в том числе зданиям, строениям и сооружениям, процессам производства, эксплуатации, хранения, перевозки, реализации и утилизации).<\/p><p><strong>Виды технических регламентов:<\/strong><\/p><ul><li><strong>Общие<\/strong> – по вопросам безопасной эксплуатации и утилизации машин и оборудования; безопасной эксплуатации зданий, строений, сооружений и прилегающих территорий; пожарной, биологической, экологической, ядерной и радиационной безопасности; электромагнитной совместимости. Обязательны для любых видов продукции и процессов.<\/li><li><strong>Специальные<\/strong> – учитывают технологические и иные особенности отдельных видов продукции и процессов. Устанавливают требования только к тем видам продукции и процессам, степень риска причинения вреда которыми выше степени риска, учитываемой общим техническим регламентом.<\/li><\/ul><p><strong>Стандарт<\/strong> – документ, в котором в целях <strong>добровольного<\/strong> многократного использования устанавливаются характеристики продукции, правила осуществления и характеристики процессов производства, эксплуатации, хранения, перевозки, реализации и утилизации, выполнения работ или оказания услуг. Может содержать требования к терминологии, символике, упаковке, маркировке или этикеткам и правилам их нанесения.<\/p><p><strong>Виды стандартов:<\/strong><\/p><ul><li><strong>по уровню принятия:<\/strong> международные, национальные, стандарты организаций;<\/li><li><strong>по объекту и содержанию требований:<\/strong> основополагающие; на продукцию; на услуги; на процессы (работы); на методы испытаний и контроля; на термины и определения.<\/li><\/ul><p class=\"key\"><em>Главное отличие: технический регламент обязателен, стандарт применяется добровольно.<\/em><\/p>","<p><strong>Цена потребления<\/strong> – полные расходы потребителя на приобретение и эксплуатацию продукции в течение срока её службы: сумма продажной цены и стоимости потребления (использования) товара за период эксплуатации.<\/p><p class=\"fm\">Ц<sub>П<\/sub>(t) = Ц<sub>О<\/sub> + Σ З<sub>i<\/sub>(t)<\/p><p>Ц<sub>О<\/sub> – цена приобретения изделия; З<sub>i<\/sub>(t) – затраты, связанные с эксплуатацией, за время t. Относится к экономическим показателям качества.<\/p><p><strong>Где используется:<\/strong> в <strong>экономико-статистическом методе<\/strong> – в формуле экономической эффективности для потребителя П<sub>Э<\/sub> = Ц · N – Ц<sub>П<\/sub> (см. вопрос 18). По смыслу близка к знаменателю интегрального показателя (затраты на создание и эксплуатацию).<\/p>","<p><strong>Услуга<\/strong> – результат непосредственного взаимодействия исполнителя и потребителя, а также собственной деятельности исполнителя по удовлетворению потребности потребителя. По ГОСТ ISO 9000 – результат как минимум одного действия, обязательно осуществлённого при взаимодействии поставщика и потребителя, как правило нематериальный.<\/p><p>Услуги населению подразделяются на <strong>материальные, нематериальные (социально-культурные) и смешанные<\/strong>.<\/p><p><strong>Материальные услуги<\/strong> – услуги по удовлетворению материально-бытовых потребностей; включают деятельность по отношению к материальному продукту, в том числе предоставленному потребителем. Суть: восстановление, изменение или сохранение потребительских свойств изделий, изготовление продукции по заказу, перемещение людей и грузов. Примеры: автосервис, ремонт жилья и техники, химчистка, ЖКХ, транспорт, общепит, гостиницы. Услуги с материальным результатом часто называют «работами».<\/p><p><strong>Нематериальные (социально-культурные) услуги<\/strong> – услуги по удовлетворению духовных, интеллектуальных, этических потребностей и поддержанию нормальной жизнедеятельности: поддержание и восстановление здоровья, духовное и физическое развитие личности, повышение профессионализма. Примеры: финансовые, юридические, консалтинговые услуги; образование; культура, спорт, туризм, досуг; медицинские, парикмахерские, косметические услуги; телекоммуникационные услуги.<\/p>","<p>Установлена <strong>ГОСТ Р 52113-2014<\/strong>. Четыре группы показателей:<\/p><ul><li><strong>Назначения:<\/strong> применения; совместимости; качества предприятия; специфические.<\/li><li><strong>Безопасности:<\/strong> для жизни, здоровья и имущества потребителей; для окружающей среды; сохранности информации и имущества потребителей.<\/li><li><strong>Надёжности:<\/strong> надёжность результата услуги; стойкость результата услуги к внешним воздействиям; помехозащищённость; надёжность предоставления услуги.<\/li><li><strong>Профессионального уровня персонала:<\/strong> уровень профессиональной подготовки и квалификации; способность к руководству; знание и соблюдение профессиональной этики поведения.<\/li><\/ul>"]};

function h(tag, props) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'disabled' || k === 'hidden' || k === 'value' || k === 'spellcheck') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { for (const k of kid) add(el, k); return; }
  el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}

    .replace(/\$([^$]*)\$/g, (_, m) => '<span class="f' + (m.replace(/[_^{}]/g, '').length <= 18 ? ' fn' : '') + '">' +
      m.replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>') + '</span>');
}

function parseNum(raw) {
  let s = String(raw).trim().replace(/[\s  ]/g, '').replace(/,/g, '.').replace(/[−–—]/g, '-');
  s = s.replace(/[^\d.\-]+$/, '');

  host.append(box);
  return {
    ready: function () { return ctls.every(c => c.ready()); },
    check: function () {
      const res = ctls.map(c => c.check());
      const good = res.filter(Boolean).length;
      return { ok: good === res.length, note: good === res.length ? '' : good + ' из ' + res.length + ' полей' };
    }
  };
}

function mountValue(q, host, ctx) {
  let v = q.start, moved = false;
  const Y0 = 190, HH = 150;
  const y = val => Math.round((Y0 - val / q.cmax * HH) * 10) / 10;
  const fig = h('div');
  const out = h('output', { class: 'val-out', for: 'val-range' });
  const leg = h('div', { class: 'val-leg' });
  const rng = h('input', { type: 'range', id: 'val-range', min: String(q.min), max: String(q.max), step: String(q.step), value: String(v), 'aria-label': 'Цена' });
  rng.addEventListener('input', function () { v = +rng.value; moved = true; draw(); ctx.change(); });
  host.append(h('div', { class: 'val' }, fig, h('div', { class: 'val-ctl' }, h('label', { for: 'val-range' }, 'Цена продавца'), out, rng), leg));
  draw();
  function draw(reveal) {
    const yc = y(q.cost), yp = y(v), ym = y(q.cmax);
    fig.innerHTML = '<svg viewBox="0 0 360 236" role="img" aria-label="Столбики цены продавца и потребительской ценности">' +
      '<rect class="sv-cost" x="62" y="' + yc + '" width="76" height="' + (Y0 - yc) + '"/>' +
      '<rect class="sv-profit" x="62" y="' + yp + '" width="76" height="' + Math.max(0, yc - yp) + '"/>' +
      '<rect class="sv-max" x="222" y="' + ym + '" width="76" height="' + (Y0 - ym) + '"/>' +
      '<line class="sv-base" x1="28" y1="' + Y0 + '" x2="332" y2="' + Y0 + '"/>' +
      '<text class="sv-ink sv-k" x="100" y="' + ((yc + Y0) / 2 + 6) + '" text-anchor="middle">З</text>' +
      (yc - yp > 22 ? '<text class="sv-tapeink sv-k" x="100" y="' + ((yp + yc) / 2 + 6) + '" text-anchor="middle">П</text>' : '') +
      '<text class="sv-ink sv-k" x="260" y="' + ((ym + Y0) / 2 + 6) + '" text-anchor="middle">Ц<tspan dy="4" font-size="11">max</tspan></text>' +
      '<path class="sv-dash" d="M138 ' + yp + 'H180M222 ' + ym + 'H180"/>' +
      (yp - ym > 14 ? '<path class="sv-line" d="M180 ' + (ym + 2) + 'V' + (yp - 2) + 'M175 ' + (ym + 8) + 'L180 ' + (ym + 2) + 'L185 ' + (ym + 8) + 'M175 ' + (yp - 8) + 'L180 ' + (yp - 2) + 'L185 ' + (yp - 8) + '"/>' : '') +
      '<text class="sv-ink sv-k" x="190" y="' + (Math.max(ym + 16, (ym + yp) / 2 + 6)) + '">К</text>' +
      '<text class="sv-ink sv-t" x="100" y="211" text-anchor="middle">ЦЕНА</text><text class="sv-ink2 sv-s" x="100" y="228" text-anchor="middle">продавец</text>' +
      '<text class="sv-ink sv-t" x="260" y="211" text-anchor="middle">ЦЕННОСТЬ</text><text class="sv-ink2 sv-s" x="260" y="228" text-anchor="middle">покупатель</text>' +
      '</svg>';
    out.textContent = fmt(v) + ' ₽';
    leg.innerHTML = reveal
      ? fx('$К = Ц_{max} − Ц$ = ' + fmt(q.cmax) + ' − ' + fmt(v) + ' = ' + fmt(q.cmax - v) + ' ₽')
      : fx('Затраты $З$ = ' + fmt(q.cost) + ' ₽ · прибыль $П$ = ' + fmt(v - q.cost) + ' ₽ · ценность $Ц_{max}$ = ' + fmt(q.cmax) + ' ₽');
  }
  return {
    ready: function () { return moved; },
    check: function () {
      rng.disabled = true;
      draw(true);
      const ok = v === q.a;
      return { ok: ok, note: ok ? '' : 'нужная цена — ' + fmt(q.a) + ' ₽' };
    }
  };
}

const MOUNT = {
  one: function (q, host, ctx) { return mountChoice(q.opts, q.a, false, q.fix, host, ctx); },
  many: function (q, host, ctx) { return mountChoice(q.opts, q.a, true, q.fix, host, ctx); },
  tf: function (q, host, ctx) { return mountChoice(['Верно', 'Неверно'], q.a ? 0 : 1, false, true, host, ctx, 'tf'); },
  grid: mountGrid, order: mountOrder, bank: mountBank, input: mountInput, num: mountNum, case: mountCase, value: mountValue
};

function buildIds(opt) {
  let groups = BY_TOPIC.map(qs => qs.map(q => q.id));
  if (opt.len === 'short') groups = groups.map(function (g) {
    const pick = new Set(shuffle(g.slice()).slice(0, SHORT_N));
    return g.filter(id => pick.has(id));
  });
  const ids = [].concat.apply([], groups);
  return opt.ord === 'mix' ? shuffle(ids) : ids;
}
function startTest() {
  S.test = { ids: buildIds(S.opt), res: {}, done: false, t0: Date.now(), t1: 0 };
  Store.commit();
  openTest();
}
function openTest() {
  const T = S.test;
  let i = 0;
  while (i < T.ids.length && T.res[T.ids[i]] !== undefined) i++;
  if (i >= T.ids.length) { go('results'); return; }
  mode = 'test'; sess = { ids: T.ids, i: i };
  go('quiz');
}
function startFix() {
  const ids = shuffle(bankIds());
  if (!ids.length) return;
  mode = 'fix'; sess = { ids: ids, i: 0, total: ids.length, cleared: 0 };
  go('quiz');
}
function go(v) { view = v; askReset = false; render(); window.scrollTo(0, 0); }
function render() {
  ctl = null;
  if (view === 'quiz' && sess) renderQuiz();
  else if (view === 'results' && S.test) renderResults();
  else if (view === 'fixdone') renderFixDone();
  else { view = 'home'; renderHome(); }
}

function seg(label, items, cur, onPick) {
  return h('div', { class: 'setup-row' }, h('span', { class: 'lbl' }, label),
    h('div', { class: 'seg', role: 'group', 'aria-label': label }, items.map(it =>
      h('button', { type: 'button', 'aria-pressed': String(it.v === cur), onclick: function () { onPick(it.v); } }, it.t, it.n != null ? h('span', { class: 'cnt' }, String(it.n)) : null))));
}
function renderHome() {
  const T = S.test, inProg = !!T && !T.done, nBank = bankIds().length;
  const nShort = TOPICS.length * SHORT_N, nAll = QUESTIONS.length;
  const nSel = S.opt.len === 'short' ? nShort : nAll;

  const mast = h('header', { class: 'mast' },
    h('p', { class: 'eyebrow' }, 'Рубежный контроль № 1 · 24 вопроса'),
    h('h1', null, 'Управление качеством'),
    h('p', { class: 'lead' }, 'Один большой тест по всем вопросам контрольной: выбор ответа, сопоставление, порядок шагов, пропуски в определениях и расчётные задачи. После каждого ответа — разбор и нужный раздел шпаргалки.'));

  let rl, capL, capR;
  if (T) {
    const done = countDone(T);
    rl = ruler(T.ids.length, T.ids.map(id => T.res[id]), done);
    capL = T.done ? 'Тест пройден' : 'Отвечено ' + done + ' из ' + T.ids.length;
    capR = 'верно ' + countOk(T);
  } else { rl = ruler(nSel, [], 0); capL = 'Старт'; capR = nSel + ' ' + qWord(nSel); }
  const rulerBox = h('div', { class: 'home-ruler' }, rl, h('div', { class: 'ruler-cap' }, h('span', null, capL), h('span', null, capR)));

  const panel = h('section', { class: 'panel' });
  const fixBtn = nBank ? h('button', { class: 'btn', type: 'button', onclick: startFix }, 'Отработать ошибки', h('span', { class: 'cnt' }, String(nBank))) : null;
  if (inProg && askReset) {
    panel.append(h('h2', { class: 'panel-h' }, 'Сбросить этот тест?'),
      h('p', null, 'Ответы незаконченного теста пропадут. Список ошибок для отработки останется.'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn pri', type: 'button', onclick: function () { S.test = null; Store.commit(); askReset = false; render(); } }, 'Сбросить'),
        h('button', { class: 'btn', type: 'button', onclick: function () { askReset = false; render(); } }, 'Отмена')));
  } else if (inProg) {
    const done = countDone(T);
    panel.append(h('h2', { class: 'panel-h' }, 'Тест не закончен'),
      h('p', null, 'Отвечено ' + done + ' из ' + T.ids.length + ', верно ' + countOk(T) + '. Прогресс сохранён.'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn pri', type: 'button', onclick: openTest }, 'Продолжить', h('span', { class: 'cnt' }, 'вопрос ' + (done + 1))),
        fixBtn,
        h('button', { class: 'btn ghost', type: 'button', onclick: function () { askReset = true; render(); } }, 'Начать заново')));
  } else {
    if (T) {
      const ok = countOk(T), n = T.ids.length;
      panel.append(h('h2', { class: 'panel-h' }, 'Последний результат: ' + ok + ' из ' + n + ' · ' + Math.round(ok / n * 100) + ' %'));
      if (S.hist.length > 1) panel.append(h('p', { class: 'hist' }, 'Попытки: ' + S.hist.map(x => Math.round(x[1] / x[2] * 100) + ' %').join(' → ')));
    }
    panel.append(h('div', { class: 'setup' },
      seg('Объём', [{ v: 'all', t: 'Весь тест', n: nAll }, { v: 'short', t: 'Короткий', n: nShort }], S.opt.len, function (v) { S.opt.len = v; Store.commit(); render(); }),
      seg('Порядок', [{ v: 'topics', t: 'По темам' }, { v: 'mix', t: 'Вперемешку' }], S.opt.ord, function (v) { S.opt.ord = v; Store.commit(); render(); })),
      h('div', { class: 'actions' },
        h('button', { class: 'btn pri', type: 'button', onclick: startTest }, T ? 'Новый тест' : 'Начать тест'),
        fixBtn,
        T ? h('button', { class: 'btn', type: 'button', onclick: function () { go('results'); } }, 'Разбор по темам') : null));
  }

  const list = h('div', { class: 'tl' });
  TOPICS.forEach(function (_, i) {
    const t = i + 1;
    let sc = h('span', { class: 'sc' }, BY_TOPIC[i].length + ' вопр.');
    if (T) {
      const ids = T.ids.filter(id => QMAP.get(id).t === t && T.res[id] !== undefined);
      if (ids.length) { const ok = ids.filter(id => T.res[id] === 1).length; sc = h('span', { class: 'sc ' + (ok === ids.length ? 'full' : 'miss') }, ok + ' / ' + ids.length); }
    }
    const body = h('div', { class: 'tb prose' });
    const d = h('details', null, h('summary', null, h('span', { class: 'no' }, String(t)), h('span', { class: 'ti' }, CHEAT.titles[i]), sc), body);
    d.addEventListener('toggle', function () { if (d.open && !body.firstChild) body.innerHTML = CHEAT.sections[i]; });
    list.append(d);
  });

  root.replaceChildren(mast, rulerBox, panel,
    h('h2', { class: 'sec-h' }, 'Вопросы контрольной и шпаргалка'), list,
    h('p', { class: 'sync', id: 'sync' }, syncText()));
}

function renderQuiz() {
  const isTest = mode === 'test';
  const q = QMAP.get(sess.ids[sess.i]);
  locked = false;

  function mkRuler() {
    if (isTest) { const T = S.test; return ruler(T.ids.length, T.ids.map(id => T.res[id]), countDone(T)); }
    return ruler(sess.total, [], sess.cleared);
  }
  function mkCount() {
    if (isTest) return h('div', { class: 'qcount' }, String(sess.i + 1), h('small', null, ' / ' + sess.ids.length));
    return h('div', { class: 'qcount', title: 'Осталось отработать' }, String(sess.total - sess.cleared), h('small', null, ' ост.'));
  }
  let rl = mkRuler(), cnt = mkCount();
  const bar = h('div', { class: 'qbar' },
    h('button', { class: 'ibtn', type: 'button', 'aria-label': 'На главную', title: 'На главную', html: ICON.back, onclick: function () { Store.flush(); go('home'); } }),
    rl, cnt);
  const body = h('div', { class: 'qbody' });
  const fb = h('div', { class: 'fb', hidden: true, 'aria-live': 'polite' });
  const card = h('article', { class: 'qcard', 'data-q': q.id },
    h('div', { class: 'qmeta' },
      h('span', { class: 'qtopic' }, (isTest ? '' : 'Отработка ошибок · ') + 'Тема ' + q.t + ' · ' + TOPICS[q.t - 1]),
      q.src ? h('span', { class: 'qsrc' }, 'сверх шпаргалки · ' + q.src) : null),
    h('h2', { class: 'qtext', html: fx(q.q) }),
    q.note ? h('p', { class: 'qnote', html: fx(q.note) }) : null,
    h('p', { class: 'qhint' }, HINT[q.type]),
    body, fb);
  const btn = h('button', { class: 'btn pri', type: 'button', disabled: true }, 'Проверить');
  btn.addEventListener('click', function () { if (locked) next(); else check(); });
  root.replaceChildren(h('div', { class: 'quiz' }, bar, card, h('div', { class: 'grow' }), h('div', { class: 'act' }, btn)));

  const ctx = { change: function () { if (!locked && ctl) btn.disabled = !ctl.ready(); } };
  Object.defineProperty(ctx, 'locked', { get: function () { return locked; } });
  ctl = MOUNT[q.type](q, body, ctx);
  btn.disabled = !ctl.ready();

  function check() {
    if (!ctl.ready()) return;
    const r = ctl.check();
    const ok = !!r.ok;
    locked = true;
    let note = r.note || '';
    if (isTest) {
      S.test.res[q.id] = ok ? 1 : 0;
      if (ok) delete S.bank[q.id]; else S.bank[q.id] = (S.bank[q.id] || 0) + 1;
    } else if (ok) { delete S.bank[q.id]; sess.cleared++; }
    else { S.bank[q.id] = (S.bank[q.id] || 0) + 1; sess.ids.push(q.id); note = note ? note + ' · вопрос вернётся позже' : 'вопрос вернётся позже'; }
    Store.commit();
    const nr = mkRuler(); rl.replaceWith(nr); rl = nr;
    if (!isTest) { const nc = mkCount(); cnt.replaceWith(nc); cnt = nc; }
    fb.className = 'fb ' + (ok ? 'ok' : 'bad');
    fb.append(h('div', { class: 'fb-h' }, h('span', { html: ok ? ICON.ok : ICON.no }), ok ? 'Верно' : 'Неверно', note ? h('span', { class: 'fb-n' }, note) : null),
      h('p', { class: 'fb-t', html: fx(q.ex) }), cheat(q.t));
    fb.hidden = false;
    const last = sess.i + 1 >= sess.ids.length;
    btn.textContent = last ? (isTest ? 'К результатам' : 'Готово') : 'Дальше';
    btn.disabled = false;
    try { btn.focus({ preventScroll: true }); } catch (e) {}
    fb.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  function next() {
    sess.i++;
    if (sess.i < sess.ids.length) { renderQuiz(); window.scrollTo(0, 0); return; }
    if (isTest) {
      const T = S.test;
      T.done = true; T.t1 = Date.now();
      S.hist.push([T.t1, countOk(T), T.ids.length]); S.hist = S.hist.slice(-8);
      Store.commit(); Store.flush();
      go('results');
    } else { Store.flush(); go('fixdone'); }
  }
}

document.addEventListener('keydown', function (e) {
  if (view !== 'quiz' || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (e.key === 'Enter') {
    const inAnswer = tag === 'BUTTON' && e.target.matches('.qbody .opt, .qbody .chip, .qbody .slot');
    if (!inAnswer && (tag === 'BUTTON' || tag === 'SELECT' || tag === 'SUMMARY' || tag === 'A')) return;
    const b = root.querySelector('.act .btn');
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  } else if (/^[1-9]$/.test(e.key) && tag !== 'INPUT' && tag !== 'SELECT' && !locked && ctl && ctl.key) ctl.key(+e.key);
});
document.addEventListener('visibilitychange', function () { if (document.hidden) Store.flush(); });
window.addEventListener('storage', function (e) {
  if (e.key !== KEY || !e.newValue) return;
  try { const r = sane(JSON.parse(e.newValue)); if (r && r.t > S.t) adopt(r); } catch (err) {}
});

function renderResults() {
  const T = S.test, n = T.ids.length, ok = countOk(T), nBank = bankIds().length;
  if (!T.done) { openTest(); return; }
  const per = TOPICS.map(function (_, i) {
    const ids = T.ids.filter(id => QMAP.get(id).t === i + 1);
    return { t: i + 1, ids: ids, ok: ids.filter(id => T.res[id] === 1).length };
  }).filter(p => p.ids.length);
  const weak = per.filter(p => p.ok < p.ids.length).sort((a, b) => a.ok / a.ids.length - b.ok / b.ids.length || a.t - b.t);
  const fine = per.filter(p => p.ok === p.ids.length);

  const head = h('header', { class: 'mast' },
    h('p', { class: 'eyebrow' }, 'Результат теста'),
    h('div', { class: 'score' }, h('span', { class: 'big' }, String(ok)), h('span', { class: 'of' }, 'из ' + n + ' · ' + Math.round(ok / n * 100) + ' %')),
    h('p', { class: 'lvl', html: fx('Уровень подготовки $У = ' + ok + ' / ' + n + ' = ' + (ok / n).toFixed(2).replace('.', ',') + '$ при базовом образце 1,00.') }));
  const rl = h('div', { class: 'res-ruler' }, ruler(n, T.ids.map(id => T.res[id]), n),
    h('div', { class: 'ruler-cap' }, h('span', null, weak.length ? 'Красным отмечены ошибки' : 'Ни одной ошибки'), h('span', null, n + ' ' + qWord(n))));
  const actions = h('div', { class: 'actions res-actions' },
    nBank ? h('button', { class: 'btn pri', type: 'button', onclick: startFix }, 'Отработать ошибки', h('span', { class: 'cnt' }, String(nBank))) : null,
    h('button', { class: 'btn' + (nBank ? '' : ' pri'), type: 'button', onclick: startTest }, 'Пройти ещё раз'),
    h('button', { class: 'btn ghost', type: 'button', onclick: function () { go('home'); } }, 'На главную'));

  const kids = [head, rl, actions];
  if (weak.length) {
    const list = h('div', { class: 'tl' });
    weak.forEach(function (p) {
      const missed = p.ids.filter(id => T.res[id] !== 1);
      const body = h('div', { class: 'tb' },
        h('p', { class: 'note' }, 'Вопросы с ошибкой:'),
        h('ul', { class: 'miss-list' }, missed.map(id => h('li', { html: fx(QMAP.get(id).q) }))),
        cheat(p.t));
      list.append(h('details', null, h('summary', null, h('span', { class: 'no' }, String(p.t)), h('span', { class: 'ti' }, CHEAT.titles[p.t - 1]),
        h('span', { class: 'sc miss' }, h('span', { class: 'segs', 'aria-hidden': 'true' }, p.ids.map(id => h('i', { class: T.res[id] === 1 ? null : 'x' }))), ' ' + p.ok + ' / ' + p.ids.length)), body));
    });
    kids.push(h('h2', { class: 'sec-h' }, 'Что повторить'), list);
  }
  if (fine.length) kids.push(h('h2', { class: 'sec-h' }, 'Без ошибок'),
    h('p', { class: 'okline' }, fine.length === per.length ? 'Все темы пройдены без ошибок.' : 'Темы ' + fine.map(p => p.t).join(', ') + '.'));
  root.replaceChildren.apply(root, kids);
}

function renderFixDone() {
  const n = sess ? sess.total : 0;
  root.replaceChildren(
    h('header', { class: 'mast' },
      h('p', { class: 'eyebrow' }, 'Отработка ошибок'),
      h('h1', null, 'Ошибки закрыты'),
      h('p', { class: 'lead' }, 'На ' + n + ' ' + plural(n, 'вопрос', 'вопроса', 'вопросов') + ' с ошибкой теперь дан верный ответ. Список ошибок пуст — он снова пополнится после следующего теста.')),
    h('div', { class: 'home-ruler' }, ruler(Math.max(n, 1), [], Math.max(n, 1))),
    h('div', { class: 'actions res-actions' },
      h('button', { class: 'btn pri', type: 'button', onclick: startTest }, 'Новый тест'),
      h('button', { class: 'btn', type: 'button', onclick: function () { go('home'); } }, 'На главную')));
}

function start(data) {
  const local = Store.readLocal();
  if (local) S = local;
  const hs = data && data.S ? sane(data.S) : null;
  if (hs && hs.t >= S.t) S = hs;
  loadedAt = S.t;
  render();
  Store.connect();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { S: S }; }); } catch (e) {}
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

})();
</script>

</body></html>
