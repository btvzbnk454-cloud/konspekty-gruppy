<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр по налогам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
/* Layout: one narrow column, like a page of a tax form. The question is the only raised sheet; everything else lies flat on the paper. Form cells carry the numbers, a stamp gives the verdict. */
:root {
  --paper: #EEF2F0;
  --sheet: #FFFFFF;
  --ink: #16203A;
  --ink-2: #59647A;
  --rule: #D5DCE2;
  --cell: #9FAABB;
  --pen: #2B50DE;
  --pen-ink: #FFFFFF;
  --pen-soft: #E3E9FF;
  --marker: #EDF46A;
  --marker-ink: #16203A;
  --ok: #0F8458;
  --ok-soft: #DCF1E7;
  --on-ok: #FFFFFF;
  --bad: #CF3732;
  --bad-soft: #FBE3E1;
  --on-bad: #FFFFFF;
  --scrim: rgba(14, 20, 36, .5);
  --shadow: 0 1px 0 rgba(22, 32, 58, .05), 0 22px 44px -30px rgba(22, 32, 58, .5);

  --f-display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
  --f-text: "Onest", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;

  --fs-xs: 13px;
  --fs-s: 14px;
  --fs-m: 16px;
  --fs-l: 18px;
  --fs-xl: 21px;
  --fs-2xl: 26px;
  --fs-title: clamp(30px, 6.6vw, 46px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1322;
    --sheet: #161C2F;
    --ink: #E7EBF5;
    --ink-2: #A1AAC1;
    --rule: #29324A;
    --cell: #50607F;
    --pen: #8DA3FF;
    --pen-ink: #0E1322;
    --pen-soft: #212C55;
    --marker: #D6E45A;
    --marker-ink: #10141F;
    --ok: #4FCB93;
    --ok-soft: #113628;
    --on-ok: #0E1322;
    --bad: #FF7C74;
    --bad-soft: #3E1F20;
    --on-bad: #0E1322;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 22px 44px -30px rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1322;
  --sheet: #161C2F;
  --ink: #E7EBF5;
  --ink-2: #A1AAC1;
  --rule: #29324A;
  --cell: #50607F;
  --pen: #8DA3FF;
  --pen-ink: #0E1322;
  --pen-soft: #212C55;
  --marker: #D6E45A;
  --marker-ink: #10141F;
  --ok: #4FCB93;
  --ok-soft: #113628;
  --on-ok: #0E1322;
  --bad: #FF7C74;
  --bad-soft: #3E1F20;
  --on-bad: #0E1322;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 22px 44px -30px rgba(0, 0, 0, .85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: var(--fs-m);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; }
mark {
  background: linear-gradient(transparent 10%, var(--marker) 10%, var(--marker) 90%, transparent 90%);
  color: var(--marker-ink);
  padding: 0 .14em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
html.locked, html.locked body { overflow: hidden; }
.muted { font-size: var(--fs-s); color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }

.app {
  max-width: 820px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 56px;
  min-height: 100%;
  overflow-x: clip;
}
@supports not (overflow: clip) { .app { overflow-x: hidden; } }
@media (min-width: 700px) { .app { padding-inline: 32px; padding-block: 36px 72px; } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-height: 44px;
  padding: 9px 18px;
  border-radius: 10px;
  border: 1.5px solid var(--ink);
  background: transparent;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s, transform .1s;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.quiet { border-color: var(--rule); }
.btn.quiet:hover:not(:disabled) { border-color: var(--cell); }
.btn.link {
  border: 0;
  min-height: 36px;
  padding: 4px 2px;
  color: var(--ink-2);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
.btn.link:hover { color: var(--ink); }
.btn:disabled { opacity: .42; }
.btn .n { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- form cells ---------- */
.cells { display: inline-flex; gap: 3px; vertical-align: middle; }
.cell {
  display: inline-grid;
  place-items: center;
  width: 1.32em;
  height: 1.66em;
  border: 1px solid var(--cell);
  border-radius: 3px;
  background: var(--sheet);
  font-family: var(--f-display);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

/* ---------- home ---------- */
.masthead { display: grid; gap: 14px; padding-block: 0 26px; }
.form-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  margin-bottom: 6px;
  border-bottom: 1px dashed var(--cell);
  font-size: var(--fs-s);
  color: var(--ink-2);
}
.title {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: var(--fs-title);
  line-height: 1.06;
  letter-spacing: -.015em;
}
.lede { color: var(--ink-2); font-size: var(--fs-l); max-width: 36em; }

.tally {
  display: flex;
  flex-wrap: wrap;
  gap: 18px 34px;
  padding-block: 18px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.tally-item { display: grid; gap: 8px; }
.tally-item .cells { font-size: 20px; }
.tally-label { font-size: var(--fs-s); color: var(--ink-2); }

.block { padding-block: 30px 6px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--fs-l); letter-spacing: -.005em; }

.resume {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 18px;
  margin-top: 22px;
  padding: 14px 16px;
  border: 1.5px solid var(--pen);
  border-radius: 10px;
  background: var(--pen-soft);
}
.resume p { min-width: 0; }
.resume b { font-weight: 600; }

.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.plan > li {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 4px 14px;
  padding-block: 16px;
  border-bottom: 1px solid var(--rule);
}
.plan > li:last-child { border-bottom: 0; }
.plan-num { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-2xl); line-height: 1; color: var(--pen); padding-top: 2px; }
.plan-body { display: grid; gap: 10px; min-width: 0; }
.plan-title { font-weight: 600; font-size: var(--fs-l); line-height: 1.3; }
.plan-text { color: var(--ink-2); }
.plan-meta { font-size: var(--fs-s); color: var(--ink-2); }

.topics { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.topic { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
.topic-main {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  gap: 2px 12px;
  align-items: center;
  padding: 13px 8px 13px 0;
  border: 0;
  background: transparent;
  text-align: left;
}
.topic-main:hover .topic-name { color: var(--pen); }
.topic-num { grid-row: span 2; align-self: start; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; padding-top: 1px; }
.topic-name { font-weight: 600; line-height: 1.3; transition: color .15s; }
.topic-src { grid-column: 2; font-size: var(--fs-xs); color: var(--ink-2); }
.topic-stat { grid-row: 1 / span 2; grid-column: 3; display: grid; gap: 6px; justify-items: end; }
.topic-count { font-size: var(--fs-s); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bar { display: flex; width: 92px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .b-ok { background: var(--ok); }
.bar .b-bad { background: var(--bad); }
.topic-notes {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 46px;
  border: 0;
  border-left: 1px dashed var(--rule);
  background: transparent;
  color: var(--ink-2);
}
.topic-notes:hover { color: var(--pen); }

.extra-modes { display: flex; flex-wrap: wrap; gap: 10px; }
.foot {
  margin-top: 40px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  font-size: var(--fs-s);
  color: var(--ink-2);
}
.confirm {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 12px 14px;
  border: 1.5px solid var(--bad);
  border-radius: 10px;
  background: var(--bad-soft);
  color: var(--ink);
}

@media (max-width: 600px) {
  .tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .tally-item .cells { font-size: 17px; }
  .tally-label { font-size: var(--fs-xs); line-height: 1.35; }
  .plan > li { grid-template-columns: 30px minmax(0, 1fr); gap: 4px 10px; }
  .bar { width: 58px; }
  .topic-main { grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; }
  .topic-notes { width: 42px; }
  .opt { grid-template-columns: 20px .9em minmax(0, 1fr); gap: 9px; padding: 11px 12px; }
}

/* ---------- run header ---------- */
.runbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 6;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px 12px;
  margin: -20px -16px 18px;
  padding: 10px 16px 0;
  background: var(--paper);
}
@media (min-width: 700px) { .runbar { margin: -36px -32px 22px; padding: 14px 32px 0; } }
.back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 40px;
  padding: 4px 10px 4px 4px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font-weight: 600;
}
.back:hover { background: var(--pen-soft); }
.run-title { font-weight: 600; font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-count { font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--fs-s); }
.progress { grid-column: 1 / -1; height: 3px; background: var(--rule); margin-top: 6px; }
.progress i { display: block; height: 100%; background: var(--pen); transition: width .25s; }

/* ---------- question sheet ---------- */
.sheet {
  position: relative;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 16px 16px 0;
}
@media (min-width: 700px) { .sheet { padding: 22px 30px 0; } }
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--rule);
}
.barcode { color: var(--ink); opacity: .75; }
.page-no { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--ink-2); }
.page-no .cells { font-size: 15px; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--ink-2);
  line-height: 1.4;
}
.tag.rk { background: var(--marker); border-color: var(--marker); color: var(--marker-ink); font-weight: 600; }
.tag.extra { border-style: dashed; }
.prompt { font-size: clamp(19px, 2.5vw, var(--fs-xl)); font-weight: 600; line-height: 1.38; margin-top: 12px; outline: none; }
.hint { margin-top: 6px; font-size: var(--fs-s); color: var(--ink-2); }
.answer { margin-top: 16px; }

/* single / multi */
.opts { display: grid; gap: 8px; }
.opt {
  display: grid;
  grid-template-columns: 22px 1.1em minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  background: transparent;
  text-align: left;
  line-height: 1.45;
  transition: border-color .12s, background-color .12s;
}
.opt:hover:not(:disabled) { border-color: var(--cell); }
.opt:disabled { cursor: default; }
.opt .box {
  width: 20px;
  height: 20px;
  margin-top: 1px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--cell);
  border-radius: 50%;
  color: var(--pen-ink);
}
.opts.multi .box { border-radius: 4px; }
.opt .let { font-weight: 600; color: var(--ink-2); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-pressed="true"] .box { border-color: var(--pen); background: var(--pen); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ok .box { border-color: var(--ok); background: var(--ok); color: var(--on-ok); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-bad .box { border-color: var(--bad); background: var(--bad); color: var(--on-bad); }
.opt.is-miss { border-color: var(--ok); border-style: dashed; }
.opt.is-miss .box { border-color: var(--ok); color: var(--ok); }
.opt.is-dim { opacity: .62; }

/* true / false */
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfb {
  min-height: 64px;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  background: transparent;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: var(--fs-m);
}
.tfb:hover:not(:disabled) { border-color: var(--cell); }
.tfb[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); color: var(--pen); }
.tfb.is-ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.tfb.is-bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.tfb:disabled { cursor: default; }

/* match */
.match { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 6px 12px; align-items: center; }
@media (max-width: 620px) { .mrow { grid-template-columns: 1fr; } }
.mleft { font-weight: 600; line-height: 1.35; }
.mpick {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  border: 1.5px dashed var(--cell);
  border-radius: 10px;
  background: transparent;
  text-align: left;
  line-height: 1.4;
  color: var(--ink-2);
}
.mpick .chev { flex: 0 0 auto; }
.mpick.filled { border-style: solid; border-color: var(--pen); background: var(--pen-soft); color: var(--ink); }
.mpick.is-ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
.mpick.is-bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.mpick:disabled { cursor: default; }
.fix { grid-column: 1 / -1; font-size: var(--fs-s); color: var(--ok); font-weight: 500; }
@media (min-width: 621px) { .fix { grid-column: 2; } }

/* picker dialog */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--scrim);
}
@media (min-width: 700px) { .scrim { align-items: center; } }
.picker {
  width: min(620px, 100%);
  max-height: min(82vh, 680px);
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.picker-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 12px; }
.picker-title { font-weight: 600; font-size: var(--fs-l); line-height: 1.3; }
.picker-sub { font-size: var(--fs-s); color: var(--ink-2); }
.picker ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pick-opt {
  display: grid;
  gap: 2px;
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  background: transparent;
  text-align: left;
  line-height: 1.4;
}
.pick-opt:hover { border-color: var(--pen); }
.pick-opt[aria-selected="true"] { border-color: var(--pen); background: var(--pen-soft); }
.pick-opt .used { font-size: var(--fs-xs); color: var(--ink-2); }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--pen-soft); color: var(--ink); }

/* sort: pills on phones, a form table with tick boxes on wider screens */
.sort { display: grid; border-top: 1px solid var(--rule); }
.sort-head { display: none; }
.srow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 11px; border-bottom: 1px solid var(--rule); }
.stext { flex: 1 1 210px; min-width: 0; font-weight: 500; line-height: 1.4; }
.spills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  min-height: 38px;
  padding: 6px 13px;
  border: 1.5px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  font-size: var(--fs-s);
  font-weight: 500;
  line-height: 1.25;
}
.pill .pbox { display: none; }
.pill:hover:not(:disabled) { border-color: var(--cell); }
.pill[aria-pressed="true"] { border-color: var(--pen); background: var(--pen); color: var(--pen-ink); }
.pill.is-ok { border-color: var(--ok); background: var(--ok); color: var(--on-ok); }
.pill.is-bad { border-color: var(--bad); background: var(--bad); color: var(--on-bad); text-decoration: line-through; }
.pill.is-miss { border-color: var(--ok); border-style: dashed; color: var(--ok); }
.pill:disabled { cursor: default; }
@media (min-width: 700px) {
  .sort { border-top: 0; }
  .sort-head, .srow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--nb), var(--cw)); column-gap: 4px; }
  .sort-head {
    align-items: end;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    font-size: var(--fs-xs);
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink-2);
    text-align: center;
    text-wrap: balance;
  }
  .srow { align-items: center; padding-block: 6px; }
  .spills { display: contents; }
  .pill, .pill[aria-pressed="true"], .pill.is-ok, .pill.is-bad, .pill.is-miss {
    display: grid;

.stamp {

      x: 'В конспекте принципы Смита названы фундаментальными (экономическими), но не перечислены. Классический список: **справедливость** (равномерность), **определённость**, **удобство**, **экономичность** (дешевизна взимания).' },
    { id: 'pri-st3', t: 'pri', h: 'Принципы налоговой системы РФ (ст. 3 НК)', src: 'Конспект 1',
      x: '• **Всеобщность** — каждое лицо платит законно установленные налоги; учитывается фактическая способность к уплате\n• **Равенство** — налоги не могут быть дискриминационными по социальным, расовым, национальным, религиозным признакам\n• **Экономическая обоснованность** — у налога есть экономическое основание, он не может быть произвольным\n• **Единство экономического пространства** — нельзя ограничивать перемещение товаров, работ, услуг и денег по территории РФ\n• **Налоговый федерализм** — нельзя обязать платить налоги, не предусмотренные НК РФ\n• **Определённость** — определены все обязательные элементы (ст. 17 НК), каждый точно знает, что, когда и как платить\n• **Признание правоты налогоплательщика** — неустранимые сомнения толкуются в его пользу\nПринципы **удобства и экономичности** применяются по умолчанию, но в закон их не вносят.' },

    { id: 'elm-17', t: 'elm', h: 'Когда налог установлен (ст. 17 НК)', src: 'Конспекты 1 и 3',
      x: 'Налог считается установленным, когда определены налогоплательщики и **обязательные элементы**: объект, налоговая база, налоговая ставка, налоговый период, порядок исчисления, порядок и сроки уплаты.\n**Необязательные** элементы: налоговая льгота, источник налога, единица обложения (масштаб налога), налоговый оклад, отчётный период.' },
    { id: 'elm-defs', t: 'elm', h: 'Основные понятия', src: 'Конспекты 1 и 3',
      x: '• **Субъект** (налогоплательщик) — лицо, обязанное платить налог при наличии объекта\n• **Объект** — предмет, действие, результат, подлежащие налогообложению\n• **Налоговая база** — стоимостная, физическая или иная характеристика объекта, к которой применяется ставка\n• **Налоговый период** — календарный год или иной период, по окончании которого определяется база и исчисляется налог; может состоять из отчётных периодов (ст. 55 НК)\n• **Налоговый агент** — лицо, которое исчисляет, удерживает и перечисляет налог за налогоплательщика\n• **Налоговая льгота** — полное или частичное освобождение от уплаты налога' },
    { id: 'elm-object', t: 'elm', h: 'Объект налогообложения (ст. 38 НК)', src: 'НК РФ, тест 2',
      x: 'Объектом могут быть реализация товаров (работ, услуг), имущество, прибыль, доход, расход или **иное обстоятельство, имеющее стоимостную, количественную или физическую характеристику**, с наличием которого закон связывает обязанность уплатить налог.' },
    { id: 'elm-rate', t: 'elm', h: 'Налоговая ставка', src: 'Конспект 3',
      x: '**Налоговая ставка** — величина налоговых начислений на единицу измерения налоговой базы (ст. 53 НК). Бывает в **абсолютном размере** (рубли за тонну, за сотку), в **процентах** к базе или **комбинированной**.\nСтавки федеральных налогов устанавливает **НК РФ**, региональных и местных — **законы субъектов РФ и акты представительных органов муниципальных образований** в пределах, установленных НК.' },
    { id: 'elm-unit', t: 'elm', h: 'Единица обложения и налоговый оклад', src: 'Конспект 3',
      x: '**Единица обложения** (масштаб налога) — единица измерения объекта, принятая за основу расчёта: 1 рубль дохода, 0,01 га или 1 м² земли.\n**Сумма налога** (налоговый оклад) — сумма, которую плательщик вносит в бюджет по одному налогу: налоговая база × налоговая ставка.' },
    { id: 'elm-pay', t: 'elm', h: 'Как уплачивают налог', src: 'Конспект 3',
      x: '• **У источника выплаты дохода** — налог исчисляет, удерживает и перечисляет налоговый агент; плательщик получает доход уже за вычетом налога\n• **По декларации** — плательщик сам в срок подаёт заявление о своих налоговых обязательствах\n**Налоговая декларация** — письменное или электронное (с УКЭП, через личный кабинет) заявление об объектах, доходах и расходах, базе, льготах, исчисленной сумме налога. Подаётся каждым налогоплательщиком по каждому налогу. Уплата — в наличной или безналичной форме.' },
    { id: 'elm-notice', t: 'elm', h: 'Налоговое уведомление', src: 'Конспект 3',
      x: 'Письменное извещение об обязанности уплатить налог в срок: сумма, срок, объект, база, реквизиты; может включать несколько налогов. Направляется **заказным письмом** (считается полученным **через 6 дней** с даты отправления) или через личный кабинет.\n**Сроки уплаты** задают календарной датой, истечением периода или указанием на событие. Изменить срок можно отсрочкой, рассрочкой или инвестиционным налоговым кредитом.' },
    { id: 'elm-prog', t: 'elm', h: 'Пропорциональные, прогрессивные, регрессивные', src: 'Конспект 1',
      x: '• **Пропорциональный** — ставка не зависит от величины базы; по конспекту так устроено большинство налогов РФ (налог на прибыль, НДС)\n• **Прогрессивный** — ставка растёт с ростом базы: транспортный налог, налог на имущество физлиц по инвентаризационной стоимости\n• **Регрессивный** — ставка снижается с ростом базы: единый социальный налог до 2010 г.\nПо НДФЛ конспект устарел: с 2021 г. у него прогрессивная шкала, с 2025 г. пять ступеней от 13 до 22 %.' },

    { id: 'sys-levels', t: 'sys', h: 'Три уровня налогов (по конспекту)', src: 'Конспект 1',
      x: '• **Федеральные** (ст. 13 НК): НДС, налог на прибыль организаций, НДФЛ, акцизы, НДПИ, водный налог, налог на дополнительный доход от добычи углеводородного сырья\n• **Региональные** (ст. 14): налог на имущество организаций, транспортный налог, налог на игорный бизнес\n• **Местные** (ст. 15): налог на имущество физических лиц, земельный налог, торговый сбор\nРегиональные налоги обязательны к уплате на территории **субъекта РФ**, местные — на территории **муниципального образования**.' },
    { id: 'sys-spec', t: 'sys', h: 'Специальные налоговые режимы (ст. 18 НК)', src: 'Конспект 1',
      x: '**Спецрежим** — особый, более льготный по сравнению с общим режимом порядок уплаты налогов для отдельных категорий налогоплательщиков.\nПо конспекту: **ЕСХН, УСН, патентная система, налог на профессиональный доход** (эксперимент), **автоматизированная УСН** (эксперимент). В ст. 18 НК есть ещё система налогообложения при выполнении соглашений о разделе продукции.' },
    { id: 'sys-system', t: 'sys', h: 'Система налогов и налоговая система', src: 'Конспект 1',
      x: '**Система налогов** — совокупность налогов, сборов и других обязательных платежей, взимаемых на определённой территории.\n**Налоговая система** — совокупность всех налогов и сборов, методы и принципы их построения, способы исчисления и взимания, налоговый контроль, устанавливаемые в законодательном порядке.\nПонятия не тождественны: **налоговая система шире** и включает систему налогов.' },
    { id: 'sys-org', t: 'sys', h: 'Кто управляет и по какому закону', src: 'Конспект 1',
      x: 'Контроль за исчислением и уплатой налогов ведёт **ФНС России**, её деятельность координирует **Минфин России**; у ФНС есть территориальные подразделения.\nГлавный закон — **НК РФ**: часть 1 — общие понятия, права, обязанности и ответственность участников; часть 2 — порядок исчисления и уплаты конкретных налогов, сборов, страховых взносов и спецрежимы.' },
    { id: 'sys-subj', t: 'sys', h: 'Классификация по субъекту уплаты (таблица)', src: 'Конспект 3',
      x: '• **С юридических лиц**: НДС, акцизы, налог на прибыль, сборы за пользование объектами животного мира и водных биоресурсов, водный налог, налоги и сборы при соглашениях о разделе продукции, налог на дополнительный доход от добычи углеводородного сырья, НДПИ, налог на игорный бизнес, налог на имущество организаций\n• **С физических лиц**: НДФЛ, налог на имущество физических лиц, патентная система, налог на профессиональный доход\n• **И с тех, и с других**: госпошлина, транспортный налог, земельный налог, торговый сбор, ЕСХН, УСН' },

    { id: 'mex-scheme', t: 'mex', h: 'Схема управления налогообложением', src: 'Конспект 1',
      x: '• **Субъект управления** — государственные органы власти и управления: стратегическое управление (Президент РФ, аппарат Президента, Правительство РФ) и текущее (финансовые и налоговые органы)\n• **Формы и методы** — налоговый механизм\n• **Объект управления** — совокупность налоговых отношений, то есть налоговая система\n• **Результат** — налоговая политика: тактика и стратегия, три типа политики' },
    { id: 'mex-def', t: 'mex', h: 'Налоговый механизм', src: 'Конспект 1',
      x: '**Налоговый механизм** — система форм и методов использования государством на практике потенциала экономической категории «налог» для реализации налоговой политики.\nЭлементы: налоговая **информация**; налоговое **планирование и прогнозирование**; налоговое **регулирование**; налоговое **право**; налоговый **контроль**.' },
    { id: 'mex-elems', t: 'mex', h: 'Элементы механизма подробно', src: 'Конспект 1',
      x: '• **Информация** — бухгалтерская, налоговая, статистическая отчётность; без неё нет грамотных решений\n• **Планирование и прогнозирование** — обоснование бюджетных заданий: текущее (на один финансовый год, тактика) и стратегическое (на отдалённую перспективу)\n• **Регулирование** — один из самых мобильных элементов; стержень — экономические меры оперативного вмешательства в ход выполнения налоговых обязательств\n• **Право** — нормы и акты о налогах\n• **Контроль** — элемент финансового контроля, охватывает систему по вертикали и горизонтали' },
    { id: 'mex-methods', t: 'mex', h: 'Методы налогового регулирования', src: 'Конспект 1',
      x: '• **Отсрочка и рассрочка** — перенос срока до 1 года с единовременной или поэтапной уплатой; обычно под 1/2 ставки рефинансирования или без процентов\n• **Инвестиционный налоговый кредит** — уменьшение платежей с последующей поэтапной уплатой кредита и процентов (от 1/2 до 3/4 ставки рефинансирования)\n• **Налоговые каникулы** — полное или частичное освобождение от налогов на срок\n• **Налоговая амнистия** — освобождение от ответственности тех, кто задекларировал ранее скрытые доходы\n• **Налоговые вычеты** — уменьшение базы на установленную сумму\n• **Договоры об избежании двойного налогообложения** — налоги с финансового результата платятся в стране резидентства, косвенные — в стране потребления\n• **Выбор и установление ставок** — повышение дестимулирует, понижение стимулирует\nДве сферы регулирования: **льготы** и **санкции** (штрафы, пени, доначисление налогов).' },

    { id: 'mir-load', t: 'mir', h: 'По уровню налоговой нагрузки', src: 'Конспект 1',
      x: '• **Фискально-либеральные** (до 30 % ВВП): США, Япония, Португалия, Австралия, большинство стран Южной Америки\n• **Фискально-умеренные** (не более 40 % ВВП): Россия, Канада, Греция, Швейцария, Испания, Германия, Великобритания\n• **Фискально-жёсткие** (чёткое перераспределение ВВП): Франция, Бельгия, Дания, Нидерланды, Швеция' },
    { id: 'mir-indirect', t: 'mir', h: 'По доле косвенных налогов', src: 'Конспект 1',
      x: '• **Преобладают прямые** (косвенных менее 35 %): Австралия, Великобритания, США, Канада, Россия\n• **Умеренная доля косвенных** (не более 50 %): Италия, Франция, Германия\n• **Преобладают косвенные** (более 50 %): Индия, Пакистан, Бразилия' },
    { id: 'mir-central', t: 'mir', h: 'По централизации полномочий', src: 'Конспект 1',
      x: '• **Централизованные** (федеральный уровень собирает более 65 %): Россия, Австрия, Франция\n• **Умеренно централизованные** (до 65 %): Индия, Австралия, Германия\n• **Децентрализованные** (до 55 %): Канада, Дания, США' },
    { id: 'mir-ineq', t: 'mir', h: 'По неравенству доходов после налогов', src: 'Конспект 1',
      x: '• **Прогрессивные** — неравенство сокращается (почти все развитые и развивающиеся страны)\n• **Регрессивные** — неравенство растёт (примеры неизвестны)\n• **Нейтральные** — неравенство не меняется (Россия)' },

    { id: 'fun-list', t: 'fun', h: 'Пять функций налогообложения', src: 'Конспект 2',
      x: '• **Фискальная** — основная: формирование и мобилизация финансовых ресурсов государства; остальные функции производны от неё\n• **Распределительная (социальная)** — перераспределение доходов между категориями населения; в Швеции, Норвегии, Швейцарии налоги почти официально считают платой богатых за социальную стабильность\n• **Регулирующая** — решение задач налоговой политики через налоговые механизмы\n• **Контрольная** — контроль за финансово-хозяйственной деятельностью, доходами и расходами; показывает, что менять в налоговой системе и бюджетной политике\n• **Поощрительная** — признание особых заслуг: льготы участникам ВОВ, Героям Советского Союза и России' },
    { id: 'fun-reg', t: 'fun', h: 'Подфункции регулирующей функции', src: 'Конспект 2',
      x: '• **Стимулирующая** — поддержка экономических процессов через льготы и освобождения\n• **Дестимулирующая** — препятствия через налоговое бремя: протекционизм, повышенные ставки\n• **Воспроизводственная (экологическая)** — средства на восстановление ресурсов: НДПИ, водный налог, сборы за пользование объектами животного мира и водных биоресурсов' },

    { id: 'cls-pk', t: 'cls', h: 'Прямые и косвенные налоги', src: 'Конспект 2',
      x: '**Прямые** взимаются непосредственно с дохода или имущества, плательщик точно знает размер налога: НДФЛ, налог на прибыль, налог на имущество организаций. Среди них **реальные** (с предполагаемого среднего дохода от объекта) и **личные** (с фактически полученного дохода).\n**Косвенные** включаются в цену товара: **индивидуальные** (акцизы на отдельные товары), **универсальные** (НДС), **фискальные монополии** (по конспекту — таможенные пошлины).\nГлавное отличие — **место формирования источника** налога. Второй критерий — возможность **переложения**: косвенный налог в итоге платит конечный потребитель, а юридический плательщик выступает сборщиком.' },
    { id: 'cls-subj', t: 'cls', h: 'По субъекту-налогоплательщику', src: 'Конспект 2',
      x: 'Налоги с **физических лиц** (НДФЛ, налог на имущество физлиц), с **предприятий и организаций** (налог на прибыль, НДС, акцизы, налог на имущество организаций) и **смешанные** (госпошлина, транспортный, земельный налог).\nГруппа называется «с предприятий и организаций», а не «с юрлиц», потому что некоторые плательщики юрлицами не являются, например **постоянные представительства иностранных организаций**.' },
    { id: 'cls-other', t: 'cls', h: 'Другие классификации', src: 'Конспект 2',
      x: '• По органу, который вводит налог: **федеральные, региональные, местные**\n• По порядку введения: **общеобязательные** (все федеральные, налог на имущество организаций и физлиц, земельный) и **факультативные** (вводятся решением властей субъекта или муниципалитета)\n• По уровню бюджета: **закреплённые** (целиком в один бюджет или фонд) и **регулирующие** (одновременно в бюджеты разных уровней в пропорции)\n• По целевой направленности: **абстрактные** (на бюджет в целом) и **целевые** (на конкретные расходы)\n• По Захарьину: **раскладочные** (контингентированные, репартиционные: сумма равна необходимому расходу и раскладывается между плательщиками) и **количественные** (долевые, квотативные: исходят из возможности плательщика)\n• **Разовые** и **систематические** (регулярные, текущие)' },

    { id: 'pol-def', t: 'pol', h: 'Налоговая политика', src: 'Конспект 2',
      x: '**Налоговая политика** — система целенаправленных действий государства в области налогообложения на основе экономических, правовых и организационно-контрольных мероприятий.\nРазвёрнуто: составная часть финансовой политики; система правовых норм и организационно-экономических мероприятий регулирующего характера, которые принимают органы государственной власти и местного самоуправления в сфере налоговых отношений с организациями и физлицами.\nОтносится к **косвенным** методам госрегулирования. Субъект — **государство**, объект — **налогообложение**.' },
    { id: 'pol-limit', t: 'pol', h: 'Предел налоговых изъятий', src: 'Конспект 2',
      x: 'Центральный вопрос налоговой политики — научное обоснование **предела налоговых изъятий**: ставки, которая не угнетает производителей и воспроизводство рабочей силы.\nДва вектора: размер **индивидуального** налогообложения (налог конкретного плательщика) и налоговое бремя на **макроуровне** (какая доля ВВП переходит государству).' },
    { id: 'pol-goals', t: 'pol', h: 'Цели и методы налоговой политики', src: 'Конспект 2',
      x: '• **Фискальная** (основная) — финансовые ресурсы государства из части ВВП\n• **Экономическая** — регулирование спроса и предложения, структурные изменения\n• **Социальная** — сглаживание неравенства доходов\n• **Стимулирующая** — инвестиции и инновации\n• **Экологическая** — охрана природы через экологические налоги и санкции\n• **Контрольная** — решения по отдельным налогам и всей системе\n• **Международная** — налоги по требованиям международных соглашений\nМетоды: изменение налоговой нагрузки, дифференцированные ставки, установление или отмена льгот.' },
    { id: 'pol-types', t: 'pol', h: 'Стратегия, тактика, три типа политики', src: 'Конспект 2',
      x: '**Стратегия** — крупномасштабные задачи, концепция развития налоговой системы; её определяют высшие органы исполнительной и законодательной власти. **Тактика** — задачи конкретного периода через своевременное изменение налоговой системы.\n• **Политика максимальных налогов** — «взять всё, что можно»; грозит «налоговой ловушкой», когда рост налогов не даёт роста доходов\n• **Политика разумных налогов** — благоприятный налоговый климат для предпринимательства\n• **Третий тип** — высокий уровень обложения при значительной социальной защите' },
    { id: 'pol-history', t: 'pol', h: 'Кейнс и 1980-е', src: 'Конспект 2',
      x: 'В послевоенные годы налоговая политика строилась по **кейнсианской концепции функциональных финансов**: расходы и налоги подчинены регулированию совокупного спроса, бюджетное равновесие приносится в жертву экономическому.\nС 1980-х налоговая политика стала ещё и средством **бездефицитности бюджета**: за счёт расширения налоговой базы, сокращения госрасходов и снижения налогов, а не роста налогового бремени.' },
    { id: 'pol-fiscal', t: 'pol', h: 'Фискальная политика и функции налоговой политики', src: 'Тесты 1 и 2',
      x: 'Политику в сфере налогообложения называют **фискальной**; монетарная — это денежно-кредитная политика.\nФункции налоговой политики из теста 2: **прогнозирование**; **выявление и устранение диспропорций** в выполнении предусмотренных бюджетом плановых заданий по налогам и сборам; **регулирование** процесса налогообложения; **контроль** за взиманием налогов и сборов. В конспекте этого списка нет, ключ собран по смыслу.' },

    { id: 'teo-list', t: 'teo', h: 'Теории налогов', src: 'Конспект 2',
      x: '• **Публичного договора** (Спиноза, Гоббс, Руссо, Радищев): налог — плата гражданина государству по договору за охрану, защиту и другие услуги\n• **Атомистическая** (Монтескье, Вобан): налог — плата за услуги, реальные и абстрактные (право жить в цивилизованном обществе)\n• **Теория удобств** (Сисмонди): налог — цена за наслаждение общественным порядком, правосудием, свободой и правом собственности\n• **Теория страхования** (Тьер, Жирарден, Мак-Куллох): налог — страховой платёж на случай риска; финансирует оборону и правопорядок\n• **Налогового нейтралитета** (А. Смит, Д. Рикардо): налоги только пополняют казну, регулировать ими экономику нельзя\n• **Кейнсианская** (Дж. Кейнс): налог — главный рычаг регулирования экономики\n• **Теория жертвы** (Б. Г. Мильгаузен): налог — пожертвование подданных государству' },
    { id: 'teo-laffer', t: 'teo', h: 'Кривая Лаффера', src: 'Конспект 2, рис. 1',
      x: 'Профессор **А. Лаффер** (середина 1970-х) — **теория экономики предложения**. По вертикали ставка T от 0 до 100 %, по горизонтали доходы бюджета Д.\nДоходы максимальны (**Дmax**) в точке A при предельной ставке **Tmax**. Ниже Tmax — **нормальная зона**, выше — **запретная**: там снижение ставки увеличивает доходы. При ставке 0 % и 100 % доходы равны нулю.\nВывод: более низкие ставки совместимы с прежними и даже возросшими поступлениями. Ведущие налоги развитых стран — **подоходный** (с прогрессивным обложением) и **НДС**.' },
    { id: 'teo-burden', t: 'teo', h: 'Налоговое бремя', src: 'Конспект 2',
      x: '**Налоговое бремя** — показатель, характеризующий уровень уплачиваемых налогов, сборов, иных фискальных платежей. В законодательстве РФ этого понятия **нет**; ближайшее — **налоговая нагрузка**, её ФНС использует как один из основных критериев выбора плательщика для **выездной проверки**.\nУровень бремени = сумма подлежащих уплате налогов / величина полученных доходов × 100 %.\nИзбыточное бремя делает бизнес неэффективным и в итоге уменьшает поступления. Государство ищет баланс интересов, перекладывает бремя на более платёжеспособных или повышает платежи, которые легче администрировать (например, НДС).' },
    { id: 'teo-worker', t: 'teo', h: 'Бремя с зарплаты', src: 'Конспект 2',
      x: 'С зарплаты работник платит **НДФЛ** (13 % и более), работодатель — **страховые взносы**. Общее фискальное бремя физлица шире НДФЛ: в него входят налоги на имущество, землю и транспорт.' },

    { id: 'ctl-def', t: 'ctl', h: 'Налоговый контроль и учёт', src: 'Конспект 3',
      x: '**Налоговый контроль** — совокупность мероприятий налоговых и иных уполномоченных органов, направленных на выявление нарушений законодательства о налогах и сборах и на их предотвращение.\nФормы: **налоговые проверки**; **получение объяснений** налогоплательщиков, налоговых агентов, плательщиков сбора; **проверки данных учёта и отчётности**; **осмотр помещений и территорий**, используемых для извлечения дохода; **налоговый мониторинг**; другие формы по НК.\nНа учёт встают по месту нахождения организации и её обособленных подразделений, месту жительства физлица, месту нахождения недвижимости и транспортных средств.' },
    { id: 'ctl-cam', t: 'ctl', h: 'Камеральная проверка', src: 'Конспект 3',
      x: 'Проводится **по месту нахождения налогового органа** на основе деклараций и документов, представленных плательщиком, и других документов о его деятельности, **без специального решения** руководителя. Срок — **не более 3 месяцев** со дня представления документов.\nВ НК есть исключение, которого нет в конспекте: декларацию по НДС проверяют 2 месяца с возможным продлением до 3.' },
    { id: 'ctl-field', t: 'ctl', h: 'Выездная проверка', src: 'Конспект 3',
      x: 'Проводится **на территории налогоплательщика** на основании **решения руководителя** (заместителя) налогового органа; если помещения нет — в налоговом органе. Длится **не более 2 месяцев**, продление до **4**, в исключительных случаях до **6** месяцев.\n• В последний день — **справка** о проведённой проверке (при уклонении её шлют заказным письмом)\n• Не позднее **2 месяцев** после справки — **акт**: факты нарушений, содержание проверки, выводы и предложения\n• Несогласный плательщик подаёт **возражения**\n• Руководитель рассматривает материалы **в течение 10 дней** и выносит **решение**\n• Плательщику направляют **требование** об уплате недоимки и пени' },
    { id: 'ctl-class', t: 'ctl', h: 'Классификация проверок', src: 'Конспект 3',
      x: '• **По методу проведения**: **сплошные** (все документы без ограничений; при небольшом объёме документов или чтобы восстановить учёт) и **фрагментарные** (документы выборочно)\n• **По объёму вопросов**: **комплексные** (вся деятельность по всем налогам за период), **выборочные** (исчисление и уплата отдельных налогов), **целевые** (отдельные направления или операции: взаиморасчёты, внешнеэкономические сделки)' },
    { id: 'ctl-price', t: 'ctl', h: 'Цена для целей налогообложения (ст. 40 НК)', src: 'Конспект 3',
      x: 'Принимается **цена, указанная сторонами**; пока не доказано обратное, она считается рыночной. Налоговый орган вправе проверить цены, только если:\n• сделка между **взаимозависимыми лицами**\n• **товарообменные** (бартерные) операции\n• **внешнеторговые** сделки\n• отклонение **более чем на 20 %** вверх или вниз от цен плательщика по идентичным (однородным) товарам за непродолжительный период\nОтклонение допустимо из-за **сезонных колебаний спроса**, **потери качества**, **истечения сроков годности**, **маркетинговой политики** (новые рынки, товары без аналогов), **реализации опытных образцов**.\nС 2012 г. контроль цен по сделкам ведут по разделу V.1 НК, ст. 40 осталась для старых сделок.' },
    { id: 'ctl-uchet', t: 'ctl', h: 'Постановка физлица на учёт', src: 'НК РФ, тест 3',
      x: 'По заявлению физического лица налоговый орган ставит его на учёт **в течение 5 дней** со дня получения заявления (п. 2 ст. 84 НК).' },

    { id: 'srk-main', t: 'srk', h: 'Изменение срока уплаты', src: 'Конспект 3',
      x: 'Перенос установленного срока уплаты на более поздний. Формы: **отсрочка**, **рассрочка**, **инвестиционный налоговый кредит**. Срок меняют для всей суммы налога или её части.\nСрок **не может быть изменён**, если:\n• возбуждено **уголовное дело** по налоговому преступлению\n• идёт **производство по делу** о налоговом или административном правонарушении в области налогов, сборов, таможенного дела\n• есть основания полагать, что лицо **скроет** деньги или имущество либо **уедет за границу** на ПМЖ\n• в течение **3 лет** до заявления ранее предоставленную отсрочку, рассрочку или ИНК прекращали из-за нарушения условий' },
    { id: 'srk-otsr', t: 'srk', h: 'Отсрочка и рассрочка', src: 'Конспект 3',
      x: 'На срок **не более 1 года** с **единовременной** (отсрочка) или **поэтапной** (рассрочка) уплатой. Проценты — **1/2 ставки рефинансирования** ЦБ; по основаниям 1 и 2 проценты не начисляются.\nОснования (хотя бы одно):\n• 1) ущерб от стихийного бедствия, технологической катастрофы, непреодолимой силы\n• 2) задержка финансирования из бюджета или оплаты госзаказа\n• 3) угроза банкротства при единовременной уплате\n• 4) имущественное положение физлица исключает единовременную уплату\n• 5) сезонный характер производства или реализации\n• 6) перемещение товаров через таможенную границу\n• 7) невозможность единовременно уплатить налоги, пени, штрафы по итогам налоговой проверки' },
    { id: 'srk-ink', t: 'srk', h: 'Инвестиционный налоговый кредит', src: 'Конспект 3',
      x: 'Предоставляется **организации** по **налогу на прибыль**, **региональным и местным** налогам на срок **от 1 года до 5 лет**. Проценты — **не менее 1/2 и не более 3/4** ставки рефинансирования ЦБ.\nОснования:\n• 1) НИОКР или техническое перевооружение производства (в том числе рабочие места для инвалидов, защита окружающей среды, энергоэффективность)\n• 2) внедренческая или инновационная деятельность\n• 3) особо важный заказ по развитию региона или особо важные услуги населению\n• 4) государственный оборонный заказ\n• 5) инвестиции в объекты наивысшего класса энергоэффективности\n• 6) резидент **зоны территориального развития** — ИНК **до 10 лет**' },

    { id: 'otv-vidy', t: 'otv', h: 'Три вида ответственности', src: 'Конспект 3',
      x: '• **Уголовная** — УК РФ: ст. 198 (уклонение физлица от уплаты налогов, сборов, страховых взносов), ст. 199 (уклонение организации), ст. 199.1 (неисполнение обязанностей налогового агента), ст. 199.2 (сокрытие денег или имущества организации или ИП, за счёт которых должно производиться взыскание налогов)\n• **Административная** — **гл. 15 КоАП РФ**; отвечают физлица, должностные лица, юрлица\n• **Налоговая** — финансовые санкции по **гл. 16 НК РФ**' },
    { id: 'otv-nalog', t: 'otv', h: 'Налоговая ответственность', src: 'Конспект 3',
      x: '**Налоговое правонарушение** — противоправное деяние (действие или бездействие) налогоплательщика, налогового агента и иных лиц. **Налоговая санкция** — мера ответственности в виде **штрафа**.\nОтвечают организации и физлица, физлица — **с 16 лет**. Смягчающие и отягчающие обстоятельства — **ст. 112 НК**.\nАдминистративный штраф **не освобождает** от налоговой ответственности, а привлечение к ответственности **не освобождает** от уплаты недоимки и пени.' },
    { id: 'otv-pena', t: 'otv', h: 'Пеня', src: 'Конспект 3',
      x: '**Пеня** — сумма, которую налогоплательщик или налоговый агент платят при просрочке уплаты налога. Начисляется за **каждый календарный день** просрочки, **начиная со следующего дня** после срока уплаты (ст. 75 НК).\nСтавка — **1/300 ставки рефинансирования** ЦБ за день; для организаций при просрочке больше 30 дней с 31-го дня — **1/150**.\nВ действующей ст. 75 НК пени считают от ключевой ставки ЦБ (с 2016 г. ставка рефинансирования равна ключевой). В 2025–2026 гг. для организаций 1/150 применяется только с 31-го по 90-й день, с 91-го — снова 1/300.' },
    { id: 'otv-109', t: 'otv', h: 'Невиновность, исключающие обстоятельства, давность', src: 'Конспект 3',
      x: 'Лицо **невиновно**, пока вина не доказана; доказывают **налоговые органы**. В конспекте сказано «доказана решением суда», в действующей ст. 108 НК — «в предусмотренном Кодексом порядке».\nНе привлекают к ответственности (**ст. 109 НК**): нет события правонарушения; нет вины; лицу не исполнилось **16 лет**; истёк срок давности.\n• Срок давности привлечения — **3 года** со дня правонарушения или со следующего дня после окончания налогового периода\n• Иск о взыскании санкции (по конспекту) — не позднее **6 месяцев** со дня обнаружения нарушения и составления акта\n• Лицо считается подвергнутым санкции **12 месяцев** с вступления решения в силу' },
    { id: 'otv-fines', t: 'otv', h: 'Штрафы и переплата', src: 'НК РФ, тест 3',
      x: '• Нарушение срока подачи заявления о постановке на учёт — **10 000 ₽** (п. 1 ст. 116 НК)\n• Деятельность без постановки на учёт — **10 % от доходов**, но не менее **40 000 ₽** (п. 2 ст. 116)\n• Нарушение способа подачи декларации в электронной форме — **200 ₽** (ст. 119.1)\n• Об излишней уплате налоговый орган сообщает **в течение 10 дней** со дня обнаружения; заявление о возврате — **в течение 3 лет** со дня уплаты\nДве последние нормы — классическая редакция ст. 78 НК. С 2023 г. переплата формирует сальдо единого налогового счёта, и ст. 78–79 переписаны.' }

      count = Math.min(run.i + 1, run.ids.length) + ' / ' + run.ids.length;
      pct = run.ids.length ? 100 * run.i / run.ids.length : 0;

    if (run.mode === 'exam') h += '<p class="lede">' + (pass ? 'Порог в 70 % пройден.' : 'До 70 % не хватило, загляни в работу над ошибками и попробуй ещё раз.') + '</p>';

      (errsNow ? '<button type="button" class="btn primary" data-act="start" data-mode="err" data-fk="st-err">Работа над ошибками <span class="n">' + errsNow + '</span></button>' : '') +
      '<button type="button" class="btn quiet" data-act="again" data-fk="again">' + (run.mode === 'exam' ? 'Новый пробный РК' : 'Пройти ещё раз') + '</button>' +

  /* ================= actions ================= */
  function curRun() { return S.runs[view.key]; }
  function curQ() { var run = curRun(); return run ? Q[run.ids[run.i]] : null; }

  function doCheck(gaveUp) {
    var run = curRun(), q = curQ();
    if (!run || !q || cur.checked) return;
    var ok = gaveUp ? false : isCorrect(q, cur.sel);
    cur.checked = true; cur.ok = ok; cur.gaveUp = !!gaveUp; cur.anim = true; cur.ui.open = null;
    finishAnswer(run, q, ok);
  }
  function finishAnswer(run, q, ok) {
    run.res[run.i] = ok ? 1 : 0;
    run.ans[run.i] = cur.sel;
    if (cur.gaveUp) { run.gave = run.gave || {}; run.gave[run.i] = 1; }
    if (q.type === 'define') { run.txt = run.txt || {}; run.txt[run.i] = cur.ui.text || ''; }
    if (run.mode === 'err') {
      if (ok) run.fixed = (run.fixed || 0) + 1;
      else if (run.ids.slice(run.i + 1).indexOf(q.id) < 0) run.ids.push(q.id);
    }
    run.t = now();
    record(q.id, ok);
    persist();
    pendingFocus = 'next';
    render();
    cur.anim = false;
    var fb = document.getElementById('fb');
    if (fb && fb.getBoundingClientRect().top > window.innerHeight - 120) fb.scrollIntoView({ block: 'start', behavior: RM ? 'auto' : 'smooth' });
  }
  function goNext() {
    var run = curRun();
    if (!run) return;
    run.i += 1;
    run.t = now();
    if (run.i >= run.ids.length) {
      run.done = true;
      run.fin = now();
      persist();
      view = { name: 'result', key: run.key };
      render(true);
      pendingFocus = null;
      return;
    }
    persist();
    loadCur(run);
    pendingFocus = '__none';
    render(true);
    var p = document.getElementById('prompt');
    if (p) { try { p.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }
  function examNext() {
    var run = curRun(), q = curQ();
    if (!run || !q || !ready(q, cur.sel)) return;
    run.ans[run.i] = cur.sel;
    run.t = now();
    if (run.i >= run.ids.length - 1) {
      run.ids.forEach(function (id, i) {
        var ok = isCorrect(Q[id], run.ans[i]);
        run.res[i] = ok ? 1 : 0;
        record(id, ok);
      });
      run.i = run.ids.length;
      run.done = true;
      run.fin = now();
      var score = 0;
      Object.keys(run.res).forEach(function (k) { if (run.res[k] === 1) score++; });
      S.exams.unshift({ id: 'e' + run.started, at: run.fin, score: score, total: run.ids.length, dur: run.fin - run.started });
      S.exams = S.exams.slice(0, 20);
      persist();
      view = { name: 'result', key: run.key };
      render(true);
      return;
    }
    run.i += 1;
    persist();
    loadCur(run);
    render(true);
    var p = document.getElementById('prompt');
    if (p) { try { p.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }

  var handlers = {
    start: function (el) { startMode(el.dataset.mode, el.dataset.topic || null, false); },
    restart: function (el) { startMode(el.dataset.mode, el.dataset.topic || null, true); },
    resume: function (el) {
      var run = S.runs[el.dataset.key];
      if (!run) return;
      view = { name: 'run', key: run.key };
      loadCur(run);
      render(true);
    },
    again: function () {
      var run = curRun();
      if (!run) return;
      startMode(run.mode, run.topic, true);
    },
    home: function () { view = { name: 'home' }; cur = fresh(null); render(true); },
    notes: function (el) {
      view = { name: 'notes' };
      render(true);
      if (el.dataset.topic) jumpTo(el.dataset.topic);
    },
    jump: function (el) { jumpTo(el.dataset.topic); },
    shuf: function () { S.prefs.shuf = !S.prefs.shuf; S.prefs.t = now(); persist(); render(); },
    reset: function () { view.confirmReset = true; pendingFocus = 'reset-no'; render(); },
    'reset-no': function () { view.confirmReset = false; pendingFocus = 'reset'; render(); },
    'reset-yes': function () {
      var t = now();
      S = blank();
      S.reset = t;
      S.t = t;
      view = { name: 'home' };
      persist();
      render(true);
    },
    pick: function (el) {
      var q = curQ(), i = +el.dataset.i;
      if (cur.checked) return;
      if (q.type === 'multi') {
        var s = Array.isArray(cur.sel) ? cur.sel.slice() : [];
        var at = s.indexOf(i);
        if (at >= 0) s.splice(at, 1); else s.push(i);
        cur.sel = s;
      } else cur.sel = i;
      cur.touched = true;
      render();
    },
    tf: function (el) { if (cur.checked) return; cur.sel = el.dataset.v === '1'; cur.touched = true; render(); },
    mopen: function (el) {
      if (cur.checked) return;
      cur.ui.open = +el.dataset.r;
      var sel = cur.sel || [];
      var j = sel[cur.ui.open];
      pendingFocus = j != null ? 'pk' + j : 'pkx';
      render();
      if (j == null) {
        var first = app.querySelector('.pick-opt');
        if (first) first.focus();
      }
    },
    mchoose: function (el) {
      var q = curQ(), r = cur.ui.open, j = +el.dataset.j;
      var sel = Array.isArray(cur.sel) ? cur.sel.slice() : q.pairs.map(function () { return null; });
      var prev = sel[r] != null ? sel[r] : null;
      sel.forEach(function (v, rr) { if (v === j && rr !== r) sel[rr] = prev; });
      sel[r] = j;
      cur.sel = sel;
      cur.touched = true;
      cur.ui.open = null;
      var nextEmpty = -1;
      q.pairs.forEach(function (_, rr) { if (nextEmpty < 0 && rr > r && sel[rr] == null) nextEmpty = rr; });
      pendingFocus = nextEmpty >= 0 ? 'm' + nextEmpty : (ready(q, sel) ? 'act' : 'm' + r);
      render();
    },
    mclose: function () { var r = cur.ui.open; cur.ui.open = null; pendingFocus = 'm' + r; render(); },
    'mclose-bg': function (el, e) { if (e.target === el) handlers.mclose(); },
    sort: function (el) {
      if (cur.checked) return;
      var q = curQ(), k = +el.dataset.k, b = +el.dataset.b;
      var sel = Array.isArray(cur.sel) ? cur.sel.slice() : q.items.map(function () { return null; });
      sel[k] = sel[k] === b ? null : b;
      cur.sel = sel;
      cur.touched = true;
      render();
    },
    place: function (el) {
      if (cur.checked) return;
      var q = curQ();
      var sel = Array.isArray(cur.sel) ? cur.sel.slice() : [];
      sel.push(+el.dataset.k);
      cur.sel = sel;
      cur.touched = true;
      if (sel.length === q.steps.length) pendingFocus = 'act';
      else pendingFocus = null;
      render();
      if (!pendingFocus && sel.length < q.steps.length) { var f = app.querySelector('.pool-item'); if (f) f.focus(); }
    },
    unplace: function (el) {
      if (cur.checked) return;
      var pos = +el.dataset.pos;
      var sel = (cur.sel || []).slice(0, pos);
      cur.sel = sel;
      cur.touched = true;
      render();
      var f = app.querySelector('.pool-item');
      if (f) f.focus();
    },
    blank: function (el) {
      if (cur.checked) return;
      var b = +el.dataset.b;
      var sel = Array.isArray(cur.sel) ? cur.sel.slice() : [];
      if (sel[b]) sel[b] = null;
      cur.sel = sel;
      cur.ui.blank = b;
      cur.touched = true;
      render();
    },
    word: function (el) {
      if (cur.checked) return;
      var q = curQ(), n = parseFill(q).blanks.length, w = el.dataset.w;
      var sel = Array.isArray(cur.sel) ? cur.sel.slice() : [];
      var b = cur.ui.blank;
      if (b == null || b >= n) b = 0;
      sel[b] = w;
      cur.sel = sel;
      cur.touched = true;
      var next = -1;
      for (var k = 1; k <= n; k++) { var kk = (b + k) % n; if (!sel[kk]) { next = kk; break; } }
      cur.ui.blank = next >= 0 ? next : b;
      pendingFocus = ready(q, sel) ? 'act' : null;
      render();
      if (!pendingFocus) { var f = app.querySelector('.chip:not(:disabled)'); if (f) f.focus(); }
    },
    zone: function (el) {
      if (cur.checked) return;
      cur.sel = el.dataset.z;
      cur.touched = true;
      pendingFocus = 'act';
      render();
    },
    reveal: function () {
      var ta = app.querySelector('.def-input');
      if (ta) cur.ui.text = ta.value;
      cur.ui.revealed = true;
      cur.touched = true;
      pendingFocus = 'ry';
      render();
    },
    rate: function (el) {
      var run = curRun(), q = curQ();
      if (!run || !q || cur.checked) return;
      cur.rating = el.dataset.v;
      cur.sel = el.dataset.v;
      cur.checked = true;
      cur.ok = el.dataset.v === 'yes';
      cur.anim = true;
      finishAnswer(run, q, cur.ok);
    },
    check: function () { var q = curQ(); if (q && ready(q, cur.sel)) doCheck(false); },
    giveup: function () { doCheck(true); },
    next: function () { goNext(); },
    'exam-next': function () { examNext(); }
  };

  function jumpTo(id) {
    var el = document.getElementById('n-' + id);
    if (el) el.scrollIntoView({ block: 'start', behavior: RM ? 'auto' : 'smooth' });
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    if (el.disabled) return;
    var fn = handlers[el.dataset.act];
    if (fn) fn(el, e);
  });
  app.addEventListener('input', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('def-input')) { cur.ui.text = e.target.value; cur.touched = true; }
  });
  document.addEventListener('keydown', function (e) {
    if (view.name !== 'run') return;
    var t = e.target;
    var typing = t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT');
    if (cur.ui.open != null) {
      if (e.key === 'Escape') { e.preventDefault(); handlers.mclose(); }
      return;
    }
    if (typing) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    // SVG-зоны: Enter и пробел
    if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('data-act') === 'zone') {
      e.preventDefault();
      handlers.zone(t);
      return;
    }
    var run = curRun(), q = curQ();
    if (!run || !q) return;
    if (/^[1-9]$/.test(e.key) && !cur.checked && isChoice(q)) {
      var k = +e.key - 1;
      if (q.type === 'tf') {
        if (k <= 1) { cur.sel = k === 0; cur.touched = true; render(); }
      } else {
        var order = optOrder(q, run);
        if (k < order.length) handlers.pick({ dataset: { i: String(order[k]) } });
      }
      e.preventDefault();
      return;
    }
    if (e.key === 'Enter') {
      var isBtn = t && (t.tagName === 'BUTTON' || t.tagName === 'SUMMARY' || t.tagName === 'A');
      if (isBtn) return;
      e.preventDefault();
      if (run.mode === 'exam') { examNext(); return; }
      if (cur.checked) goNext();
      else if (q.type !== 'define' && ready(q, cur.sel)) doCheck(false);
    }
  });

  /* ================= pomodoro ================= */
  var PLAN = [
    { day: 'Вечер, 12 октября', note: '6 помидоров, около 3 часов', rows: [
      { id: 'e1', mode: 'rk', t: 'Вопросы с прошлых тестов', d: 'Первый проход по 29 вопросам. Не подглядывай в шпаргалку, просто отвечай и читай разбор: так видно, где пробелы.' },
      { id: 'e2', mode: 'topics', topic: 'nal-pri-elm', t: 'Налог и сбор, принципы, элементы', d: '32 вопроса, темы 1–3. Перед началом 3 минуты на шпаргалку по этим темам.' },
      { id: 'e3', mode: 'topics', topic: 'sys-mex', t: 'Система налогов РФ, налоговый механизм', d: '24 вопроса, темы 4–5. Главное — уровни налогов и спецрежимы.' },
      { id: 'e4', mode: 'topics', topic: 'mir-fun-cls', t: 'Налоговые системы стран, функции, классификация', d: '26 вопросов, темы 6–8.', lb: 1 },
      { id: 'e5', mode: 'topics', topic: 'pol-teo', t: 'Налоговая политика, теории, кривая Лаффера', d: '30 вопросов, темы 9–10. Если не успеешь, доделай в начале следующего помидора.' },
      { id: 'e6', mode: 'err', t: 'Ошибки за вечер', d: 'Всё, на что сегодня был неверный ответ. Вопрос повторяется, пока не ответишь правильно. Потом спать: сон закрепляет выученное.' }
    ] },
    { day: '13 октября', note: '10 помидоров, около 5,5 часа с перерывами', rows: [
      { id: 'd1', mode: 'err', t: 'Ошибки вчерашнего вечера', d: 'Свежая голова, повтор того, что не далось вчера. Ошибок нет — бери определения.' },
      { id: 'd2', mode: 'topic', topic: 'ctl', t: 'Налоговый контроль и проверки', d: '16 вопросов, тема 11: камеральная и выездная проверки, сроки, ст. 40.' },
      { id: 'd3', mode: 'topic', topic: 'srk', t: 'Изменение сроков уплаты', d: '11 вопросов, тема 12. В остаток помидора прочитай в шпаргалке «Что изменилось в законе».' },
      { id: 'd4', mode: 'topic', topic: 'otv', t: 'Ответственность, пени, штрафы', d: '20 вопросов, тема 13: тут больше всего цифр из теста 3.', lb: 1 },
      { id: 'd5', mode: 'rk', restart: 1, t: 'Прошлые тесты, второй проход', d: 'Те же 29 вопросов заново. Сравни результат со вчерашним.' },
      { id: 'd6', mode: 'err', t: 'Работа над ошибками', d: 'Добиваем всё, что накопилось за утро.' },
      { id: 'd7', mode: 'defs', restart: 1, t: 'Определения', d: '10 определений: напиши каждое по памяти и сверь с эталоном. Это формат вопросов «Дайте определение» из теста 2.' },
      { id: 'd8', mode: 'exam', t: 'Пробный РК', d: '20 случайных вопросов без подсказок, разбор в конце. Цель — от 70 %.', lb: 1 },
      { id: 'd9', mode: 'err', t: 'Ошибки пробного РК', d: 'Разбери промахи, перечитай карточки шпаргалки по этим темам.' },
      { id: 'd10', mode: 'exam', t: 'Финальный пробный РК', d: 'Второй пробный РК. Дальше новое не учим: короткий взгляд на шпаргалку и отдых.' }
    ] }
  ];
  var ROW = {};
  PLAN.forEach(function (d) { d.rows.forEach(function (r, i) { r.no = i + 1; ROW[r.id] = r; }); });
  var FOCUS = 25 * 60000, SHORT = 5 * 60000, LONG = 15 * 60000;
  var POMO_KEY = 'nalogi-pomo-v1';
  var P = (function () {
    try { var p = JSON.parse(window.localStorage.getItem(POMO_KEY)); if (p && p.phase) return p; } catch (e) { /* ignore */ }
    return { phase: 'idle', endAt: 0, left: 0, paused: false, row: null, count: 0 };
  })();
  function savePomo() { try { window.localStorage.setItem(POMO_KEY, JSON.stringify(P)); } catch (e) { /* ignore */ } }
  function pomoLeft() {
    if (P.phase === 'idle') return FOCUS;
    return P.paused ? P.left : Math.max(0, P.endAt - now());
  }
  function fmt(ms) { var sec = Math.ceil(ms / 1000), m = Math.floor(sec / 60), ss = sec % 60; return pad(m, 2) + ':' + pad(ss, 2); }
  function timeCells(ms) {
    var t = fmt(ms);
    return '<span class="sr">' + t + '</span><span class="cells" aria-hidden="true"><span class="cell">' + t[0] + '</span><span class="cell">' + t[1] + '</span><span class="colon">:</span><span class="cell">' + t[3] + '</span><span class="cell">' + t[4] + '</span></span>';
  }
  function phaseLabel() {
    if (P.phase === 'focus') return P.paused ? 'Пауза' : 'Помидор идёт';
    if (P.phase === 'break') return P.paused ? 'Пауза' : 'Перерыв';
    return 'Помидор 25 минут';
  }
  function pillText() { return P.phase === 'idle' ? '' : (P.phase === 'break' ? 'перерыв ' : (P.paused ? 'пауза ' : '')) + fmt(pomoLeft()); }
  var actx = null;
  function ensureAudio() {
    try {
      if (!actx) { var C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function beep() {
    if (!actx) return;
    try {
      [0, 0.32, 0.64].forEach(function (t) {
        var o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.22, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.24);
        o.connect(g); g.connect(actx.destination);
        o.start(at); o.stop(at + 0.28);
      });
    } catch (e) { /* ignore */ }
  }
  function toast(text) {
    var el = document.getElementById('pomo-toast');
    if (!el) { el = document.createElement('div'); el.id = 'pomo-toast'; el.className = 'pomo-toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.innerHTML = '<p>' + esc(text) + '</p><button type="button" class="btn quiet" id="pomo-toast-ok">Понятно</button>';
    el.hidden = false;
    document.getElementById('pomo-toast-ok').onclick = function () { el.hidden = true; };
  }
  function setDone(id, v) {
    S.pomo.done[id] = { v: v ? 1 : 0, t: now() };
    persist();
  }
  function isDone(id) { var d = S.pomo.done[id]; return !!(d && d.v); }
  function pomoStartFocus(rowId) {
    ensureAudio();
    if (P.phase === 'focus' && !P.paused) { if (rowId) { P.row = rowId; savePomo(); } return; }
    if (P.phase === 'focus' && P.paused) { P.paused = false; P.endAt = now() + P.left; if (rowId) P.row = rowId; }
    else { P.phase = 'focus'; P.paused = false; P.endAt = now() + FOCUS; P.row = rowId || null; }
    savePomo();
  }
  function phaseEnd(quiet) {
    if (P.phase === 'focus') {
      P.count = (P.count || 0) + 1;
      var r = P.row && ROW[P.row];
      if (r) setDone(r.id, true);
      var long = r ? !!r.lb : P.count % 4 === 0;
      P.phase = 'break'; P.paused = false; P.endAt = now() + (long ? LONG : SHORT);
      savePomo();
      if (!quiet) { beep(); toast('Помидор закончен. Перерыв ' + (long ? '15–20 минут' : '5 минут') + ': встань, разомнись, попей воды и не листай ленту.'); }
    } else if (P.phase === 'break') {
      P.phase = 'idle'; P.paused = false; P.row = null;
      savePomo();
      if (!quiet) { beep(); toast('Перерыв окончен. Следующий помидор ждёт в плане.'); }
    }
    if (view.name === 'home') render();
  }
  function tick() {
    if (P.phase !== 'idle' && !P.paused && now() >= P.endAt) phaseEnd(now() - P.endAt > 60000);
    var left = pomoLeft();
    var faces = document.querySelectorAll('[data-pomo-time]');
    for (var i = 0; i < faces.length; i++) faces[i].innerHTML = timeCells(left);
    var ph = document.querySelector('[data-pomo-phase]');
    if (ph) ph.textContent = phaseLabel();
    var pill = document.querySelector('[data-pomo-pill]');
    if (pill) { pill.hidden = P.phase === 'idle'; pill.textContent = pillText(); }
  }
  function pomoWidget() {
    var running = P.phase !== 'idle' && !P.paused;
    var r = P.row && ROW[P.row];
    var info = r ? 'Сейчас: ' + esc(r.t) : (P.phase === 'break' ? 'Отдыхай. Можно начать следующий помидор раньше.' : 'Нажми «Начать» у помидора в плане: таймер запустится сам.');
    var h = '<div class="pomo phase-' + P.phase + (P.paused ? ' paused' : '') + '"><div class="pomo-face" data-pomo-time>' + timeCells(pomoLeft()) + '</div>' +
      '<div class="pomo-info"><p class="pomo-phase" data-pomo-phase>' + phaseLabel() + '</p><p class="pomo-row">' + info + '</p></div><div class="btns">';
    if (running) h += '<button type="button" class="btn quiet" data-act="ppause" data-fk="ppause">Пауза</button>';
    else h += '<button type="button" class="btn ' + (P.phase === 'idle' ? 'quiet' : 'primary') + '" data-act="pstart" data-fk="pstart">' + (P.paused ? 'Продолжить' : P.phase === 'break' ? 'Новый помидор' : 'Старт') + '</button>';
    if (P.phase !== 'idle') h += '<button type="button" class="btn link" data-act="preset" data-fk="preset">Сбросить</button>';
    return h + '</div></div>';
  }
  function planHTML() {
    var next = null;
    PLAN.forEach(function (d) { d.rows.forEach(function (r) { if (!next && !isDone(r.id)) next = r.id; }); });
    var h = '<section class="block" aria-labelledby="plan-h"><div class="block-head"><h2 class="h2" id="plan-h">План по помидорам</h2></div>' +
      '<p class="plan-rule">Помидор — 25 минут только на тест, телефон экраном вниз. Потом 5 минут отдыха, после каждого четвёртого — 15–20 минут. Не закончила тему за помидор — продолжай в следующем, прогресс сохраняется.</p>' +
      pomoWidget();
    PLAN.forEach(function (d, di) {
      var doneN = d.rows.filter(function (r) { return isDone(r.id); }).length;
      h += '<div class="pday"><div class="pday-head"><h3 class="pday-title">' + esc(d.day) + '</h3><span class="pday-note">' + esc(d.note) + ', готово ' + doneN + ' из ' + d.rows.length + '</span></div><ol class="pomos">';
      d.rows.forEach(function (r) {
        var done = isDone(r.id), isNext = r.id === next, isNow = P.row === r.id && P.phase === 'focus';
        h += '<li class="prow' + (done ? ' done' : '') + (isNow ? ' now' : '') + '">' +
          '<button type="button" class="pcheck" data-act="pdone" data-row="' + r.id + '" data-fk="pd-' + r.id + '" aria-pressed="' + done + '" aria-label="Помидор ' + r.no + ' выполнен">' + (done ? I.check : '<span>' + r.no + '</span>') + '</button>' +
          '<div class="pbody"><p class="ptitle">' + esc(r.t) + (isNow ? ' <span class="pnow">идёт</span>' : '') + '</p><p class="ptext">' + esc(r.d) + '</p></div>' +
          '<button type="button" class="btn ' + (isNext ? 'primary' : 'quiet') + '" data-act="pgo" data-row="' + r.id + '" data-fk="pg-' + r.id + '">' + (done ? 'Открыть' : 'Начать') + '</button></li>';
        if (r.lb) h += '<li class="pbreak">Длинный перерыв 15–20 минут</li>';
      });
      h += '</ol></div>';
      if (di === 0) h += '<p class="pday-gap">Между днями — сон. Не учи ночью: выспаться полезнее, чем ещё один помидор.</p>';
    });
    return h + '</section>';
  }
  handlers.pstart = function () { pomoStartFocus(P.row && P.phase === 'focus' ? P.row : null); render(); };
  handlers.ppause = function () { P.left = pomoLeft(); P.paused = true; savePomo(); render(); };
  handlers.preset = function () { P.phase = 'idle'; P.paused = false; P.row = null; savePomo(); render(); };
  handlers.pdone = function (el) { var id = el.dataset.row; setDone(id, !isDone(id)); render(); };
  handlers.pgo = function (el) {
    var r = ROW[el.dataset.row];
    if (!r) return;
    if (!isDone(r.id)) pomoStartFocus(r.id);
    var key = runKey(r.mode, r.topic);
    var restart = r.restart && S.runs[key] && S.runs[key].done;
    startMode(r.mode, r.topic || null, !!restart);
  };
  setInterval(tick, 1000);

  /* ================= boot ================= */
  render();
  cloudInit();

  // Для автотестов
  window.__nalogi = {
    state: function () { return S; },
    view: function () { return view; },
    cur: function () { return cur; },
    open: function (qid) {
      var q = Q[qid];
      if (!q) return false;
      var run = makeRun('topic', q.t);
      run.i = run.ids.indexOf(qid);
      S.runs[run.key] = run;
      view = { name: 'run', key: run.key };
      loadCur(run);
      render(true);
      return true;
    }
  };
})();

</script>
