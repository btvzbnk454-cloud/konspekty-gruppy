.progress { grid-column: 1 / -1; height: 3px; background: var(--line); margin-top: 4px; }

.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

@media (max-width: 620px) { .mrow { grid-template-columns: 1fr; } }
.mleft { font-weight: 700; line-height: 1.35; }
.sel { width: 100%; min-height: 46px; padding: 9px 36px 9px 12px; border: 1.5px dashed var(--ink-2); border-radius: 4px; background: var(--sheet); line-height: 1.35; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.sel.filled { border-style: solid; border-color: var(--pen); background-color: var(--pen-soft); }

.fix { grid-column: 1 / -1; font-size: var(--fs-s); color: var(--ok); font-weight: 600; }

.srow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }

.stext { flex: 1 1 180px; min-width: 0; font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-height: 36px; padding: 5px 12px; border: 1.5px solid var(--line); border-radius: 3px; background: transparent; font-size: var(--fs-s); font-weight: 600; line-height: 1.25; }
.pill:hover:not(:disabled) { border-color: var(--ink-2); }

.pill.is-ok { border-color: var(--ok); background: var(--ok); color: var(--on-ok); }

.seq { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; }

        { l: 'τ от силы при k = 1 мм', f: 'τ_{F} = F / (π·d·0,7k)', v: tF, u: 'МПа', x: 'τ_{F}·k = ' + n(p.F, 0) + ' / (π·' + n(p.d) + '·0,7) = ' + n(tF, 1) + ' МПа·мм' },
        { l: 'Требуемый катет k', f: 'k = √(τ_{T}² + τ_{F}²) / [τ]′ (напряжения взаимно перпендикулярны)', v: k, u: 'мм', x: 'k = √(' + n(tT, 1) + '² + ' + n(tF, 1) + '²) / ' + n(p.tau) + ' = ' + n(k, 2) + ' мм' },
        { l: 'Принятый катет (округлите вверх до целого)', f: 'k ≥ расчётного', v: Math.ceil(k - 1e-9), u: 'мм', tol: 0.001, x: 'Принимаем k = ' + Math.ceil(k - 1e-9) + ' мм' }
      ];
    } });

  T.push({ id: 't14', no: 14, t: 'nat', n: 'Длина запрессовки штифта',
    orig: { dl: 30, F: 10000, d: 10, f: 0.15, E: 210000 },
    gen: function (r) { return { dl: r.pick([15, 20, 25, 30, 40]), F: r.int(5, 30) * 1000, d: r.pick([6, 8, 10, 12, 16]), f: r.pick([0.08, 0.1, 0.12, 0.15]), E: 210000 }; },
    text: function (p) { return 'Определите, штифт какой наибольшей длины можно запрессовать в плиту, если плита и штифт стальные, натяг δ = ' + n(p.dl) + ' мкм, а сила пресса F = ' + n(p.F, 0) + ' Н. Диаметр штифта d = ' + n(p.d) + ' мм, он во много раз меньше размеров плиты. Коэффициент трения при запрессовке ' + n(p.f) + ', E = ' + n(p.E, 0) + ' МПа, μ = 0,3.'; },
    steps: function (p) {
      var pr = (p.dl / 1000) / (p.d * 2 / p.E), l = p.F / (pr * PI * p.d * p.f);
      return [
        { kind: 'pick', l: 'Коэффициенты C_{1} (штифт) и C_{2} (плита)', o: ['C_{1} = 0,7; C_{2} = 1,3', 'C_{1} = 1,3; C_{2} = 0,7', 'C_{1} = 1; C_{2} = 1', 'C_{1} = 0,7; C_{2} = 0,7'], v: 0, x: 'Сплошной штифт: 1 − μ = 0,7. Плита «бесконечная»: 1 + μ = 1,3. Сумма C_{1} + C_{2} = 2.' },
        { l: 'Давление p', f: 'p = δ / (d·(C_{1} + C_{2})/E)', v: pr, u: 'МПа', x: 'p = ' + n(p.dl / 1000, 3) + ' / (' + n(p.d) + '·2/' + n(p.E, 0) + ') = ' + n(pr, 1) + ' МПа' },
        { l: 'Наибольшая длина штифта l', f: 'F = p·π·d·l·f → l = F / (p·π·d·f)', v: l, u: 'мм', x: 'l = ' + n(p.F, 0) + ' / (' + n(pr, 1) + '·π·' + n(p.d) + '·' + n(p.f) + ') = ' + n(l, 2) + ' мм' }

  T.push({ id: 't15', no: 15, t: 'sdv', lec: true, n: 'Кронштейн на двух болтах (с лекции)',

    steps: function (p) {

      return [
        { l: 'Отрывающая сила F', f: 'F = 2mg', v: F, u: 'Н', x: 'F = 2·' + n(p.m) + '·10 = ' + n(F, 0) + ' Н' },

      ];
    } });

  return { tasks: T, n: n };
})();

<script>

    var nutPts = pts.map(function (p) { return 'L' + p[0] + ' ' + (p[1] - 6); }).join(' ');

    var curve = 'M' + X0 + ' ' + Y0 + ' L118 128 L124 124 L130 130 L138 124 L146 130 L154 124 L162 130 L172 126 C 220 92, 280 66, 340 62 C 380 60, 410 72, 438 104';
    var bands = [[X0, 118, 'z1'], [118, 172, 'z2'], [172, 340, 'z3'], [340, 450, 'z4']];

  function section(k) {

      s += '<path d="M140 46 A 40 40 0 0 1 140 94" style="stroke:var(--ink);stroke-width:1.5;fill:none" marker-end="url(#arr)"/><text x="160" y="74" class="fg-txt b">T</text>';
    } else {
      s += '<rect x="40" y="18" width="34" height="104" style="fill:var(--pen-soft);stroke:var(--ink);stroke-width:1.5"/>';
      s += '<line x1="90" y1="14" x2="90" y2="126" class="fg-ink"/>';

  function bearing(k) {

      var t = a * Math.PI / 180, len;

    });
    return s + '</svg>';
  }

  return { thread: thread, tension: tension, section: section, bearing: bearing };
})();

<script>

      { h: 'Формы головок и гаек', li: ['Головки: шестигранная, шестигранная уменьшенная, квадратная, с внутренним шестигранником, цилиндрическая, потайная с крестовым шлицем, с параллельными гранями, круглая с ушком.', 'Гайки: шестигранная, шестигранная уменьшенная, корончатая, круглая шлицевая, круглая с отверстиями на торце, барашек.'] }
    ] },
    { id: 'mat', h: 'Материалы, диаграмма, запас', it: [
      { fig: 'tension', h: 'Диаграмма деформирования: 1 — упругость, 2 — площадка текучести, 3 — упрочнение, 4 — шейка и разрыв' },
      { h: 'Основные формулы', key: true, f: ['σ = F/A [Н/мм² = МПа];  ε = Δl/l;  σ = E·ε (закон Гука, только участок 1)', 'σ_{в} = F_{max}/A_{0};  E_{стали} = (2…2,1)·10⁵ МПа', '[σ] = σ_{т}/s_{т} (s_{т} ≥ 1,5 при контролируемой затяжке);  [σ] = σ_{в}/s_{в}'] },
      { h: 'Класс прочности X.Y', f: ['σ_{в} = X·100;  σ_{т} = X·Y·10.  Пример 3.6: σ_{в} = 300, σ_{т} = 180 МПа'] },
      { h: 'Материалы', li: ['Сталь — железо + углерод до 2,14 %. Ст3 — низкоуглеродистая, хорошо сваривается; Сталь 35, 45 — среднеуглеродистые (0,35 и 0,45 % C); У12 — высокоуглеродистая (1,2 % C); 08Х18Н9 — высоколегированная (0,08 % C, 18 % Cr, 9 % Ni).', 'Чугун — больше 2,14 % углерода. Бронза — медь + олово, латунь — медь + цинк: подшипники, ходовые гайки, червячные колёса.', 'Ориентируются на σ_{т}: пластические деформации в большинстве случаев недопустимы.'] }
    ] },
    { id: 'nap', h: 'Напряжения', it: [
      { h: 'Формулы', tbl: [['Нагружение', 'Напряжение', 'Распределение'], ['Растяжение', 'σ = F/A', 'равномерно'], ['Кручение', 'τ = T/W_{p}, W_{p} = πd³/16 ≈ 0,2d³', 'линейно: 0 в центре, max на поверхности'], ['Изгиб', 'σ = M/W_{x}, W_{x} = πd³/32 ≈ 0,1d³; bh²/6', 'линейно: 0 на нейтральной оси'], ['Срез', 'τ = 4F/(i·πd²)', 'условно равномерно'], ['Смятие', 'σ_{см} = F/(δ·d)', 'max посередине, к краям 0; расчёт по проекции']] },
      { fig: 'eps', h: 'Эпюры: растяжение, кручение, изгиб; смятие цилиндра' },
      { h: 'Эквивалентное напряжение', key: true, f: ['σ_{э} = √(σ² + 3τ²) — энергетическая теория прочности'] }
    ] },
    { id: 'mom', h: 'Затяжка, самоторможение, КПД', it: [
      { h: 'Момент завинчивания', key: true, f: ['T_{зав} = T_{т} + T_{р} = F_{зат}·[ f_{т}·(D_{0} + d_{0})/4 + (d_{2}/2)·tg(ψ + φ′) ]', 'φ′ = arctg(f / cos(α/2)) — метрическая;  φ = arctg f — прямоугольная', 'Без торца: F_{зат} = T / ((d_{2}/2)·tg(ψ + φ′))'] },
      { h: 'Как выводится', li: ['Гайку заменяем кубиком, виток разворачиваем по d_{2} в наклонную плоскость с углом ψ.', 'tg(ψ + φ) = F_{t}/F_{зат} → F_{t} = F_{зат}·tg(ψ + φ), T_{р} = F_{t}·d_{2}/2.', 'Трение на торце: F_{тр} = f·F_{зат} на плече (D_{0} + d_{0})/4 (давление равномерное).', 'Лабораторная №2: l_{ключа} ≈ 14d, выигрыш в силе ≈ 70.'] },
      { h: 'Самоторможение', f: ['ψ < φ′;  tg φ = f — угол наклона плоскости, при котором тело начинает скользить'], li: ['Крепёжные: ψ ≈ 2…3°, φ′ ≈ 6…10° — самоторможение с запасом. При вибрации всё равно нужны шайбы, контргайки.'] },
      { h: 'КПД', f: ['η = F·P_{h} / (2π·T) = tg ψ / tg(ψ + φ′);  у самотормозящей пары η < 0,5'] },
      { h: 'Стержень затянутого болта', key: true, f: ['σ = 4F_{зат}/(πd_{3}²),  τ = T_{р}/W_{p};  σ_{э} ≈ 1,3σ', 'Условие: 1,3·4F_{зат}/(πd_{3}²) ≤ [σ] → d_{3} ≥ √(1,3·4F_{зат}/(π[σ]))'], li: ['1,3 — учёт кручения моментом в резьбе (d_{2}/d_{3} ≈ 1,1, ψ ≈ 2°30′, f ≈ 0,15). Для незатянутого болта не ставят.'] }
    ] },
    { id: 'bolt', h: 'Расчёт болтовых соединений', it: [
      { h: 'Виды разрушения', li: ['Разрыв стержня, срез резьбы, смятие резьбы. Стандартные болты считают только на разрыв: гайка подобрана равнопрочной.', 'Жуковский: 1-й виток — 34 %, 2-й — 23 %, 3-й — 15 %, 10-й — меньше 1 %.'] },
      { h: 'Срез и смятие резьбы', src: 'учебник', f: ['τ = F/(π·d_{3}·H·K·K_{m}) ≤ [τ];  σ_{см} = F/(π·d_{2}·H_{1}·z) ≤ [σ]_{см},  z = H/P'] },
      { h: 'Сдвиг, болты с зазором', key: true, f: ['f·F_{зат}·i·z = K_{сд}·F → F_{зат} = K_{сд}·F/(f·i·z)', '1,3·4F_{зат}/(πd_{3}²) ≤ [σ]'] },
      { h: 'Сдвиг, болты без зазора', key: true, f: ['τ = 4F/(i·πd_{c}²) ≤ [τ] = (0,25…0,35)σ_{т}', 'σ_{см1} = F/(δ_{1}·d_{c});  σ_{см2} = F/((δ_{2} − h)·d_{c}) ≤ [σ]_{см} = (0,35…0,45)σ_{т}'], li: ['Отверстия развёртывают — точнее и дороже, зато болт меньше. Если δ < d_{c}/2 — обязательно проверить смятие.'] },
      { h: 'Отрыв (нагрузка перпендикулярно стыку)', key: true, f: ['F_{б} = F_{зат} + χF;  F_{д} = F_{зат} − (1 − χ)F > 0', 'χ = λ_{д}/(λ_{б} + λ_{д}),  λ = l/(EA);  F_{зат} = K·(1 − χ)·F', '(1,3F_{зат} + χF)·4/(πd_{3}²) ≤ [σ]'], li: ['Лабораторная №3: без прокладки χ = 0,34, с мягкой прокладкой 0,7 → жёсткие прокладки.'] },
      { h: 'Кронштейн на двух болтах', li: ['ΣM относительно дальнего болта: 2mg·2a = F_{2}·a → F_{2} = 4mg, F_{1} = 2mg. Расчёт по самому нагруженному.'] }
    ] },
    { id: 'svr', h: 'Изгиб и сварка', it: [
      { h: 'Изгиб', f: ['σ = M/W_{x};  прямоугольник W_{x} = bh²/6;  круг πd³/32', 'Кронштейн на стыковом шве: σ = 6FL/(bh²), τ = F/(bh), σ_{э} = √(σ² + 3τ²)'] },
      { h: 'Сварные соединения', li: ['Сварка — получение неразъёмного соединения сплавлением соприкасающихся поверхностей.', 'Соединения: стыковые, нахлёсточные, тавровые, угловые. Швы: стыковые и угловые.', 'Металл шва прочнее основного; рядом — зона термического влияния.'] },
      { h: 'Стыковой шов', key: true, f: ['Расчёт по номинальному сечению без наплыва: σ_{э} = √(σ² + 3τ²) ≤ [σ]′ = 0,9·0,65σ_{т}'] },
      { h: 'Угловой шов', key: true, f: ['Разрушение по биссектрисе, высота 0,7k; расчёт по τ:  Στ = √(τ_{м}² + τ_{F}²) ≤ [τ]′ = 0,6·0,65σ_{т}', 'Труба к стене: τ = 4FL/(πd²·0,7k);  швеллер на двух швах вдоль полок: F_{м} = FL/h, τ_{м} = F_{м}/(0,7k·b)'] }
    ] },
    { id: 'nat', h: 'Соединения с натягом', it: [
      { h: 'Давление из условия передачи нагрузки', key: true, f: ['Момент: p = 2T·K_{сд}/(π·d²·l·f);  осевая сила: p = F·K_{сд}/(π·d·l·f)'] },
      { h: 'Формула Ляме', key: true, f: ['δ = p·d·(C_{1}/E_{1} + C_{2}/E_{2})', 'C_{1} = (1 + (d_{1}/d)²)/(1 − (d_{1}/d)²) − μ_{1};  сплошной вал: 0,7', 'C_{2} = (1 + (d/d_{2})²)/(1 − (d/d_{2})²) + μ_{2};  массивная плита: 1,3'] },
      { h: 'Подбор посадки', f: ['u = K_{1}Ra_{1} + K_{2}Ra_{2};  [N]_{min} = δ + u', 'p_{max} = σ_{т2}/2·(1 − (d/d_{2})²);  [N]_{max} = p_{max}·δ/p + u', 'N_{min ф} ≥ [N]_{min};  N_{max ф} ≤ [N]_{max}'], li: ['ES, EI — отклонения отверстия; es, ei — вала. Квалитет — мера точности. Допуск TD = ES − EI.', 'Максимальные эквивалентные напряжения — на внутренней поверхности втулки.', 'Коэффициент трения зависит от материалов и способа сборки; при температурной сборке несущая способность выше.'] }
    ] },
    { id: 'shp', h: 'Шпоночные соединения', it: [
      { h: 'Призматическая шпонка', li: ['Передаёт момент между валом и втулкой. Паз во втулке по всей длине, в паз вала — с небольшим натягом.', 'b и k — по ГОСТ от диаметра вала. Шпонку делают менее прочной, чем вал.', 'Стандартные шпонки проверяют на смятие (срез обеспечен ГОСТ).'] },
      { h: 'Формулы', key: true, f: ['d ≥ ∛(16T/(π[τ]_{кр})),  [τ]_{кр} = 25…30 МПа', 'σ_{см} = 2T/(d·k·l_{раб}) ≤ [σ]_{см} = (0,5…0,7)σ_{т}', 'l_{раб} ≥ 2T/(d·k·[σ]_{см})'] }
    ] }
  ];
  function notesView() {
    var h = runbar('Шпаргалка');
    h += '<header class="mast"><h1 class="title" style="font-size:clamp(28px,6vw,42px)">Шпаргалка к РК-1</h1><p class="lede">Формулы в рамке с толстой линией — основные, их стоит знать наизусть.</p></header>';
    h += '<nav class="notes-nav">' + NOTES.map(function (s, k) { return '<button data-a="jump" data-s="' + s.id + '">' + (k + 1) + '. ' + esc(s.h) + '</button>'; }).join('') + '</nav>';
    NOTES.forEach(function (s, k) {
      h += '<section class="nsec" id="n-' + s.id + '"><h2 class="h2"><span class="no">' + (k + 1) + '</span>' + esc(s.h) + '</h2>';
      s.it.forEach(function (it) {
        h += '<div class="nitem">';
        if (it.fig) {
          h += '<h3>' + fmt(it.h) + '</h3><div class="figure">';
          if (it.fig === 'thread') h += FIG.thread(true, null);
          else if (it.fig === 'tension') h += FIG.tension(true, null);
          else h += '<div class="eps eps4">' + [FIG.section(0), FIG.section(1), FIG.section(3), FIG.bearing(1)].map(function (x) { return '<div>' + x + '</div>'; }).join('') + '</div>';
          h += '</div></div>'; return;
        }
        h += '<h3>' + fmt(it.h) + (it.src ? '<span class="src">учебник</span>' : '') + '</h3>';
        (it.f || []).forEach(function (f) { h += '<div class="fbox' + (it.key ? ' key' : '') + '">' + fmt(f) + '</div>'; });
        if (it.tbl) h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + it.tbl[0].map(function (c) { return '<th>' + fmt(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + it.tbl.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + fmt(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
        if (it.li) h += '<ul>' + it.li.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul>';
        h += '</div>';
      });
      h += '</section>';
    });
    return h;
  }

  function openGo(go) {
    if (go.m === 'notes') { view = { name: 'notes' }; render(true); setTimeout(function () { var el = document.getElementById('n-' + go.a); if (el) el.scrollIntoView(); }, 30); return; }
    startMode(go.m, go.a || '');
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-a'), run = view.name === 'run' ? S.runs[view.key] : null;
    if (b.tagName === 'SELECT' || b.tagName === 'INPUT' || b.tagName === 'TEXTAREA') return;
    switch (a) {
      case 'home': view = { name: 'home' }; render(true); return;
      case 'resume': view = { name: 'run', key: b.getAttribute('data-k') }; loadCur(S.runs[view.key]); render(true); return;
      case 'day': view.day = +b.getAttribute('data-d'); render(); return;
      case 'pcheck': var pid = b.getAttribute('data-p'); setPomoDone(pid, !pomoDone(pid)); render(); return;
      case 'pgo': startFocus(b.getAttribute('data-p')); openGo(POMOS[b.getAttribute('data-p')].go); return;
      case 'popen': openGo(POMOS[b.getAttribute('data-p')].go); return;
      case 'ppause': togglePause(); render(); return;
      case 'pstop': stopTimer(); render(); return;
      case 'tasks': view = { name: 'tasks' }; render(true); return;
      case 'notes': view = { name: 'notes' }; render(true); return;
      case 'cards': startMode('cards', 'Защита'); return;
      case 'exam': startMode('exam', '', true); return;
      case 'mix': startMode('mix', ''); return;
      case 'err': startMode('err', ''); return;
      case 'topic': startMode('topics', b.getAttribute('data-t')); return;
      case 'go': startMode(b.getAttribute('data-m'), b.getAttribute('data-g'), true); return;
      case 'jump': var el = document.getElementById('n-' + b.getAttribute('data-s')); if (el) el.scrollIntoView({ behavior: 'smooth' }); return;
      case 'reset': view.confirm = true; render(); return;
      case 'reset-no': view.confirm = false; render(); return;
      case 'reset-yes': var t = now(); S = blank(); S.reset = t; S.t = t; view.confirm = false; persist(); render(); return;
      case 'restart': if (run) startMode(run.mode, run.arg, true); return;
      case 'check': checkCur(); return;
      case 'next': nextItem(); return;
      case 'skip': nextItem(); return;
      case 'reveal': cur.ui.reveal = true; render(); return;
      case 'rate': rateCard(b.getAttribute('data-v') === '1'); return;
      case 'again': var it0 = cur.it; cur = fresh(it0, run.i); cur.ui.steps = TASK[it0.id].steps(taskParams(it0)).map(function () { return null; }); render(); focusTop(); return;
      case 'newnum': var it1 = { k: 't', id: cur.it.id, v: Math.floor(Math.random() * 1e9) + 1 }; run.items[run.i] = it1; delete run.res[run.i]; delete run.ans[run.i]; persist(); loadCur(run); render(); focusTop(); return;
      case 'showf': cur.ui.showF = cur.ui.showF || {}; cur.ui.showF[+b.getAttribute('data-k')] = true; render(); return;
    }
    if (!cur || cur.checked) return;
    var q = cur.it.k === 'q' ? Q[cur.it.id] : null;
    switch (a) {
      case 'opt':
        var o = +b.getAttribute('data-o');
        if (q.type === 'multi') { var i = cur.sel.indexOf(o); if (i >= 0) cur.sel.splice(i, 1); else cur.sel.push(o); } else cur.sel = o;
        break;
      case 'tf': cur.sel = b.getAttribute('data-v') === 'true'; break;
      case 'ep': cur.sel = +b.getAttribute('data-o'); break;
      case 'sort': cur.sel[+b.getAttribute('data-k')] = +b.getAttribute('data-b'); break;
      case 'order': cur.sel.push(+b.getAttribute('data-k')); break;
      case 'unorder': cur.sel.splice(+b.getAttribute('data-s'), 1); break;
      case 'blank': cur.ui.blank = +b.getAttribute('data-b'); if (cur.sel[cur.ui.blank] != null) cur.sel[cur.ui.blank] = null; break;
      case 'chip':
        var w = b.getAttribute('data-w'), bl = cur.ui.blank;
        if (cur.sel[bl] != null) { bl = cur.sel.indexOf(null); if (bl < 0) bl = cur.ui.blank; }
        cur.sel[bl] = w;
        var nx = cur.sel.indexOf(null); cur.ui.blank = nx >= 0 ? nx : bl;
        break;
      case 'syn': cur.ui.steps[+b.getAttribute('data-k')] = b.getAttribute('data-v') === 'true'; break;
      case 'spick': cur.ui.steps[+b.getAttribute('data-k')] = +b.getAttribute('data-o'); break;
      default: return;
    }
    cur.touched = true;
    render();
  });
  function onZone(z) {
    if (!cur || cur.checked || cur.it.k !== 'q') return;
    cur.sel = z.getAttribute('data-z'); render();
  }
  app.addEventListener('click', function (e) { var z = e.target.closest('.fg-zone'); if (z && app.querySelector('[data-hot]')) onZone(z); });
  app.addEventListener('keydown', function (e) { var z = e.target.closest && e.target.closest('.fg-zone'); if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onZone(z); } });
  app.addEventListener('change', function (e) {
    var t = e.target; if (!cur) return;
    if (t.getAttribute('data-a') === 'match' && !cur.checked) { cur.sel[+t.getAttribute('data-k')] = +t.value; render(); var nxt = document.getElementById('m' + (+t.getAttribute('data-k') + 1)); if (nxt) nxt.focus(); }
  });
  app.addEventListener('input', function (e) {
    var t = e.target, a = t.getAttribute('data-a'); if (!cur) return;
    if (a === 'num') { cur.sel = t.value; updateCheckBtn(); }
    else if (a === 'snum') { cur.ui.steps[+t.getAttribute('data-k')] = t.value; updateCheckBtn(); }
    else if (a === 'ta') cur.ui.text = t.value;
  });
  function updateCheckBtn() {
    var b = app.querySelector('[data-a="check"]'); if (!b) return;
    var it = cur.it, ok;
    if (it.k === 'q') ok = ready(Q[it.id], cur.sel);
    else { var st = TASK[it.id].steps(taskParams(it)); ok = st.every(function (s, k) { return stepReady(s, cur.ui.steps[k]); }); }
    b.disabled = !ok;
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-a="toast-x"]'); if (b) { toastMsg = null; showToast(); } });
  document.addEventListener('keydown', function (e) {
    if (view.name !== 'run' || e.key !== 'Enter' || e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
    var tg = e.target;
    if (tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT') return;
    if (tg.tagName === 'BUTTON' && !tg.classList.contains('prompt')) return;
    var run = S.runs[view.key]; if (!run || run.done || !cur) return;
    if (tg.tagName === 'INPUT' && tg.getAttribute('data-a') === 'snum') {
      var k = +tg.getAttribute('data-k'), nextIn = document.getElementById('st' + (k + 1));
      if (nextIn && !cur.checked) { e.preventDefault(); nextIn.focus(); return; }
    }
    e.preventDefault();
    if (cur.it.k === 'c') { if (!cur.ui.reveal) { cur.ui.reveal = true; render(); } return; }
    if (!cur.checked) checkCur(); else nextItem();
  });

  render();
  cloudInit();
})();

</script>
