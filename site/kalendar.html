<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>а может просто списать...</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2322221a'/%3E%3Cpath d='M7 9h7l2 3h9v11H7z' fill='%23e7e3c1'/%3E%3Ccircle cx='24' cy='22' r='3' fill='%23e8742a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#22221a; --bg2:#2b2b21; --well:#1c1c15; --paper:#e7e3c1; --paper2:#d8d3ab; --paper3:#c9c39a;
  --ink:#2a291e; --ink2:#5f5c46; --on-dark:#d9d5b4; --on-dark2:#8f8b70;
  --orange:#e8742a; --red:#cf4436; --blue:#4c94a6;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--on-dark);
  background:radial-gradient(ellipse at 50% 30%,#34342a 0%,var(--bg) 70%) fixed,var(--bg);
  font:14px/1.45 "IBM Plex Mono","PT Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}
.frame{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.topbar{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--on-dark2);padding-bottom:10px}
.key{flex:none;border:1px solid var(--on-dark);border-radius:3px;padding:0 6px;font-size:11px;color:var(--on-dark);background:none;font-family:inherit}
button.key{cursor:pointer}
button.key:hover{border-color:var(--orange);color:var(--orange)}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;align-items:baseline}
.nav a{padding:2px 12px;color:var(--on-dark2);border-left:1px solid var(--on-dark2)}
.nav a::after{content:":"}
.nav a:hover{color:var(--paper)}
.nav a.on{color:var(--paper);font-size:18px;font-weight:500;line-height:1.1}
.nav a.on::before{content:"/ "}

.main{display:grid;grid-template-columns:1fr 330px;margin-top:48px}
.folder{position:relative;border:1px solid var(--on-dark);border-right:none;padding:16px 18px 18px}
.folder-tab{position:absolute;top:-1px;left:-1px;height:34px;padding:0 14px;border:1px solid var(--on-dark);border-bottom:none;border-radius:8px 8px 0 0;
  background:var(--bg2);display:flex;align-items:center;gap:14px;color:var(--paper);font-size:16px;transform:translateY(-100%)}
.folder-tab .key{font-size:10px}
#month{min-width:9.5em;text-align:center}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;color:var(--on-dark2);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--on-dark2);margin-bottom:4px}
.day{min-height:74px;background:var(--paper2);color:var(--ink);padding:4px 6px;font-size:12px;position:relative;border:1px solid var(--paper3);min-width:0}
.day.out{background:transparent;color:#5c5a48;border:1px dashed #44433a}
.day.we{background:var(--paper3)}
.day.today{outline:2px solid var(--orange);outline-offset:1px}
.day.today::after{content:"сегодня";position:absolute;right:5px;top:4px;font-size:10px;color:var(--orange);font-weight:600}
.day.ev{background:var(--paper)}
.day.past .e{border-color:var(--ink2);color:var(--ink2)}
.day .e{display:block;margin-top:4px;padding:1px 4px;border:1px solid var(--red);color:var(--red);font-size:10.5px;line-height:1.3;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.side{border:1px solid var(--on-dark);border-radius:0 8px 8px 0;padding:16px}
.side h2{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--on-dark2)}
.side h2::before{content:"/ "}
.ev-card{background:var(--paper);color:var(--ink);margin-bottom:12px;position:relative}
.ev-card::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:6px;background:var(--paper2)}
.ev-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper2);padding:4px 10px;font-size:11px;color:var(--ink2);border-bottom:1px solid var(--paper3)}
.ev-card .top b{color:var(--red)}
.ev-card h3{margin:8px 10px 0;font-size:14px;font-weight:600;border-bottom:1px solid var(--ink2);padding-bottom:5px}
.ev-card p{margin:6px 10px 10px;font-size:12px;color:var(--ink2)}
.ev-card .prep{display:flex;justify-content:space-between;gap:8px;margin:-2px 10px 10px;padding:4px 8px;border:1px solid var(--blue);font-size:12px}
.ev-card .prep:hover{border-color:var(--orange);background:var(--paper2)}
.none{font-size:12.5px;color:var(--on-dark2)}

.track{margin-top:22px;height:4px;background:repeating-linear-gradient(90deg,var(--on-dark2) 0 14px,transparent 14px 22px)}
.foot{display:flex;justify-content:space-between;margin-top:14px;font-size:11px;color:#5c5a48;letter-spacing:.08em}

@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .folder{border-right:1px solid var(--on-dark);border-radius:0 8px 0 0;padding:14px 10px}
  .side{border-radius:0 0 8px 8px;border-top:none}
  .day{min-height:52px;padding:3px}
  .day .e{font-size:0;height:6px;padding:0;background:var(--red);border:none}
  .day.past .e{background:var(--ink2)}
  .day.today::after{content:"•";right:4px}
  .topbar{gap:8px}
  .topbar>.key{display:none}
  .nav{flex-wrap:nowrap;gap:0;min-width:0}
  .nav a{white-space:nowrap;padding:2px 8px}
  .nav a.on{font-size:15px}
}
</style>
</head>
<body>
<div class="frame">

  <header class="topbar">
    <span class="key" aria-hidden="true">◂</span>
    <nav class="nav" aria-label="Разделы">
      <a href="./">Материалы</a>
      <a class="on" href="kalendar.html" aria-current="page">Календарь</a>
    </nav>
    <span class="key" aria-hidden="true">▸</span>
  </header>

  <div class="main">
    <section class="folder">
      <div class="folder-tab">
        <button class="key" id="prev" aria-label="Предыдущий месяц">◂</button>
        <span id="month" aria-live="polite"></span>
        <button class="key" id="next" aria-label="Следующий месяц">▸</button>
      </div>
      <div class="cal" id="cal"></div>
    </section>

    <aside class="side">
      <h2>Ближайшие:</h2>
      <div id="upcoming"></div>
    </aside>
  </div>

  <div class="track"></div>
  <div class="foot" aria-hidden="true"><span>◂ ◆ ▸</span><span>V.2</span></div>
</div>

<script>
// Чтобы добавить событие, допиши строку сюда.
// date — дата (ГГГГ-ММ-ДД), kind — РК, Зачёт или Экзамен.
// prep — материал для подготовки: название и файл из папки m/. Если материала нет, строку prep можно не писать.
const EVENTS = [
  { date:"2026-10-30", kind:"РК", subject:"Основы проектно-конструкторской деятельности",
    prep:{ title:"Тренажёр по соединениям", file:"soedineniya-trenazher.html" } },
  { date:"2026-10-30", kind:"РК", subject:"Финансовый анализ",
    prep:{ title:"Билеты по финанализу", file:"finanaliz-bilety.html" } },
];

const KIND_NAME = { "РК":"Рубежный контроль" };
const SHORT = {
  "Учёт и анализ":"Учёт", "Финансовый анализ":"Финанализ", "Налоги":"Налоги",
  "Управление качеством":"Качество", "Основы проектно-конструкторской деятельности":"ОПКД", "Химия":"Химия",
};

const toDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const key = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = new Date(); today.setHours(0,0,0,0);
const todayKey = key(today);
const monthFmt = new Intl.DateTimeFormat("ru-RU",{month:"long",year:"numeric"});
const dayFmt = new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"numeric",month:"long"});

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if(a===1 && b!==11) return one;
  if(a>=2 && a<=4 && (b<12 || b>14)) return few;
  return many;
}
function until(d){
  const n = Math.round((d - today) / 864e5);
  if(n===0) return "сегодня";
  if(n===1) return "завтра";
  return "через "+n+" "+plural(n,"день","дня","дней");
}

let view = new Date(today.getFullYear(), today.getMonth(), 1);

function renderMonth(){
  const name = monthFmt.format(view).replace(" г.","");
  document.getElementById("month").textContent = name[0].toUpperCase() + name.slice(1);
  const cal = document.getElementById("cal");
  cal.innerHTML = ["пн","вт","ср","чт","пт","сб","вс"].map(d=>'<div class="dow">'+d+'</div>').join("");
  const shift = (view.getDay() + 6) % 7;
  const start = new Date(view.getFullYear(), view.getMonth(), 1 - shift);
  const weeks = Math.ceil((shift + new Date(view.getFullYear(), view.getMonth()+1, 0).getDate()) / 7);
  for(let i=0; i<weeks*7; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const k = key(d);
    const cell = document.createElement("div");
    cell.className = "day";
    if(d.getMonth()!==view.getMonth()) cell.classList.add("out");
    else if(d.getDay()===0 || d.getDay()===6) cell.classList.add("we");
    if(k===todayKey) cell.classList.add("today");
    if(d < today) cell.classList.add("past");
    cell.textContent = d.getDate();
    EVENTS.filter(e=>e.date===k).forEach(e=>{
      cell.classList.add("ev");
      const s = document.createElement("span");
      s.className = "e";
      s.textContent = e.kind + " · " + (SHORT[e.subject] || e.subject);
      s.title = (KIND_NAME[e.kind] || e.kind) + ": " + e.subject;
      cell.appendChild(s);
    });
    cal.appendChild(cell);
  }
}

function renderUpcoming(){
  const box = document.getElementById("upcoming");
  const list = EVENTS.filter(e=>toDate(e.date) >= today).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ box.innerHTML = '<p class="none">Пока ничего не запланировано.</p>'; return; }
  list.forEach(e=>{
    const d = toDate(e.date);
    const card = document.createElement("article");
    card.className = "ev-card";
    card.innerHTML = '<div class="top"><span></span><b></b></div><h3></h3><p></p>';
    card.querySelector(".top span").textContent = dayFmt.format(d);
    card.querySelector(".top b").textContent = until(d);
    card.querySelector("h3").textContent = KIND_NAME[e.kind] || e.kind;
    card.querySelector("p").textContent = e.subject;
    if(e.prep){
      const a = document.createElement("a");
      a.className = "prep"; a.href = "m/"+e.prep.file;
      a.innerHTML = "<span></span><span>→</span>";
      a.firstChild.textContent = e.prep.title;
      card.appendChild(a);
    }
    box.appendChild(card);
  });
}

document.getElementById("prev").onclick = ()=>{ view = new Date(view.getFullYear(), view.getMonth()-1, 1); renderMonth(); };
document.getElementById("next").onclick = ()=>{ view = new Date(view.getFullYear(), view.getMonth()+1, 1); renderMonth(); };
renderMonth(); renderUpcoming();
</script>
</body>
</html>
